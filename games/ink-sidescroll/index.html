<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🦑 インクランナーSS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a1a; overflow:hidden; touch-action:none; font-family:-apple-system,sans-serif; }
    canvas { display:block; }
    #home { position:fixed; top:8px; left:10px; color:#aaa; text-decoration:none; font-size:.75rem; background:rgba(0,0,0,.6); padding:4px 10px; border-radius:10px; z-index:20; }
    #ui { position:fixed; bottom:0; left:0; right:0; height:80px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:20; pointer-events:none; }
    #touch-left { pointer-events:all; display:none; }
    #touch-right { pointer-events:all; display:none; }
    .touch-btn { width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#fff; user-select:none; cursor:pointer; }
    #pc-hint { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); color:#444; font-size:.75rem; z-index:20; }
  </style>
</head>
<body>
<a href="../../index.html" id="home">🏠 ゲームいちらんにもどる</a>
<canvas id="c"></canvas>
<div id="ui">
  <div id="touch-left" style="display:flex;gap:8px">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
  <div id="touch-right" style="display:flex;gap:8px">
    <div class="touch-btn" id="btn-jump">↑</div>
    <div class="touch-btn" id="btn-shoot">💦</div>
  </div>
</div>
<div id="pc-hint">WASD/矢印で移動・ジャンプ　Z/Xでインク発射</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

const TILE=40,GRAVITY=0.52,PSPD=3.5,JUMPV=-11.5,INKSPD=9;
const INKC='#22aaff',ENMC='#ff4422';

const MAP_RAW=[
  '............................................................',
  '............................................................',
  '............................................................',
  '....#########.........########.......######..............###',
  '............................................................',
  '..######.............#####...........#.#.#.......########...',
  '............................................................',
  '###.....######.....######.......####.........####...........',
  '............................................................',
  '....########.....#######.......######..........#########....',
  '............................................................',
  '............................................................',
  'P..........................................................G.',
  '############################################################',
];
const MC=MAP_RAW[0].length,MR=MAP_RAW.length;
const tmap=MAP_RAW.map(r=>r.split(''));
const pmap=Array.from({length:MR},()=>new Array(MC).fill(0));
let totalP=0,pStart={x:1,y:MR-2},goal={x:MC-2,y:MR-2};
for(let r=0;r<MR;r++)for(let c=0;c<MC;c++){
  if(tmap[r][c]==='P'){pStart={x:c,y:r};tmap[r][c]='.';}
  if(tmap[r][c]==='G'){goal={x:c,y:r};tmap[r][c]='.';}
}
for(let r=1;r<MR;r++)for(let c=0;c<MC;c++)if(tmap[r][c]==='#'&&tmap[r-1][c]==='.')totalP++;

const pl={x:0,y:0,vx:0,vy:0,w:24,h:32,gr:false,dir:1,cool:0,af:0};
const enms=[];
for(let c=12;c<MC-8;c+=14)for(let r=MR-2;r>=0;r--)if(tmap[r][c]==='#'&&tmap[r-1][c]==='.'){enms.push({x:c*TILE+TILE/2,y:(r-1)*TILE+TILE,ox:c*TILE+TILE/2,vx:-1.2,vy:0,gr:false,hp:2,fl:0,dead:false,dir:-1});break;}
const shots=[],parts=[];
let camX=0,gst='play',sc=0,painted=0,fr=0,pJ=false,pS=false;

const keys={},tb={left:false,right:false,jump:false,shoot:false};
const isT='ontouchstart' in window;
if(isT){
  document.getElementById('touch-left').style.display='flex';
  document.getElementById('touch-right').style.display='flex';
  document.getElementById('pc-hint').style.display='none';
  ['left','right','jump','shoot'].forEach(k=>{
    const el=document.getElementById('btn-'+k);
    el.addEventListener('touchstart',e=>{e.preventDefault();tb[k]=true;},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();tb[k]=false;},{passive:false});
  });
}
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const ik=k=>k==='left'?keys['a']||keys['arrowleft']||tb.left:k==='right'?keys['d']||keys['arrowright']||tb.right:k==='jump'?keys['w']||keys['arrowup']||keys[' ']||tb.jump:keys['z']||keys['x']||tb.shoot;

let ac=null;
function ia(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}
function bp(f,d,v,t){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}

function solid(c,r){if(c<0||c>=MC||r<0||r>=MR)return r>=MR;return tmap[r][c]==='#';}
function move(e,w,h){
  e.x+=e.vx;
  const rT=Math.floor((e.y-h)/TILE),rB=Math.floor((e.y-1)/TILE);
  if(e.vx>0){const c=Math.floor((e.x+w/2)/TILE);for(let r=rT;r<=rB;r++)if(solid(c,r)){e.x=c*TILE-w/2;e.vx=0;break;}}
  else if(e.vx<0){const c=Math.floor((e.x-w/2)/TILE);for(let r=rT;r<=rB;r++)if(solid(c,r)){e.x=(c+1)*TILE+w/2;e.vx=0;break;}}
  e.vy=Math.min(e.vy+GRAVITY,18);e.y+=e.vy;e.gr=false;
  const cL=Math.floor((e.x-w/2+2)/TILE),cR=Math.floor((e.x+w/2-2)/TILE);
  if(e.vy>0){const r=Math.floor(e.y/TILE);for(let c=cL;c<=cR;c++)if(solid(c,r)){e.y=r*TILE;e.vy=0;e.gr=true;break;}}
  else if(e.vy<0){const r=Math.floor((e.y-h)/TILE);for(let c=cL;c<=cR;c++)if(solid(c,r)){e.y=(r+1)*TILE+h;e.vy=0;break;}}
}
function pt(c,r,t){if(c<0||c>=MC||r<0||r>=MR||tmap[r][c]!=='#')return;if(r>0&&tmap[r-1][c]==='.'){if(pmap[r][c]===0&&t===1)painted++;if(pmap[r][c]===1&&t===2)painted--;pmap[r][c]=t;}}
function fire(){if(pl.cool>0)return;pl.cool=12;const a=pl.dir===1?0.1:Math.PI-0.1;shots.push({x:pl.x+pl.dir*14,y:pl.y-pl.h*0.5,vx:Math.cos(a)*INKSPD,vy:Math.sin(a)*INKSPD-2,life:35});bp(480,0.06,0.15,'triangle');}

function reset(){
  for(let r=0;r<MR;r++)for(let c=0;c<MC;c++)pmap[r][c]=0;
  painted=0;sc=0;fr=0;pl.x=pStart.x*TILE+TILE/2;pl.y=pStart.y*TILE;pl.vx=0;pl.vy=0;pl.dir=1;pl.cool=0;
  enms.forEach(e=>{e.hp=2;e.dead=false;e.fl=0;e.x=e.ox;e.vy=0;});
  shots.length=0;parts.length=0;camX=0;gst='play';pJ=false;pS=false;
}

function update(){
  fr++;if(gst!=='play')return;
  const jD=ik('jump'),sD=ik('shoot');
  if(jD&&!pJ&&pl.gr){pl.vy=JUMPV;bp(330,0.08,0.2,'square');}
  if(sD&&!pS)fire();
  pJ=jD;pS=sD;
  let dx=0;if(ik('left')){dx=-1;pl.dir=-1;}if(ik('right')){dx=1;pl.dir=1;}
  pl.vx=dx*PSPD;if(pl.cool>0)pl.cool--;pl.af=(fr/6|0)%4;
  move(pl,pl.w,pl.h);
  pl.x=Math.max(TILE,Math.min((MC-1)*TILE,pl.x));
  if(pl.gr){const c=Math.floor(pl.x/TILE),r=Math.floor(pl.y/TILE);pt(c,r,1);pt(c-1,r,1);pt(c+1,r,1);}
  const gx=goal.x*TILE+TILE/2,gy=goal.y*TILE;
  if(Math.hypot(pl.x-gx,pl.y-gy)<TILE*1.2){sc+=Math.round(painted/Math.max(1,totalP)*100);gst='clear';[523,659,784,1047].forEach((f,i)=>setTimeout(()=>{ia();bp(f,0.3,0.25,'triangle');},i*120));}
  if(pl.y>MR*TILE+100){gst='over';ia();bp(200,0.5,0.3,'sawtooth');}
  enms.forEach(e=>{
    if(e.dead)return;if(e.fl>0)e.fl--;
    e.vx=e.dir*1.3;move(e,24,32);
    if(e.vx===0)e.dir*=-1;
    if(e.gr&&fr%8===0){const c=Math.floor(e.x/TILE),r=Math.floor(e.y/TILE);pt(c,r,2);}
    if(Math.hypot(pl.x-e.x,pl.y-e.y)<28){gst='over';ia();bp(120,0.6,0.4,'sawtooth');}
  });
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];s.vy+=0.4;s.x+=s.vx;s.y+=s.vy;s.life--;
    const sc2=Math.floor(s.x/TILE),sr=Math.floor(s.y/TILE);
    if(solid(sc2,sr)||s.life<=0){
      for(let dc=-1;dc<=1;dc++)pt(sc2+dc,sr,1);pt(sc2,sr-1,1);
      for(let p=0;p<6;p++)parts.push({x:s.x,y:s.y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,life:20,col:INKC,r:3+Math.random()*3});
      enms.forEach(e=>{if(e.dead)return;if(Math.hypot(s.x-e.x,s.y-e.y)<28){e.hp--;e.fl=15;bp(600,0.08,0.2,'square');if(e.hp<=0){e.dead=true;sc+=200;for(let p=0;p<12;p++)parts.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*6,vy:-Math.random()*5-1,life:35,col:INKC,r:4+Math.random()*4});}}});
      shots.splice(i,1);
    }
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;if(p.life<=0)parts.splice(i,1);}
  camX+=(pl.x-W*0.35-camX)*0.12;camX=Math.max(0,Math.min(MC*TILE-W,camX));
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  const oy=H-MR*TILE;
  ctx.save();ctx.translate(-camX,oy);
  const s0=Math.max(0,Math.floor(camX/TILE)-1),s1=Math.min(MC-1,Math.floor((camX+W)/TILE)+1);
  for(let r=0;r<MR;r++)for(let c=s0;c<=s1;c++){
    const tx=c*TILE,ty=r*TILE;
    if(tmap[r][c]==='#'){
      ctx.fillStyle='#223344';ctx.fillRect(tx,ty,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(tx,ty,TILE,3);
      if(r>0&&tmap[r-1][c]==='.'&&pmap[r][c]){ctx.fillStyle=pmap[r][c]===1?INKC:ENMC;ctx.globalAlpha=0.85;ctx.fillRect(tx,ty,TILE,7);ctx.globalAlpha=1;}
    }
  }
  // Goal
  const gx=goal.x*TILE,gy=goal.y*TILE;
  ctx.fillStyle='#ffdd00';ctx.fillRect(gx+TILE/2-2,gy-42,4,42);
  ctx.fillStyle='#ff8800';ctx.fillRect(gx+TILE/2,gy-42,18,14);
  ctx.font=`${TILE*0.9}px sans-serif`;ctx.textAlign='center';ctx.fillText('🏁',gx+TILE/2,gy-8);
  // Enemies
  enms.forEach(e=>{
    if(e.dead)return;
    ctx.save();if(e.fl>0)ctx.globalAlpha=0.4+0.6*(e.fl%4<2?1:0);
    ctx.save();if(e.dir<0){ctx.scale(-1,1);ctx.translate(-e.x*2,0);}
    ctx.fillStyle=ENMC;ctx.beginPath();ctx.ellipse(e.x,e.y-16,12,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(e.x+4,e.y-20,4,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(e.x+5,e.y-19,2.5,0,Math.PI*2);ctx.fill();
    for(let t=0;t<4;t++){const lx=e.x-6+t*4,wv=Math.sin(fr*0.15+t*1.5)*3;ctx.strokeStyle=ENMC;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx,e.y-2);ctx.lineTo(lx+wv,e.y+10);ctx.stroke();}
    ctx.restore();ctx.restore();
  });
  // Player
  ctx.save();ctx.translate(pl.x,pl.y);if(pl.dir<0)ctx.scale(-1,1);
  ctx.globalAlpha=0.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,0,14,4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=INKC;ctx.beginPath();ctx.ellipse(0,-pl.h*0.5,pl.w/2*0.85,pl.h/2*0.85,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(6,-pl.h*0.65,5,6,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#003366';ctx.beginPath();ctx.arc(7,-pl.h*0.63,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-pl.h*0.66,1,0,Math.PI*2);ctx.fill();
  for(let t=0;t<4;t++){const lx=-6+t*4,wv=pl.gr?Math.sin(fr*0.2+t*1.2)*3:Math.sin(t*1.5)*2;ctx.strokeStyle=INKC;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lx,-4);ctx.lineTo(lx+wv,-14);ctx.stroke();}
  ctx.fillStyle='#115588';ctx.fillRect(8,-pl.h*0.52,16,6);ctx.fillStyle='#1177aa';ctx.fillRect(22,-pl.h*0.54,5,10);
  ctx.restore();
  shots.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fillStyle=INKC;ctx.fill();ctx.globalAlpha=0.4;ctx.beginPath();ctx.arc(s.x,s.y,9,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  parts.forEach(p=>{ctx.globalAlpha=p.life/35;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.restore();
  // HUD
  const pct=totalP>0?Math.round(painted/totalP*100):0;
  const mW=Math.min(W*0.4,180),mH=18,mX=(W-mW)/2,mY=12;
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(mX-2,mY-2,mW+4,mH+4);
  ctx.fillStyle='#223';ctx.fillRect(mX,mY,mW,mH);
  ctx.fillStyle=INKC;ctx.fillRect(mX,mY,mW*pct/100,mH);
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.strokeRect(mX,mY,mW,mH);
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
  ctx.fillText('🎨 '+pct+'% ぬった',W/2,mY+mH-3);
  ctx.fillStyle='#ffdd00';ctx.font='bold 15px monospace';ctx.textAlign='right';
  ctx.fillText(sc.toLocaleString()+'点',W-10,30);
  if(gst==='clear'){
    ctx.fillStyle='rgba(0,0,50,0.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=INKC;ctx.font=`bold ${Math.min(W*0.12,56)}px serif`;ctx.textAlign='center';
    ctx.shadowColor=INKC;ctx.shadowBlur=30;ctx.fillText('🎉 クリア！！',W/2,H*0.36);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.min(W*0.065,30)}px monospace`;ctx.fillText(pct+'% ぬれた！',W/2,H*0.5);
    const rk=pct>=80?'🏆 インクマスター！':pct>=50?'😎 いい感じ！':'🦑 もっとぬろう！';
    ctx.fillStyle='#ffcc88';ctx.font=`${Math.min(W*0.05,22)}px sans-serif`;ctx.fillText(rk,W/2,H*0.62);
    ctx.fillStyle='#888';ctx.font=`${Math.min(W*0.038,16)}px sans-serif`;ctx.fillText('タップでもういっかい',W/2,H*0.76);
  }
  if(gst==='over'){
    ctx.fillStyle='rgba(30,0,0,0.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff4444';ctx.font=`bold ${Math.min(W*0.1,48)}px serif`;ctx.textAlign='center';
    ctx.shadowColor='#ff0000';ctx.shadowBlur=20;ctx.fillText('やられた…！',W/2,H*0.38);ctx.shadowBlur=0;
    ctx.fillStyle='#aaa';ctx.font=`${Math.min(W*0.04,18)}px sans-serif`;ctx.fillText('タップでもういっかい',W/2,H*0.56);
  }
}
canvas.addEventListener('mousedown',()=>{ia();if(gst!=='play')reset();});
canvas.addEventListener('touchstart',e=>{e.preventDefault();ia();if(gst!=='play')reset();},{passive:false});
reset();
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
