// Audio
let AC = null;
function initAudio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type='sine', vol=0.2, delay=0) {
  if (!AC) return;
  try {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + delay + dur);
    o.start(AC.currentTime + delay);
    o.stop(AC.currentTime + delay + dur + 0.05);
  } catch(e){}
}
function soundAdd() { beep(440, 0.08, 'square', 0.15); }
function soundRemove() { beep(300, 0.08, 'square', 0.15); }
function soundStep(i) { beep(550 + i*30, 0.1, 'sine', 0.15); }
function soundStar() { beep(880, 0.15, 'sine', 0.2); beep(1100, 0.1, 'sine', 0.15, 0.15); }
function soundFail() {
  beep(300, 0.1, 'sawtooth', 0.2);
  beep(240, 0.1, 'sawtooth', 0.2, 0.1);
  beep(180, 0.15, 'sawtooth', 0.2, 0.2);
}
function soundClear() {
  [523,659,784,1047].forEach((f,i) => beep(f, 0.2, 'sine', 0.2, i*0.1));
}

const BASE_W = 480, BASE_H = 640;
let scale = 1;
function resizeCanvas() {
  const pw = window.innerWidth, ph = window.innerHeight;
  scale = Math.min(pw / BASE_W, ph / BASE_H, 2);
  canvas.width = Math.round(BASE_W * scale);
  canvas.height = Math.round(BASE_H * scale);
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); draw(); });

let unlockedLevel = 1;
let starsPerLevel = {};
let levelSelectPage = 0;
const LEVELS_PER_PAGE = 15;

// Load from localStorage
function loadProgress() {
  const ul = localStorage.getItem('robot_prog_level');
  if (ul) unlockedLevel = Math.max(1, parseInt(ul));
  for (let i = 0; i < LEVELS.length; i++) {
    const s = localStorage.getItem('robot_prog_stars_' + i);
    starsPerLevel[i] = s ? parseInt(s) : 0;
  }
}
function saveProgress(levelIdx, stars) {
  if (levelIdx < 0) return; // free play
  if (levelIdx + 1 > unlockedLevel && levelIdx + 1 <= LEVELS.length) {
    unlockedLevel = levelIdx + 1;
    localStorage.setItem('robot_prog_level', unlockedLevel);
  }
  if ((starsPerLevel[levelIdx] || 0) < stars) {
    starsPerLevel[levelIdx] = stars;
    localStorage.setItem('robot_prog_stars_' + levelIdx, stars);
  }
}
loadProgress();

// =====================================================
// GRID HELPERS
// =====================================================
const GRID_COLS = 7, GRID_ROWS = 7;
const CELL = 39;
const GRID_X = Math.round((BASE_W - GRID_COLS * CELL) / 2);
const GRID_Y = 58;

function gridToPixel(row, col) {
  return {
    x: GRID_X + col * CELL + CELL/2,
    y: GRID_Y + row * CELL + CELL/2,
  };
}

function getCurrentMap() {
  return currentLevel === -1 ? FREE_PLAY_MAP : LEVELS[currentLevel];
}

function initLevel(idx) {
  currentLevel = idx;
  const lv = getCurrentMap();
  gridState = lv.grid.map(row => [...row]);
  lv.stars.forEach(s => { gridState[s.row][s.col] = 2; });

  robotPos = {row: sp.row, col: sp.col, dir: sp.dir};
  const p = gridToPixel(sp.row, sp.col);
  robotAnim = {x: p.x, y: p.y, targetX: p.x, targetY: p.y,
    progress: 1, flashColor: null, flashTimer: 0,
    spinning: false, spinAngle: 0, bounceY: 0};
  program = [];
  execState = {running:false, step:0, expandedProgram:[], timer:0,
    phase:'idle', failMsg:'', succeeded:false, currentSlot:-1};
  resultMsg = '';
  confetti = [];
}

function countStars() {
  return getCurrentMap().stars.length;
}
function collectedStarCount() {
  return starCollected.filter(Boolean).length;

// =====================================================
// CMD LIMITS HELPERS
// =====================================================
function getCmdLimit(cmd) {
  const lv = getCurrentMap();
  if (!lv.cmdLimits) return Infinity;
  const v = lv.cmdLimits[cmd];
  return (v !== undefined) ? v : Infinity;
}
function getCmdUsed(cmd) {
  return program.filter(c => c === cmd).length;
}

// =====================================================
// EXECUTION LOGIC
// =====================================================
function buildExpandedProgram() {
  const hasRepeat2 = program.includes('repeat2');
  const hasRepeat3 = program.includes('repeat3');

  if (hasRepeat2 || hasRepeat3) {
    // Base = program without any repeat commands
    const base = program.filter(c => c !== 'repeat2' && c !== 'repeat3');
    if (hasRepeat3) {
      return [...base, ...base, ...base];
    } else {
      return [...base, ...base];
    }
  }
  return [...program];
}

function startExecution() {
  if (execState.running) return;
  initAudio();
  const lv = getCurrentMap();
  gridState = lv.grid.map(row => [...row]);
  lv.stars.forEach(s => { gridState[s.row][s.col] = 2; });
  starCollected = new Array(lv.stars.length).fill(false);
  const sp = lv.start;
  robotPos = {row: sp.row, col: sp.col, dir: sp.dir};
  const p = gridToPixel(sp.row, sp.col);
  robotAnim.x = p.x; robotAnim.y = p.y;
  robotAnim.targetX = p.x; robotAnim.targetY = p.y;
  robotAnim.progress = 1;
  robotAnim.flashColor = null; robotAnim.flashTimer = 0;
  robotAnim.spinning = false; robotAnim.spinAngle = 0;

  const expanded = buildExpandedProgram();
  if (expanded.length === 0) {
    resultMsg = 'プログラムが空だよ！';
    resultColor = '#f39c12';
    return;
  }
  execState = {
    running: true,
    step: 0,
    expandedProgram: expanded,
    timer: 0,
    phase: 'start_step',
    failMsg: '',
    succeeded: false,
    currentSlot: 0,
  };
  resultMsg = '';
}

const STEP_DUR = 400; // ms per step

function updateExecution(dt) {
  if (!execState.running) return;

  if (execState.phase === 'start_step') {
    const cmd = execState.expandedProgram[execState.step];
    execState.currentSlot = findOriginalSlot(execState.step, execState.expandedProgram);
    soundStep(execState.step);

    robotAnim._fromX = robotAnim.targetX;
    robotAnim._fromY = robotAnim.targetY;

    const result = applyCommand(cmd);

    if (result === 'fail') {
      execState.running = false;
      execState.phase = 'idle';
      robotAnim.flashColor = '#e74c3c';
      robotAnim.flashTimer = 600;
      resultMsg = execState.failMsg || 'ざんねん！💥';
      resultColor = '#e74c3c';
      soundFail();
    } else if (result === 'goal') {
      execState.running = false;
      execState.phase = 'idle';
      if (currentLevel === -1) {
        // Free play
        execState.succeeded = true;
        resultMsg = 'クリア！自由にためしてね！';
        resultColor = '#2ecc71';
        soundClear();
        robotAnim.spinning = true; robotAnim.spinAngle = 0;
        spawnConfetti();
      } else {
        const totalStars = countStars();
        const collected = collectedStarCount();
        const stars = (totalStars === 0 || collected >= totalStars) ? 3 : 1;
        saveProgress(currentLevel, stars);
        execState.succeeded = true;
        resultMsg = 'クリア！！🎉';
        resultColor = '#2ecc71';
        soundClear();
        robotAnim.spinning = true; robotAnim.spinAngle = 0;
        spawnConfetti();
      }
    } else {
      execState.timer = 0;
      execState.phase = 'animating';
    }
    return;
  }

  if (execState.phase === 'animating') {
    execState.timer += dt;
    if (execState.timer >= STEP_DUR) {
      execState.step++;
      if (execState.step >= execState.expandedProgram.length) {
        execState.running = false;
        execState.phase = 'idle';
        execState.currentSlot = -1;
        resultMsg = collectedStarCount() < countStars() ? '⭐をぜんぶとって！' : 'ゴールまでたどり着けなかった…';
        resultColor = '#e74c3c';
        robotAnim.flashColor = '#e74c3c';
        robotAnim.flashTimer = 600;
        soundFail();
      } else {
        execState.phase = 'start_step';
      }
    }
  }
}

function applyCommand(cmd) {
  if (cmd === 'turnR') {
    robotPos.dir = (robotPos.dir + 1) % 4;
    return 'ok';
  }
  if (cmd === 'turnL') {
    robotPos.dir = (robotPos.dir + 3) % 4;
    return 'ok';
  }
  if (cmd === 'turnB') {
    robotPos.dir = (robotPos.dir + 2) % 4;
    return 'ok';
  }
  if (cmd === 'forward') {
    const nr = robotPos.row + DIR_DR[robotPos.dir];
    const nc = robotPos.col + DIR_DC[robotPos.dir];
    return moveRobot(nr, nc);
  }
  if (cmd === 'jump') {
    const mr = robotPos.row + DIR_DR[robotPos.dir];
    const mc = robotPos.col + DIR_DC[robotPos.dir];
    if (mr < 0 || mr >= GRID_ROWS || mc < 0 || mc >= GRID_COLS) {
      execState.failMsg = 'とびこえるものがないよ！💥';
      return 'fail';
    }
    const middleCell = gridState[mr][mc];
    const nr = robotPos.row + DIR_DR[robotPos.dir]*2;
    const nc = robotPos.col + DIR_DC[robotPos.dir]*2;
    if (middleCell === 5) {
      return moveRobot(nr, nc, true);
    } else if (middleCell === 0 || middleCell === 2 || middleCell === 3) {
      return moveRobot(mr, mc);
    } else {
      execState.failMsg = 'かべにぶつかった！💥';
      return 'fail';
    }
  }
  return 'ok';
}

function moveRobot(nr, nc, jumped) {
  if (nr < 0 || nr >= GRID_ROWS || nc < 0 || nc >= GRID_COLS) {
    execState.failMsg = 'かべにぶつかった！💥';
    return 'fail';
  }
  const cell = gridState[nr][nc];
  if (cell === 1) {
    execState.failMsg = 'かべにぶつかった！💥';
    return 'fail';
  }
  if (cell === 4) {
    robotPos.row = nr; robotPos.col = nc;
    const p = gridToPixel(nr, nc);
    robotAnim.targetX = p.x; robotAnim.targetY = p.y;
    execState.failMsg = 'あなに落ちた！💀';
    return 'fail';
  }
  robotPos.row = nr; robotPos.col = nc;
  const p = gridToPixel(nr, nc);
  robotAnim.targetX = p.x; robotAnim.targetY = p.y;

  if (cell === 2) {
    const lv = getCurrentMap();
    const si = lv.stars.findIndex(s => s.row === nr && s.col === nc);
    if (si >= 0 && !starCollected[si]) {
      starCollected[si] = true;
      gridState[nr][nc] = 0;
      robotAnim.flashColor = '#f1c40f';
      robotAnim.flashTimer = 300;
      soundStar();
    }
    return 'ok';
  }
  if (cell === 3) {
    if (collectedStarCount() < countStars()) {
      execState.failMsg = '⭐をぜんぶとって！';
      return 'fail';
    }
    return 'goal';
  }
  return 'ok';
}

function findOriginalSlot(expandedStep, expanded) {
  const hasRepeat2 = program.includes('repeat2');
  const hasRepeat3 = program.includes('repeat3');
  if (!hasRepeat2 && !hasRepeat3) {
    return Math.min(expandedStep, program.length - 1);
  }
  const base = program.filter(c => c !== 'repeat2' && c !== 'repeat3');
  const baseLen = base.length;
  if (baseLen === 0) return 0;
  const posInBase = expandedStep % baseLen;
  let count = 0;
  for (let i = 0; i < program.length; i++) {
    if (program[i] !== 'repeat2' && program[i] !== 'repeat3') {
      if (count === posInBase) return i;
      count++;
    }
  }
  return 0;
}

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}
function lerp(a, b, t) { return a + (b-a)*t; }

function draw() {
  ctx.save();
  ctx.scale(scale, scale);

  // Background
  const bg = ctx.createLinearGradient(0,0,BASE_W,BASE_H);
  bg.addColorStop(0,'#1a0a3a');
  bg.addColorStop(1,'#0d1a4a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,BASE_W,BASE_H);

  if (gameState === 'title')       drawTitle();
  else if (gameState === 'modeSelect')  drawModeSelect();
  else if (gameState === 'levelSelect') drawLevelSelect();
  else if (gameState === 'playing')     drawPlaying();
  else if (gameState === 'freePlay')    drawPlaying(); // reuse same draw

  ctx.restore();
}

// ---- PLAYING SCREEN ----
function drawPlaying() {
  const lv = getCurrentMap();
  const isFree = currentLevel === -1;

  // Header
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  const displayName = isFree ? '🎮 じゆうあそびモード' : `Lv.${currentLevel+1} ${lv.name}`;
  ctx.fillText(displayName, 12, 35);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#a0c4ff';
  ctx.font = '13px sans-serif';
  const totalStars = countStars();
  if (totalStars > 0) {
    const col = collectedStarCount();
    ctx.fillText(`⭐ ${col}/${totalStars}`, BASE_W - 12, 35);
  }

  // Grid
  drawGrid();

  // Robot - smooth lerp animation
  let rx = robotAnim.targetX, ry = robotAnim.targetY;
  if (execState.phase === 'animating' && robotAnim._fromX !== undefined) {
    const t = easeInOut(Math.min(execState.timer / STEP_DUR, 1));
    rx = lerp(robotAnim._fromX, robotAnim.targetX, t);
    ry = lerp(robotAnim._fromY, robotAnim.targetY, t);
    const curCmd = execState.expandedProgram[execState.step];
    if (curCmd === 'forward' || curCmd === 'jump') {
      ry -= Math.sin(t * Math.PI) * 8;
    }
  }
  let flashC = null;
  if (robotAnim.flashTimer > 0) {
    robotAnim.flashTimer -= 16;
    flashC = robotAnim.flashColor;
  }
  let spin = 0;
  if (robotAnim.spinning) {
    robotAnim.spinAngle += 0.08;
    spin = robotAnim.spinAngle;
    if (robotAnim.spinAngle > Math.PI * 4) robotAnim.spinning = false;
  }
  drawRobot(rx, ry, robotPos.dir, spin, flashC, 0);

  // Divider
  ctx.fillStyle = '#8888cc';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('↓ プログラムをつくろう！', BASE_W/2, 345);

  // Program slots
  drawProgramSlots();

  // Hint text
  ctx.fillStyle = 'rgba(160,180,255,0.75)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('💡 ' + lv.hint, BASE_W/2, 425);

  // Command palette
  drawCommandPalette();

  // Action row
  drawActionRow();

  // Confetti
  updateConfetti();
  confetti.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot * Math.PI/180);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
    ctx.restore();
  });

  // Success overlay
  if (execState.succeeded) {
    drawSuccessOverlay();
  }
}

function drawGrid() {
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const x = GRID_X + c * CELL;
      const y = GRID_Y + r * CELL;
      const cell = gridState[r][c];

      if (cell === 1) {
        const grad = ctx.createLinearGradient(x,y,x+CELL,y+CELL);
        grad.addColorStop(0,'#222');
        grad.addColorStop(1,'#111');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(x, y, CELL, 3);
        ctx.fillRect(x, y, 3, CELL);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x+CELL-3, y, 3, CELL);
        ctx.fillRect(x, y+CELL-3, CELL, 3);
      } else {
        ctx.fillStyle = '#1e1e38';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x+0.25, y+0.25, CELL-0.5, CELL-0.5);

        const cx = x + CELL/2, cy = y + CELL/2;

        if (cell === 2) {
          ctx.save();
          ctx.shadowColor = '#f1c40f';
          ctx.shadowBlur = 12;
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('⭐', cx, cy);
          ctx.restore();
        } else if (cell === 3) {
          ctx.fillStyle = '#1a3a2a';
          ctx.fillRect(x+1, y+1, CELL-2, CELL-2);
          ctx.save();
          ctx.shadowColor = '#2ecc71';
          ctx.shadowBlur = 10;
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🚩', cx, cy);
          ctx.restore();
        } else if (cell === 4) {
          const hg = ctx.createRadialGradient(cx, cy, 2, cx, cy, CELL/2);
          hg.addColorStop(0,'#050510');
          hg.addColorStop(1,'#1a1a2e');
          ctx.fillStyle = hg;
          ctx.beginPath();
          ctx.ellipse(cx, cy, CELL/2-4, CELL/2-6, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.font = '18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🕳', cx, cy);
        } else if (cell === 5) {
          ctx.fillStyle = '#5c3d11';
          ctx.fillRect(x+3, y+3, CELL-6, CELL-6);
          ctx.strokeStyle = '#8B5E3C';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x+3, y+3, CELL-6, CELL-6);
          ctx.strokeStyle = 'rgba(139,94,60,0.3)';
          ctx.lineWidth = 1;
          for (let g = 0; g < 3; g++) {
            ctx.beginPath();
            ctx.moveTo(x+5+g*8, y+5);
            ctx.lineTo(x+5+g*8, y+CELL-5);
            ctx.stroke();
          }
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('📦', cx, cy);
        }
      }
    }
  }
}

function drawRobot(x, y, dir, spin, flashColor, bounceY) {
  ctx.save();
  ctx.translate(x, y - bounceY);
  if (spin) ctx.rotate(spin);

  const s = 30;
  const bodyColor = flashColor || '#4a9eff';
  ctx.fillStyle = bodyColor;
  drawRoundRectFill(ctx, -s/2, -s/2, s, s, 7);

  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  drawRoundRectFill(ctx, -s/2+2, -s/2+2, s/2, s/3, 4);

  ctx.fillStyle = 'rgba(255,100,100,0.5)';
  ctx.beginPath(); ctx.arc(-8, 5, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, 5, 4, 0, Math.PI*2); ctx.fill();

  let eyeOffX = 0, eyeOffY = 0;
  let pupilDX = 0, pupilDY = 0;
  if (dir === 0) { eyeOffY = -1; pupilDY = -2; }
  if (dir === 1) { eyeOffX = 1; pupilDX = 2; }
  if (dir === 2) { eyeOffY = 1; pupilDY = 2; }
  if (dir === 3) { eyeOffX = -1; pupilDX = -2; }

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-7 + eyeOffX, -4 + eyeOffY, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7 + eyeOffX, -4 + eyeOffY, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a3e';
  ctx.beginPath(); ctx.arc(-7+eyeOffX+pupilDX, -4+eyeOffY+pupilDY, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7+eyeOffX+pupilDX, -4+eyeOffY+pupilDY, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-6+eyeOffX+pupilDX, -5+eyeOffY+pupilDY, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8+eyeOffX+pupilDX, -5+eyeOffY+pupilDY, 1.2, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#a0c4ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -s/2);
  ctx.lineTo(0, -s/2 - 8);
  ctx.stroke();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(0, -s/2 - 10, 3.5, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (flashColor === '#e74c3c') {
    ctx.arc(0, 12, 5, Math.PI * 0.1, Math.PI * 0.9, true);
  } else {
    ctx.arc(0, 8, 5, Math.PI * 0.1, Math.PI * 0.9, false);
  }
  ctx.stroke();

  ctx.restore();
}

function drawProgramSlots() {
  const lv = getCurrentMap();
  const maxSlots = lv.maxSlots;
  const slotW = Math.min(36, Math.floor((BASE_W - 20) / maxSlots) - 2);
  const gap = 2;
  const totalW = maxSlots * (slotW + gap) - gap;
  const sx = (BASE_W - totalW) / 2;
  const sy = 353;

  for (let i = 0; i < maxSlots; i++) {
    const x = sx + i * (slotW + gap);
    const slotH = 42;
    const isExecuting = execState.running && execState.currentSlot === i;
    const pressing = slotPress[i];

    let bgColor = '#1a1a38';
    if (isExecuting) bgColor = '#4a3a00';
    else if (program[i]) bgColor = '#1e2a4e';

    drawRoundRect(ctx, x + (pressing?1:0), sy + (pressing?1:0), slotW, slotH, 7, bgColor);

    ctx.strokeStyle = isExecuting ? '#f1c40f' : (program[i] ? '#4a6aaa' : '#333');
    ctx.lineWidth = isExecuting ? 2.5 : 1.5;
    strokeRoundRect(ctx, x + (pressing?1:0), sy + (pressing?1:0), slotW, slotH, 7);

    if (program[i]) {
      const def = CMD_DEFS[program[i]];
      const short = def.label.length > 4 ? def.label.slice(0,4) : def.label;
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(7, slotW > 28 ? 9 : 7)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(short, x + slotW/2 + (pressing?1:0), sy + slotH*0.45 + (pressing?1:0));
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.arc(x + slotW/2 + (pressing?1:0), sy + slotH*0.75 + (pressing?1:0), 4, 0, Math.PI*2);
      ctx.fill();
    } else if (i < maxSlots) {
      ctx.fillStyle = '#333';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(i+1, x + slotW/2, sy + slotH/2 + 3);
    }

    if (isExecuting) {
      ctx.fillStyle = 'rgba(255,220,0,0.15)';
      drawRoundRectFill(ctx, x, sy, slotW, slotH, 7);
    }
  }
}

function drawCommandPalette() {
  const lv = getCurrentMap();
  const cmds = lv.availableCmds;
  const btnW = 86, btnH = 44, gap = 5;
  const cols = Math.min(cmds.length, 3);
  const rows = Math.ceil(cmds.length / cols);
  const totalW = cols * btnW + (cols-1)*gap;
  const sx = (BASE_W - totalW) / 2;
  const sy = 435;
  const dimmed = execState.running;

  for (let i = 0; i < cmds.length; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = sx + col * (btnW + gap);
    const y = sy + row * (btnH + gap);
    const cmd = cmds[i];
    const def = CMD_DEFS[cmd];
    const pressing = cmdBtnPress[cmd];

    const limit = getCmdLimit(cmd);
    const used = getCmdUsed(cmd);
    const limitReached = (limit !== Infinity) && (used >= limit);
    const isDimmed = dimmed || limitReached;

    ctx.globalAlpha = isDimmed ? 0.4 : 1.0;
    drawRoundRect(ctx, x + (pressing?2:0), y + (pressing?2:0), btnW, btnH, 8, def.dark);
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 1.5;
    strokeRoundRect(ctx, x + (pressing?2:0), y + (pressing?2:0), btnW, btnH, 8);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.label, x + btnW/2 + (pressing?2:0), y + btnH*0.52 + (pressing?2:0));

    // Show remaining count badge if limit exists
    if (limit !== Infinity) {
      const remaining = Math.max(0, limit - used);
      ctx.font = '9px sans-serif';
      ctx.fillStyle = limitReached ? '#ff6666' : '#ffddaa';
      ctx.fillText(`のこり${remaining}`, x + btnW/2 + (pressing?2:0), y + btnH*0.82 + (pressing?2:0));
    }

    ctx.globalAlpha = 1.0;
  }
}

function drawActionRow() {
  const sy = 580;
  const isFree = currentLevel === -1;

  if (execState.succeeded) {
    if (isFree) {
      // Free play: just retry
      drawButton(ctx, BASE_W/2 - 75, sy, 150, 44, '🔄 もう一回', '#3a1a1a', '#e67e22', false);
      drawButton(ctx, 20, sy, 130, 44, '← モードへ', '#2a1a3a', '#9b59b6', false);
    } else {
      if (currentLevel < LEVELS.length - 1) {
        drawButton(ctx, 10, sy, 185, 44, 'つぎのレベル →', '#1a2a3a', '#3498db', false);
      }
      drawButton(ctx, BASE_W - 200, sy, 190, 44, '🔄 もう一回', '#3a1a1a', '#e67e22', false);
      drawButton(ctx, BASE_W/2 - 70, sy + 50, 140, 36, 'レベルせんたく', '#2a1a3a', '#9b59b6', false);
    }
  } else {
    ctx.globalAlpha = execState.running ? 0.4 : 1.0;
    drawButton(ctx, 10, sy, 100, 44, '🗑 クリア', '#3a1a1a', '#e74c3c', false);
    ctx.globalAlpha = 1.0;

    ctx.globalAlpha = execState.running ? 0.6 : 1.0;
    const runLabel = execState.running ? '実行中…' : '▶ 実行！';
    drawButton(ctx, BASE_W/2 - 60, sy, 120, 44, runLabel, '#1a3a1a', '#2ecc71', false);
    ctx.globalAlpha = 1.0;

    // Back to mode select (small)
    drawButton(ctx, BASE_W - 110, sy, 100, 44, '← もどる', '#221a2e', '#8855cc', false);
  }

  // Result message
  if (resultMsg && !execState.succeeded) {
    ctx.fillStyle = resultColor || '#e74c3c';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(resultMsg, BASE_W/2, sy + 62);
  }
}

function drawSuccessOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 185, BASE_W, 130);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#2ecc71';
  ctx.font = 'bold 34px sans-serif';
  const isFree = currentLevel === -1;
  ctx.fillText(isFree ? 'クリア！🎉' : 'クリア！！🎉', BASE_W/2, 240);

  if (!isFree) {
    const earned = starsPerLevel[currentLevel] || 0;
    ctx.font = '30px sans-serif';
    let starStr = '';
    for (let j = 0; j < 3; j++) starStr += (j < earned ? '★' : '☆');
    ctx.fillStyle = '#f1c40f';
    ctx.fillText(starStr, BASE_W/2, 282);
  } else {
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#a0ffc4';
    ctx.fillText('じゆうにためしてね！', BASE_W/2, 280);
  }
}

// =====================================================
// UTILITY DRAW HELPERS
// =====================================================
function drawRoundRect(ctx, x, y, w, h, r, fillColor) {
  ctx.fillStyle = fillColor;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
  ctx.fill();
}
function drawRoundRectFill(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
  ctx.fill();
}
function strokeRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
  ctx.stroke();
}
function drawButton(ctx, x, y, w, h, label, bg, border, pressed) {
  drawRoundRect(ctx, x+(pressed?2:0), y+(pressed?2:0), w, h, 10, bg);
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  strokeRoundRect(ctx, x+(pressed?2:0), y+(pressed?2:0), w, h, 10);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x+w/2+(pressed?2:0), y+h*0.63+(pressed?2:0));
}

// =====================================================
// INPUT HANDLING
// =====================================================
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  let cx, cy;
  if (e.touches) {
    cx = e.touches[0].clientX - rect.left;
    cy = e.touches[0].clientY - rect.top;
  } else {
    cx = e.clientX - rect.left;
    cy = e.clientY - rect.top;
  }
  return { x: cx / scale, y: cy / scale };
}

function handlePointerDown(e) {
  e.preventDefault();
  initAudio();
  const {x, y} = getCanvasPos(e);

  if (gameState === 'title') {
    gameState = 'modeSelect';
    return;
  }

  if (gameState === 'modeSelect') {
    // Level mode button: y 160..270
    const btn1X = BASE_W/2 - 160, btn1Y = 160, btnW = 320, btnH = 110;
    if (x >= btn1X && x <= btn1X+btnW && y >= btn1Y && y <= btn1Y+btnH) {
      gameState = 'levelSelect';
      levelSelectPage = 0;
      soundAdd();
      return;
    }
    // Free play button: y 310..420
    const btn2Y = 310;
    if (x >= btn1X && x <= btn1X+btnW && y >= btn2Y && y <= btn2Y+btnH) {
      initLevel(-1);
      gameState = 'freePlay';
      soundAdd();
      return;
    }
    // Back button
    if (x >= 20 && x <= 140 && y >= BASE_H-55 && y <= BASE_H-15) {
      gameState = 'title';
    }
    return;
  }

  if (gameState === 'levelSelect') {
    const cols = 3, btnW = 140, btnH = 70, gap = 8;
    const totalW = cols * btnW + (cols-1) * gap;
    const startX = (BASE_W - totalW) / 2;
    const startY = 58;
    const rows = 5;
    const pageStart = levelSelectPage * LEVELS_PER_PAGE;
    const pageEnd = Math.min(pageStart + LEVELS_PER_PAGE, LEVELS.length);

    for (let pi = pageStart; pi < pageEnd; pi++) {
      const slot = pi - pageStart;
      const col = slot % cols;
      const row = Math.floor(slot / cols);
      const bx = startX + col * (btnW + gap);
      const by = startY + row * (btnH + gap);
      if (x >= bx && x <= bx+btnW && y >= by && y <= by+btnH) {
        if (pi + 1 <= unlockedLevel) {
          levelBtnPress[pi] = true;
          setTimeout(() => { levelBtnPress[pi] = false; }, 150);
          initLevel(pi);
          gameState = 'playing';
          soundAdd();
        }
        return;
      }
    }

    // Page navigation
    const navY = startY + rows * (btnH + gap) + 10;
    const totalPages = Math.ceil(LEVELS.length / LEVELS_PER_PAGE);
    if (levelSelectPage > 0 && x >= 20 && x <= 150 && y >= navY && y <= navY+38) {
      levelSelectPage--;
      return;
    }
    if (levelSelectPage < totalPages - 1 && x >= BASE_W-150 && x <= BASE_W-20 && y >= navY && y <= navY+38) {
      levelSelectPage++;
      return;
    }

    // Back button
    if (x >= 20 && x <= 140 && y >= BASE_H-50 && y <= BASE_H-12) {
      gameState = 'modeSelect';
    }
    return;
  }

  if (gameState === 'playing' || gameState === 'freePlay') {
    handlePlayingClick(x, y);
  }
}

function handlePlayingClick(x, y) {
  if (execState.running) return;

  const lv = getCurrentMap();
  const cmds = lv.availableCmds;
  const maxSlots = lv.maxSlots;
  const isFree = currentLevel === -1;

  // Command palette
  const btnW = 86, btnH = 44, gap = 5;
  const cols = Math.min(cmds.length, 3);
  const totalW = cols * btnW + (cols-1)*gap;
  const sx = (BASE_W - totalW) / 2;
  const sy = 435;

  for (let i = 0; i < cmds.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const bx = sx + col * (btnW + gap);
    const by = sy + row * (btnH + gap);
    if (x >= bx && x <= bx+btnW && y >= by && y <= by+btnH) {
      const cmd = cmds[i];
      const limit = getCmdLimit(cmd);
      const used = getCmdUsed(cmd);
      const limitReached = (limit !== Infinity) && (used >= limit);
      if (program.length < maxSlots && !limitReached) {
        cmdBtnPress[cmd] = true;
        setTimeout(() => { cmdBtnPress[cmd] = false; }, 150);
        program.push(cmd);
        soundAdd();
        execState.succeeded = false;
        resultMsg = '';
      }
      return;
    }
  }

  // Program slots (click to remove)
  const slotW = Math.min(36, Math.floor((BASE_W - 20) / maxSlots) - 2);
  const gapS = 2;
  const totalWS = maxSlots * (slotW + gapS) - gapS;
  const sxS = (BASE_W - totalWS) / 2;
  const syS = 353;
  const slotH = 42;
  for (let i = 0; i < maxSlots; i++) {
    const bx = sxS + i * (slotW + gapS);
    if (x >= bx && x <= bx+slotW && y >= syS && y <= syS+slotH) {
      if (i < program.length) {
        slotPress[i] = true;
        setTimeout(() => { slotPress[i] = false; }, 150);
        program.splice(i, 1);
        soundRemove();
        execState.succeeded = false;
        resultMsg = '';
      }
      return;
    }
  }

  // Action row
  const asy = 580;
  if (execState.succeeded) {
    if (isFree) {
      // もう一回
      if (x >= BASE_W/2-75 && x <= BASE_W/2+75 && y >= asy && y <= asy+44) {
        initLevel(-1);
        gameState = 'freePlay';
        return;
      }
      // ← モードへ
      if (x >= 20 && x <= 150 && y >= asy && y <= asy+44) {
        gameState = 'modeSelect';
        return;
      }
    } else {
      // つぎのレベル
      if (currentLevel < LEVELS.length - 1 && x >= 10 && x <= 195 && y >= asy && y <= asy+44) {
        const nextLv = currentLevel + 1;
        initLevel(nextLv);
        gameState = 'playing';
        return;
      }
      // もう一回
      if (x >= BASE_W-200 && x <= BASE_W-10 && y >= asy && y <= asy+44) {
        initLevel(currentLevel);
        return;
      }
      // レベルせんたく
      if (x >= BASE_W/2-70 && x <= BASE_W/2+70 && y >= asy+50 && y <= asy+86) {
        gameState = 'levelSelect';
        return;
      }
    }
  } else {
    // クリアボタン
    if (x >= 10 && x <= 110 && y >= asy && y <= asy+44) {
      program = [];
      resultMsg = '';
      soundRemove();
      return;
    }
    // 実行ボタン
    if (x >= BASE_W/2-60 && x <= BASE_W/2+60 && y >= asy && y <= asy+44) {
      if (!execState.running) startExecution();
      return;
    }
    // もどるボタン
    if (x >= BASE_W-110 && x <= BASE_W-10 && y >= asy && y <= asy+44) {
      gameState = 'modeSelect';
      return;
    }
  }
}

canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('touchstart', handlePointerDown, {passive: false});

// =====================================================
// GAME LOOP
// =====================================================
let lastTimestamp = 0;
function gameLoop(timestamp) {
  const dt = Math.min(timestamp - lastTimestamp, 50);
  lastTimestamp = timestamp;

  if ((gameState === 'playing' || gameState === 'freePlay') && execState.running) {
    updateExecution(dt);
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// Start
initLevel(0);
requestAnimationFrame(gameLoop);
</script>
