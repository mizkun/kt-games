<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ボールコースを作ろう！</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#111; overflow:hidden; touch-action:none; font-family:-apple-system,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh; }
    canvas { display:block; touch-action:none; }
    #home { position:fixed; top:4px; right:6px; color:#888; text-decoration:none; font-size:.6rem; background:rgba(0,0,0,.5); padding:2px 7px; border-radius:8px; z-index:20; }
  </style>
</head>
<body>
<a href="../../index.html" id="home">🏠もどる</a>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const CELL = Math.max(28, Math.floor(Math.min(window.innerWidth / 16, (window.innerHeight * 0.74) / 11)));
const COLS = 16, ROWS = 11;
const GW = COLS * CELL, GH = ROWS * CELL;
const TOOL_H = Math.max(112, window.innerHeight - GH - 10);
const W = GW, H = GH + TOOL_H;
canvas.width = W; canvas.height = H;

const NONE=0,FLOOR=1,WALL=2,RAMP_R=3,RAMP_L=4,SPRING=5,GOAL=6,GEAR_R=7,FERRIS=8,GEAR_L=9,
      ICE=10,MUD=11,TRAMPOLINE=12,CLOUD=13,CONVEYOR_R=14,CONVEYOR_L=15,
      FAN_U=16,CANNON=17,BOOST_R=18,BOOST_L=19,
      BUMPER=20,FLIPPER_R=21,FLIPPER_L=22,
      MAGNET=23,WARP_A=24,WARP_B=25,SPIKE=26,LAVA=27,
      WARP_A2=28,WARP_B2=29;

const BLOCK_INFO = [
  {type:NONE,       label:'消す',      col:'#444',    draw:drawNone},
  {type:FLOOR,      label:'ゆか',      col:'#3355bb', draw:drawFloor},
  {type:WALL,       label:'かべ',      col:'#556677', draw:drawWall},
  {type:RAMP_R,     label:'坂↘',      col:'#cc5511', draw:drawRampR},
  {type:RAMP_L,     label:'坂↙',      col:'#cc8811', draw:drawRampL},
  {type:ICE,        label:'こおり',    col:'#66aadd', draw:drawIce},
  {type:MUD,        label:'ぬかるみ',  col:'#774422', draw:drawMud},
  {type:TRAMPOLINE, label:'トランポリン',col:'#ff6600',draw:drawTrampoline},
  {type:CLOUD,      label:'くも',      col:'#8899aa', draw:drawCloud},
  {type:SPRING,     label:'バネ',      col:'#22aa33', draw:drawSpring},
  {type:CONVEYOR_R, label:'コンベア→', col:'#2255aa', draw:drawConveyorR},
  {type:CONVEYOR_L, label:'コンベア←', col:'#2255aa', draw:drawConveyorL},
  {type:FAN_U,      label:'上むき風',  col:'#33aacc', draw:drawFanU},
  {type:BOOST_R,    label:'ブースト→', col:'#cc9900', draw:drawBoostR},
  {type:BOOST_L,    label:'ブースト←', col:'#cc9900', draw:drawBoostL},
  {type:GEAR_R,     label:'歯車→',    col:'#667788', draw:drawGearR},
  {type:GEAR_L,     label:'歯車←',    col:'#886655', draw:drawGearL},
  {type:FERRIS,     label:'観覧車',    col:'#2266aa', draw:drawFerrisBlock},
  {type:CANNON,     label:'大砲↑',    col:'#884422', draw:drawCannon},
  {type:BUMPER,     label:'バンパー',  col:'#992299', draw:drawBumper},
  {type:FLIPPER_R,  label:'ハネ↗',    col:'#226622', draw:drawFlipperR},
  {type:FLIPPER_L,  label:'ハネ↖',    col:'#226622', draw:drawFlipperL},
  {type:MAGNET,     label:'じしゃく',  col:'#cc2233', draw:drawMagnet},
  {type:WARP_A,     label:'ワープA①',  col:'#4444bb', draw:drawWarpA},
  {type:WARP_B,     label:'ワープB①',  col:'#bb4400', draw:drawWarpB},
  {type:WARP_A2,    label:'ワープA②',  col:'#229944', draw:drawWarpA2},
  {type:WARP_B2,    label:'ワープB②',  col:'#bb2288', draw:drawWarpB2},
  {type:SPIKE,      label:'とげ',      col:'#882222', draw:drawSpike},
  {type:LAVA,       label:'マグマ',    col:'#cc3300', draw:drawLava},
];

// ── Level definitions ──────────────────────────────────────────────
// preset: 2D array ROWS×COLS. -1 = empty/editable. Block constants = locked.
// goalRow/goalCol: position of the GOAL (always locked).
function makeEmpty(){return Array.from({length:ROWS},()=>new Array(COLS).fill(-1));}
function wallBorder(p){
  for(let c=0;c<COLS;c++){p[0][c]=WALL;p[ROWS-1][c]=WALL;}
  for(let r=0;r<ROWS;r++){p[r][0]=WALL;p[r][COLS-1]=WALL;}
}

const LEVELS = (function(){
  const L=[];
  // helper: set a row range to type t
  function row(p,r,c1,c2,t){for(let c=c1;c<=c2;c++)p[r][c]=t;}
  // helper: set a col range
  function col(p,c,r1,r2,t){for(let r=r1;r<=r2;r++)p[r][c]=t;}

  // ── Lv1: 坂でころがせ！ ────────────────────────────────
  // レベル3と同じ3段パターン。坂4個＋コンベア3個（余裕をもたせる）
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,2,1,4,FLOOR);    // 上の台
   row(p,5,5,9,FLOOR);    // 中の台
   row(p,8,9,13,FLOOR);   // 下の台
   L.push({name:'坂でころがせ！',
     hint:'「坂↘」を台のはしに置いて、「コンベア→」でボールを進めよう！',
     preset:p,allowedBlocks:[RAMP_R,CONVEYOR_R],blockCounts:{[RAMP_R]:4,[CONVEYOR_R]:3},
     goalRow:8,goalCol:14});}

  // ── Lv2: バネでとばそう！ ─────────────────────────────
  // 長い床でボールが来る。バネでうえに打ち上げる！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,7,1,11,FLOOR);  // 長い床（固定）
   col(p,12,3,7,WALL);   // 右かべ（固定）
   row(p,3,12,13,FLOOR); // 上の台（固定）
   L.push({name:'バネでとばそう！',
     hint:'床の上に「バネ」を置いてボールを上にとばそう！',
     preset:p,allowedBlocks:[SPRING],blockCounts:{[SPRING]:3},
     goalRow:3,goalCol:14});}

  // ── Lv3: 坂2個でジグザグ！ ──────────────────────────
  // 3段の台を坂でつなぐ。坂↘を2個で！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,2,1,4,FLOOR);   // 上の台
   row(p,5,4,8,FLOOR);   // 中の台
   row(p,8,8,13,FLOOR);  // 下の台
   // p[2][5]と p[5][9]に坂を置く（ヒント通り）
   L.push({name:'坂でジグザグ！',
     hint:'「坂↘」と「コンベア→」を使って、台をつなごう！',
     preset:p,allowedBlocks:[RAMP_R,CONVEYOR_R],blockCounts:{[RAMP_R]:12,[CONVEYOR_R]:6},
     goalRow:8,goalCol:14});}

  // ── Lv4: バネ2個でのぼれ！ ──────────────────────────
  // 3段の台をバネでのぼる。
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,8,1,5,FLOOR);   // 下の台
   row(p,5,4,8,FLOOR);   // 中の台
   row(p,2,8,13,FLOOR);  // 上の台
   L.push({name:'バネ2個でのぼれ！',
     hint:'「バネ」と「坂↘」を使ってどんどん上へ！',
     preset:p,allowedBlocks:[SPRING,RAMP_R],blockCounts:{[SPRING]:2,[RAMP_R]:7},
     goalRow:2,goalCol:14});}

  // ── Lv5: コンベアで加速！ ────────────────────────────
  // 長い床。コンベアでボールを右に押し進める！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,6,1,13,FLOOR);  // 全部固定の床
   L.push({name:'コンベアで加速！',
     hint:'床の上に「コンベア→」を何個か並べてボールをゴールまで押し進めよう！',
     preset:p,allowedBlocks:[CONVEYOR_R],blockCounts:{[CONVEYOR_R]:6},
     goalRow:6,goalCol:14});}

  // ── Lv6: バネで高くとべ！ ────────────────────────────
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,8,1,5,FLOOR);   // 左の短い床
   row(p,4,10,13,FLOOR);  // 右上の台（ゴール側）
   L.push({name:'バネで高くとべ！',
     hint:'床に「バネ」を置いてボールを右上の台までとばそう！',
     preset:p,allowedBlocks:[SPRING,FLOOR],blockCounts:{[SPRING]:3,[FLOOR]:4},
     goalRow:4,goalCol:14});}

  // ── Lv7: 坂↘＋坂↙で折り返し！ ─────────────────────
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,3,1,6,FLOOR);
   row(p,6,5,10,FLOOR);
   row(p,9,8,13,FLOOR);
   L.push({name:'坂で折り返し！',
     hint:'台の端に「坂↘」「坂↙」を置いてうまく落とそう！',
     preset:p,allowedBlocks:[RAMP_R,RAMP_L],blockCounts:{[RAMP_R]:14,[RAMP_L]:6},
     goalRow:9,goalCol:14});}

  // ── Lv8: バネ＋坂 ──────────────────────────────────
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,7,1,6,FLOOR);
   row(p,4,7,11,FLOOR);
   row(p,1,10,13,FLOOR);
   L.push({name:'バネ＋坂！',
     hint:'「坂↘」と「バネ」をうまく使って3段の台をつなごう！',
     preset:p,allowedBlocks:[RAMP_R,SPRING],blockCounts:{[RAMP_R]:1,[SPRING]:2},
     goalRow:1,goalCol:14});}

  // ── Lv9: 大砲でぶっとばせ！ ─────────────────────────
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,8,1,8,FLOOR);
   row(p,4,10,13,FLOOR);
   L.push({name:'大砲でぶっとばせ！',
     hint:'「大砲↑」を床に置いてボールをうえの台まで一気にとばそう！',
     preset:p,allowedBlocks:[CANNON,FLOOR],blockCounts:{[CANNON]:1,[FLOOR]:2},
     goalRow:4,goalCol:14});}

  // ── Lv10: 風でふき上げろ！ ──────────────────────────
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,8,1,6,FLOOR);
   col(p,5,2,8,WALL);    // 左かべ（誘導）
   col(p,7,2,8,WALL);    // 右かべ（誘導）
   L.push({name:'風でふき上げろ！',
     hint:'2つのかべの間に「上むき風」を置いてボールを上にふき上げよう！',
     preset:p,allowedBlocks:[FAN_U],blockCounts:{[FAN_U]:3},
     goalRow:1,goalCol:14});}

  // ── Lv11〜30: 複合・上級 ──────────────────────────────
  // Level 11: こおりで滑れ！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,5,1,3,FLOOR);
   row(p,5,11,13,FLOOR);
   L.push({name:'こおりで滑れ！',
     hint:'「こおり」を7枚並べてすべすべのコースを作ろう！',
     preset:p,allowedBlocks:[ICE],blockCounts:{[ICE]:8},
     goalRow:5,goalCol:14});}

  // Level 12: コンベア＋坂
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,3,1,5,FLOOR);
   row(p,7,5,12,FLOOR);
   L.push({name:'コンベア＋坂！',
     hint:'「坂↘」でおろして「コンベア→」で加速してゴールへ！',
     preset:p,allowedBlocks:[RAMP_R,CONVEYOR_R],blockCounts:{[RAMP_R]:1,[CONVEYOR_R]:4},
     goalRow:7,goalCol:14});}

  // Level 13: バンパー！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,8,1,8,FLOOR);
   row(p,5,7,10,FLOOR);
   row(p,2,9,13,FLOOR);
   L.push({name:'バンパーではねかえれ！',
     hint:'「バンパー」をうまく置いてはじかれながらゴールへ！',
     preset:p,allowedBlocks:[BUMPER,FLOOR],blockCounts:{[BUMPER]:3,[FLOOR]:2},
     goalRow:2,goalCol:14});}

  // Level 14: ブースト！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,6,1,13,FLOOR);
   p[5][6]=WALL;p[5][7]=WALL;p[5][8]=WALL; // 天井の障害物
   L.push({name:'ブーストで加速！',
     hint:'「ブースト→」を並べてボールをすごいスピードにしてゴール！',
     preset:p,allowedBlocks:[BOOST_R],blockCounts:{[BOOST_R]:5},
     goalRow:6,goalCol:14});}

  // Level 15: フリッパーではねとばせ！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,7,1,6,FLOOR);
   row(p,3,8,13,FLOOR);
   L.push({name:'フリッパーではねとばせ！',
     hint:'「ハネ↗」を台の右端に置いてボールを右上にとばしてゴール！',
     preset:p,allowedBlocks:[FLIPPER_R,FLOOR],blockCounts:{[FLIPPER_R]:2,[FLOOR]:1},
     goalRow:3,goalCol:14});}

  // Level 16: ワープ！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,7,1,7,FLOOR);
   row(p,3,9,13,FLOOR);
   L.push({name:'ワープで一瞬移動！',
     hint:'「ワープA」と「ワープB」の両方を置いて瞬間移動しよう！',
     preset:p,allowedBlocks:[WARP_A,WARP_B,FLOOR],blockCounts:{[WARP_A]:1,[WARP_B]:1,[FLOOR]:2},
     goalRow:3,goalCol:14});}

  // Level 17: 歯車コース
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,5,1,13,FLOOR);
   L.push({name:'歯車でころがれ！',
     hint:'「歯車→」や「歯車←」を置いてボールをはじきながら進もう！',
     preset:p,allowedBlocks:[GEAR_R,GEAR_L,FLOOR],blockCounts:{[GEAR_R]:2,[GEAR_L]:2,[FLOOR]:2},
     goalRow:5,goalCol:14});}

  // Level 18: 磁石！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,6,1,4,FLOOR);
   row(p,6,10,13,FLOOR);
   col(p,6,2,6,WALL); col(p,8,2,6,WALL);
   L.push({name:'じしゃくで引き寄せろ！',
     hint:'「じしゃく」を置いてボールを引き寄せながらゴールへ！',
     preset:p,allowedBlocks:[MAGNET,FLOOR,RAMP_R],blockCounts:{[MAGNET]:2,[FLOOR]:3,[RAMP_R]:1},
     goalRow:6,goalCol:14});}

  // Level 19: とげ回避！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,6,1,4,FLOOR);
   p[6][5]=SPIKE;p[6][6]=SPIKE;p[6][7]=SPIKE; // とげ（固定）
   row(p,6,8,13,FLOOR);
   L.push({name:'とげを避けろ！',
     hint:'とげの上を飛び越えてゴールへ！「バネ」と「坂↘」を使おう！',
     preset:p,allowedBlocks:[SPRING,RAMP_R,FLOOR],blockCounts:{[SPRING]:1,[RAMP_R]:2,[FLOOR]:2},
     goalRow:6,goalCol:14});}

  // Level 20: マグマわたり！
  {const p=makeEmpty();wallBorder(p);p[0][1]=-1;
   row(p,8,1,3,FLOOR);
   p[8][4]=LAVA;p[8][5]=LAVA;p[8][6]=LAVA; // マグマ（固定）
   row(p,8,7,13,FLOOR);
   L.push({name:'マグマをわたれ！',
     hint:'マグマの上を飛び越えてゴールへ！「バネ」か「トランポリン」で！',
     preset:p,allowedBlocks:[SPRING,TRAMPOLINE,RAMP_R],blockCounts:{[SPRING]:1,[TRAMPOLINE]:1,[RAMP_R]:1},
     goalRow:8,goalCol:14});}


  return L;
})();
// ── State ──────────────────────────────────────────────────────────
// states: 'modeSelect' | 'levelSelect' | 'freeEdit' | 'freePlay' | 'challengeEdit' | 'challengePlay' | 'challengeWin' | 'challengeFail'
let state = 'modeSelect';
let frame = 0;
let sel = FLOOR;
let ball = null, trail = [];
let ballTrapped = false, trapAngle = 0, trapTx = 0, trapTy = 0;
let confetti = [];
let warpCooldown = 0;
let ac = null;

// ── Ball shapes per level ──────────────────────────────────────────
const BALL_SHAPES = [
  {name:'まる',     type:'circle',  color1:'#ff4488', color2:'#aa0033'},  // Lv1-3
  {name:'さんかく', type:'polygon', sides:3, color1:'#44ff88', color2:'#00aa33'},  // Lv4-6
  {name:'しかく',   type:'polygon', sides:4, color1:'#4488ff', color2:'#0033aa'},  // Lv7-9
  {name:'ごかく',   type:'polygon', sides:5, color1:'#ffaa44', color2:'#aa6600'},  // Lv10-12
  {name:'ろっかく', type:'polygon', sides:6, color1:'#aa44ff', color2:'#6600aa'},  // Lv13-15
  {name:'ななかく', type:'polygon', sides:7, color1:'#44ffff', color2:'#00aaaa'},  // Lv16-18
  {name:'ダイヤ',   type:'diamond', color1:'#44ddff', color2:'#0088cc'},  // Lv19-20
];
function getBallShape(lvl){return BALL_SHAPES[Math.min(Math.floor(lvl/3),BALL_SHAPES.length-1)];}
function drawBallPath(ctx,x,y,r,shape){
  ctx.beginPath();
  if(shape.type==='circle'){ctx.arc(x,y,r,0,Math.PI*2);}
  else if(shape.type==='polygon'){
    const n=shape.sides;
    for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI*i)/n;const px=x+r*Math.cos(a),py=y+r*Math.sin(a);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();
  } else if(shape.type==='diamond'){
    ctx.moveTo(x,y-r);ctx.lineTo(x+r*0.7,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*0.7,y);ctx.closePath();
  } else if(shape.type==='pizza'){
    ctx.moveTo(x,y);ctx.arc(x,y,r,-Math.PI*0.85,Math.PI*0.15);ctx.closePath();
  } else if(shape.type==='star'){
    for(let i=0;i<10;i++){const a=-Math.PI/2+(Math.PI*i)/5;const rd=i%2===0?r:r*0.45;const px=x+rd*Math.cos(a),py=y+rd*Math.sin(a);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();
  }
}

// Challenge mode state
let currentLevel = 0;
let clearedLevels = {};
let lockedGrid = []; // true/false per cell
let placedCounts = {}; // {type: count}

// Grid (shared for free and challenge edit)
const grid = Array.from({length:ROWS},()=>new Array(COLS).fill(NONE));
const FREE_GOAL_COL = COLS-2, FREE_GOAL_ROW = ROWS-3;

// Load cleared levels
for(let i=0;i<20;i++){
  if(localStorage.getItem('block_course_cleared_'+i)==='1') clearedLevels[i]=true;
}

// ── Audio ──────────────────────────────────────────────────────────
function initAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}
function beep(f,d,v,t){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}

// ── Init helpers ───────────────────────────────────────────────────
function initFreePlay(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=NONE;
  grid[FREE_GOAL_ROW][FREE_GOAL_COL]=GOAL;
  lockedGrid=[];
  placedCounts={};
  sel=FLOOR;
  BALL_R=BALL_R_BASE; // reset ball size for free play
  challengeTimer=0;challengeTimeLimit=0;
  state='freeEdit';
  ball=null;trail=[];confetti=[];ballTrapped=false;
}

function initChallenge(idx){
  currentLevel=idx;
  const lv=LEVELS[idx];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const v=lv.preset[r][c];
    grid[r][c]= (v===-1)?NONE:v;
  }
  grid[lv.goalRow][lv.goalCol]=GOAL;
  // Build lockedGrid
  lockedGrid=Array.from({length:ROWS},()=>new Array(COLS).fill(false));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(lv.preset[r][c]!==-1)lockedGrid[r][c]=true;
  }
  lockedGrid[lv.goalRow][lv.goalCol]=true;
  // Init placed counts
  placedCounts={};
  for(const t of lv.allowedBlocks)placedCounts[t]=0;
  // First allowed block as default sel (not NONE)
  sel=lv.allowedBlocks[0]||FLOOR;
  // Apply difficulty scaling
  const diff=getLevelDifficulty(idx);
  BALL_R=BALL_R_BASE*diff.ballScale;
  challengeTimeLimit=diff.timeLimit;
  challengeTimer=diff.timeLimit*60; // 60fps
  state='challengeEdit';
  ball=null;trail=[];confetti=[];ballTrapped=false;warpCooldown=0;
}

function getChallengeRemaining(type){
  const lv=LEVELS[currentLevel];
  if(!lv.blockCounts||lv.blockCounts[type]===undefined)return Infinity;
  return lv.blockCounts[type]-(placedCounts[type]||0);
}

// ── Save / Load ─────────────────────────────────────────────────────
const SAVE_KEY='block_course_free_v1_';
const SAVE_MAX=5;
function getSave(slot){try{const d=localStorage.getItem(SAVE_KEY+slot);return d?JSON.parse(d):null;}catch(e){return null;}}
function writeSave(slot){localStorage.setItem(SAVE_KEY+slot,JSON.stringify({grid:grid.map(r=>[...r]),ts:Date.now()}));}
function applyLoad(slot){
  const d=getSave(slot);if(!d)return;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=(d.grid[r]&&d.grid[r][c]!=null?d.grid[r][c]:NONE);
  grid[FREE_GOAL_ROW][FREE_GOAL_COL]=GOAL;
  lockedGrid=[];placedCounts={};sel=FLOOR;
  ball=null;trail=[];confetti=[];ballTrapped=false;
  state='freeEdit';
}
function fmtDate(ts){
  if(!ts)return '---';
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function drawSlotList(title,mode){
  ctx.fillStyle='#0d1220';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font=`bold ${CELL*0.7}px sans-serif`;ctx.textAlign='center';
  ctx.fillText(title,W/2,CELL*1.5);
  const bh=CELL*1.05,gap=CELL*0.28,startY=CELL*2.2;
  for(let i=0;i<SAVE_MAX;i++){
    const d=getSave(i);
    const empty=!d&&mode==='load';
    const bx=W*0.06,bw=W*0.88,by=startY+i*(bh+gap);
    const over=!empty&&hitBtn({x:bx,y:by,w:bw,h:bh},mx,my);
    ctx.fillStyle=empty?'#0d1520':(over?'#2a4060':'#162030');
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh*0.18);ctx.fill();
    if(over){ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();}
    ctx.fillStyle=empty?'#334':'#ccc';ctx.font=`bold ${CELL*0.42}px sans-serif`;ctx.textAlign='left';
    ctx.fillText(`セーブ ${i+1}`,bx+CELL*0.45,by+bh*0.52);
    ctx.fillStyle=d?'#88ccff':'#445';ctx.font=`${CELL*0.34}px sans-serif`;
    ctx.fillText(d?`📅 ${fmtDate(d.ts)}`:'（空き）',bx+CELL*0.45,by+bh*0.82);
    if(!empty){
      ctx.fillStyle='rgba(255,220,80,0.9)';ctx.font=`bold ${CELL*0.38}px sans-serif`;ctx.textAlign='right';
      ctx.fillText(mode==='save'?(d?'上書き保存 💾':'ここに保存 💾'):'読み込む 📂',bx+bw-CELL*0.4,by+bh*0.68);
    }
    canvas[`_slotBtn_${i}`]={x:bx,y:by,w:bw,h:bh,valid:!empty};
  }
  const bkW=CELL*3.5,bkH=CELL*0.75,bkX=W/2-bkW/2,bkY=H-CELL*1.1;
  ctx.fillStyle='#334';ctx.beginPath();ctx.roundRect(bkX,bkY,bkW,bkH,bkH*0.3);ctx.fill();
  ctx.fillStyle='#aaa';ctx.font=`${CELL*0.4}px sans-serif`;ctx.textAlign='center';
  ctx.fillText('← キャンセル',W/2,bkY+bkH*0.7);
  canvas._slotBackBtn={x:bkX,y:bkY,w:bkW,h:bkH};
}

// ── Spawn / physics ────────────────────────────────────────────────
function spawnBall(){ball={x:1*CELL+CELL/2,y:0*CELL+CELL/2,vx:0.8,vy:0};trail=[];ballTrapped=false;}

function resolveWall(tx,ty){
  const nx2=Math.max(tx,Math.min(ball.x,tx+CELL)),ny2=Math.max(ty,Math.min(ball.y,ty+CELL));
  const dx=ball.x-nx2,dy=ball.y-ny2,dist=Math.hypot(dx,dy);
  if(dist>=BALL_R||dist<0.001)return;
  const nx=dx/dist,ny=dy/dist,ov=BALL_R-dist;
  ball.x+=nx*ov;ball.y+=ny*ov;
  const dot=ball.vx*nx+ball.vy*ny;
  if(dot<0){ball.vx-=dot*nx*1.4;ball.vy-=dot*ny*1.4;}
  ball.vx*=0.86;ball.vy*=0.86;
  if(frame%3===0)beep(200+Math.random()*100,0.04,0.07,'square');
}

const BALL_R_BASE = CELL * 0.27;
let BALL_R = BALL_R_BASE;

// ── Difficulty scaling ─────────────────────────────────────────────
// Returns {ballScale, timeLimit(seconds, 0=no limit)}
function getLevelDifficulty(lvl){
  if(lvl<5)  return {ballScale:1.0, timeLimit:0};
  if(lvl<10) return {ballScale:0.85, timeLimit:60};
  if(lvl<15) return {ballScale:0.7, timeLimit:45};
  return            {ballScale:0.55, timeLimit:30};
}
let challengeTimer = 0;   // frames remaining
let challengeTimeLimit = 0; // seconds (for display)

function resolveFloor(tx,ty){
  if(ball.vy<0)return;
  if(ball.y>ty+CELL*0.55)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){
    ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.38;ball.vx*=0.84;
    if(Math.abs(ball.vy)>0.5&&frame%4===0)beep(220,0.05,0.06);
  }
}
function resolveRampR(tx,ty){
  const bx=ball.x-tx;if(bx<-BALL_R||bx>CELL+BALL_R)return;
  const clampBx=Math.max(0,Math.min(CELL,bx)),sy=ty+clampBx,dist=ball.y-sy;
  if(dist<BALL_R&&dist>-BALL_R*2.5){
    if(ball.vy>=0||dist>-BALL_R){
      ball.y=sy-BALL_R;const nx=1/Math.SQRT2,ny=-1/Math.SQRT2;const dot=ball.vx*nx+ball.vy*ny;
      if(dot<0){ball.vx-=dot*nx*1.2;ball.vy-=dot*ny*1.2;}ball.vx*=0.9;if(frame%4===0)beep(240,0.04,0.06);
    }
  }
}
function resolveRampL(tx,ty){
  const bx=ball.x-tx;if(bx<-BALL_R||bx>CELL+BALL_R)return;
  const clampBx=Math.max(0,Math.min(CELL,bx)),sy=ty+(CELL-clampBx),dist=ball.y-sy;
  if(dist<BALL_R&&dist>-BALL_R*2.5){
    if(ball.vy>=0||dist>-BALL_R){
      ball.y=sy-BALL_R;const nx=-1/Math.SQRT2,ny=-1/Math.SQRT2;const dot=ball.vx*nx+ball.vy*ny;
      if(dot<0){ball.vx-=dot*nx*1.2;ball.vy-=dot*ny*1.2;}ball.vx*=0.9;if(frame%4===0)beep(240,0.04,0.06);
    }
  }
}
function resolveSpring(tx,ty){
  if(ball.y+BALL_R>ty&&ball.y<ty+CELL&&ball.x+BALL_R>tx+2&&ball.x-BALL_R<tx+CELL-2){
    if(ball.vy>0){ball.y=ty-BALL_R;ball.vy=-13;beep(600,0.08,0.3,'triangle');beep(900,0.12,0.2,'triangle');}
  }
}
function resolveGear(tx,ty,spin){
  const gcx=tx+CELL/2,gcy=ty+CELL/2,gr=CELL*0.42;
  const dx=ball.x-gcx,dy=ball.y-gcy,dist=Math.hypot(dx,dy),minD=BALL_R+gr;
  if(dist>=minD||dist<0.001)return;
  const nx=dx/dist,ny=dy/dist;
  ball.x=gcx+nx*minD;ball.y=gcy+ny*minD;
  const dot=ball.vx*nx+ball.vy*ny;
  if(dot<0){ball.vx-=dot*nx*1.3;ball.vy-=dot*ny*1.3;}
  ball.vx+=(-ny)*spin*0.05*gr*1.5;ball.vy+=(nx)*spin*0.05*gr*1.5;
  if(frame%3===0)beep(260+Math.random()*120,0.04,0.1,'square');
}
function resolveFerris(tx,ty){
  const fcx=tx+CELL/2,fcy=ty+CELL/2,fr2=CELL*0.43,wSpd=0.022,wAngle=frame*wSpd;
  if(ballTrapped&&trapTx===tx&&trapTy===ty){
    const ca=wAngle+trapAngle;ball.x=fcx+Math.cos(ca)*fr2;ball.y=fcy+Math.sin(ca)*fr2;ball.vx=0;ball.vy=0;
    if(Math.sin(ca)>0.8){ballTrapped=false;ball.vy=4;ball.vx=Math.cos(ca)*wSpd*fr2*0.5;beep(350,0.1,0.15,'sine');}
    return;
  }
  if(ballTrapped)return;
  for(let i=0;i<4;i++){
    const ca=wAngle+i*Math.PI/2,cpx=fcx+Math.cos(ca)*fr2,cpy=fcy+Math.sin(ca)*fr2;
    if(Math.hypot(ball.x-cpx,ball.y-cpy)<BALL_R*2.2&&Math.sin(ca)<0.25&&ball.vy>0){
      ballTrapped=true;trapTx=tx;trapTy=ty;trapAngle=Math.atan2(ball.y-fcy,ball.x-fcx)-wAngle;beep(550,0.1,0.22,'triangle');return;
    }
  }
  const dx=ball.x-fcx,dy=ball.y-fcy,dist=Math.hypot(dx,dy);
  if(dist<fr2+BALL_R&&dist>0.001){
    const nx=dx/dist,ny=dy/dist;
    if(dist<fr2){ball.x=fcx+nx*fr2;ball.y=fcy+ny*fr2;}
    const dot=ball.vx*nx+ball.vy*ny;
    if(dot<0){ball.vx-=2*dot*nx*0.5;ball.vy-=2*dot*ny*0.5;}
    ball.vx+=(-ny)*wSpd*fr2*0.4;ball.vy+=(nx)*wSpd*fr2*0.4;
  }
}
function resolveIce(tx,ty){
  if(ball.vy<0)return;if(ball.y>ty+CELL*0.55)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.35;ball.vx*=0.997;if(Math.abs(ball.vy)<0.5)ball.vy=0;}
}
function resolveMud(tx,ty){
  if(ball.vy<0)return;if(ball.y>ty+CELL*0.55)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.12;ball.vx*=0.65;if(Math.abs(ball.vy)<0.3)ball.vy=0;if(frame%5===0)beep(120+Math.random()*30,0.06,0.07,'sawtooth');}
}
function resolveTrampoline(tx,ty){
  if(ball.vy<0)return;if(ball.y>ty+CELL*0.7)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty+CELL*0.28&&ball.y-BALL_R<ty+CELL*0.6){ball.y=ty+CELL*0.3-BALL_R;ball.vy=-Math.abs(ball.vy)*1.9;ball.vx*=0.92;beep(480,0.08,0.2,'triangle');setTimeout(()=>beep(680,0.1,0.15,'triangle'),60);}
}
function resolveCloud(tx,ty){
  if(ball.vy<0)return;if(ball.y>ty+CELL*0.7)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty+CELL*0.15&&ball.y-BALL_R<ty+CELL*0.65){ball.y=ty+CELL*0.18-BALL_R;ball.vy=-Math.abs(ball.vy)*0.04;ball.vx*=0.86;if(Math.abs(ball.vy)<0.8)ball.vy=0;}
}
function resolveConveyorR(tx,ty){
  if(ball.vy<0)return;if(ball.y>ty+CELL*0.55)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.35;ball.vx=Math.min(ball.vx+0.35,9);ball.vx*=0.89;}
}
function resolveConveyorL(tx,ty){
  if(ball.vy<0)return;if(ball.y>ty+CELL*0.55)return;
  if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.35;ball.vx=Math.max(ball.vx-0.35,-9);ball.vx*=0.89;}
}
function resolveFanU(tx,ty){
  const fcx=tx+CELL/2,range=CELL*2.8,dx=ball.x-fcx,dy=ball.y-ty;
  if(Math.abs(dx)<CELL*0.9&&dy>-range&&dy<CELL*0.3){const str=Math.max(0,1-Math.abs(dy)/range)*0.55;ball.vy-=str;ball.vx+=dx*0.012*str;if(frame%10===0&&str>0.25)beep(160+str*120,0.05,0.05);}
}
function resolveCannon(tx,ty){
  const cx2=tx+CELL/2,cy2=ty+CELL/2;
  if(Math.hypot(ball.x-cx2,ball.y-cy2)<CELL*0.52){ball.vy=-17;ball.vx*=0.4;ball.y=ty-BALL_R;beep(180,0.04,0.28,'sawtooth');setTimeout(()=>beep(400,0.08,0.2,'square'),50);setTimeout(()=>beep(700,0.14,0.18,'triangle'),130);}
}
function resolveBoostR(tx,ty){
  if(ball.y>ty+CELL*0.55)return;if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.35;if(ball.vx<10){ball.vx=10;beep(440,0.08,0.18,'triangle');}}
}
function resolveBoostL(tx,ty){
  if(ball.y>ty+CELL*0.55)return;if(ball.x+BALL_R<tx+2||ball.x-BALL_R>tx+CELL-2)return;
  if(ball.y+BALL_R>ty&&ball.y-BALL_R<ty+CELL*0.5){ball.y=ty-BALL_R;ball.vy=-Math.abs(ball.vy)*0.35;if(ball.vx>-10){ball.vx=-10;beep(440,0.08,0.18,'triangle');}}
}
function resolveBumper(tx,ty){
  const cx2=tx+CELL/2,cy2=ty+CELL/2,r=CELL*0.38;
  const dx=ball.x-cx2,dy=ball.y-cy2,dist=Math.hypot(dx,dy),minD=BALL_R+r;
  if(dist>=minD||dist<0.001)return;
  const nx=dx/dist,ny=dy/dist;ball.x=cx2+nx*minD;ball.y=cy2+ny*minD;
  const spd=Math.max(9,Math.hypot(ball.vx,ball.vy)*1.6);ball.vx=nx*spd;ball.vy=ny*spd;
  beep(580,0.06,0.25,'square');setTimeout(()=>beep(820,0.08,0.18,'square'),50);
}
function resolveFlipperR(tx,ty){
  const bx=ball.x-tx,clampBx=Math.max(0,Math.min(CELL,bx)),sy=ty+(CELL-clampBx),dist=ball.y-sy;
  if(dist<BALL_R&&dist>-BALL_R*2.5){if(ball.vy>=0||dist>-BALL_R){ball.y=sy-BALL_R;const nx=-1/Math.SQRT2,ny=-1/Math.SQRT2;const dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=dot*nx*2.2;ball.vy-=dot*ny*2.2;}ball.vx=Math.max(ball.vx,4);ball.vy=Math.min(ball.vy,-5);beep(360,0.1,0.18,'triangle');}}
}
function resolveFlipperL(tx,ty){
  const bx=ball.x-tx,clampBx=Math.max(0,Math.min(CELL,bx)),sy=ty+clampBx,dist=ball.y-sy;
  if(dist<BALL_R&&dist>-BALL_R*2.5){if(ball.vy>=0||dist>-BALL_R){ball.y=sy-BALL_R;const nx=1/Math.SQRT2,ny=-1/Math.SQRT2;const dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=dot*nx*2.2;ball.vy-=dot*ny*2.2;}ball.vx=Math.min(ball.vx,-4);ball.vy=Math.min(ball.vy,-5);beep(360,0.1,0.18,'triangle');}}
}
function resolveMagnet(tx,ty){
  const mcx=tx+CELL/2,mcy=ty+CELL/2,dx=ball.x-mcx,dy=ball.y-mcy,dist=Math.hypot(dx,dy),range=CELL*2.8;
  if(dist<range&&dist>BALL_R+CELL*0.2){const f=(1-dist/range)*0.55;ball.vx-=dx/dist*f;ball.vy-=dy/dist*f;if(frame%12===0)beep(200,0.04,0.05,'sine');}
}
function resolveWarpA(tx,ty){
  if(warpCooldown>0)return;const cx2=tx+CELL/2,cy2=ty+CELL/2;
  if(Math.hypot(ball.x-cx2,ball.y-cy2)<CELL*0.42){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]===WARP_B){ball.x=c*CELL+CELL/2;ball.y=r*CELL-BALL_R*2;ball.vy*=0.4;warpCooldown=40;beep(300,0.06,0.2,'sine');setTimeout(()=>beep(600,0.1,0.18,'sine'),80);return;}}
  }
}
function resolveWarpB(tx,ty){
  if(warpCooldown>0)return;const cx2=tx+CELL/2,cy2=ty+CELL/2;
  if(Math.hypot(ball.x-cx2,ball.y-cy2)<CELL*0.42){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]===WARP_A){ball.x=c*CELL+CELL/2;ball.y=r*CELL-BALL_R*2;ball.vy*=0.4;warpCooldown=40;beep(600,0.06,0.2,'sine');setTimeout(()=>beep(300,0.1,0.18,'sine'),80);return;}}
  }
}
function resolveWarpA2(tx,ty){
  if(warpCooldown>0)return;const cx2=tx+CELL/2,cy2=ty+CELL/2;
  if(Math.hypot(ball.x-cx2,ball.y-cy2)<CELL*0.42){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]===WARP_B2){ball.x=c*CELL+CELL/2;ball.y=r*CELL-BALL_R*2;ball.vy*=0.4;warpCooldown=40;beep(350,0.06,0.2,'sine');setTimeout(()=>beep(700,0.1,0.18,'sine'),80);return;}}
  }
}
function resolveWarpB2(tx,ty){
  if(warpCooldown>0)return;const cx2=tx+CELL/2,cy2=ty+CELL/2;
  if(Math.hypot(ball.x-cx2,ball.y-cy2)<CELL*0.42){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]===WARP_A2){ball.x=c*CELL+CELL/2;ball.y=r*CELL-BALL_R*2;ball.vy*=0.4;warpCooldown=40;beep(700,0.06,0.2,'sine');setTimeout(()=>beep(350,0.1,0.18,'sine'),80);return;}}
  }
}

function updateBall(){
  if(!ball)return;
  // Timer countdown
  if(state==='challengePlay'&&challengeTimeLimit>0){
    challengeTimer--;
    if(challengeTimer<=0){triggerFail('time');return;}
  }
  if(warpCooldown>0)warpCooldown--;
  if(ballTrapped){resolveFerris(trapTx,trapTy);trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift();return;}
  ball.vy+=0.34;ball.x+=ball.vx;ball.y+=ball.vy;
  const c0=Math.max(0,Math.floor((ball.x-BALL_R-CELL)/CELL));
  const c1=Math.min(COLS-1,Math.floor((ball.x+BALL_R+CELL)/CELL));
  const r0=Math.max(0,Math.floor((ball.y-BALL_R-CELL)/CELL));
  const r1=Math.min(ROWS-1,Math.floor((ball.y+BALL_R+CELL)/CELL));
  const isPlay = state==='freePlay'||state==='challengePlay';
  for(let row=r0;row<=r1;row++){
    for(let col=c0;col<=c1;col++){
      const t=grid[row][col];if(!t)continue;
      const tx=col*CELL,ty=row*CELL;
      if(t===GOAL&&Math.hypot(ball.x-(tx+CELL/2),ball.y-(ty+CELL/2))<CELL*0.55){triggerWin();return;}
      if(t===WALL)resolveWall(tx,ty);
      else if(t===FLOOR)resolveFloor(tx,ty);
      else if(t===RAMP_R)resolveRampR(tx,ty);
      else if(t===RAMP_L)resolveRampL(tx,ty);
      else if(t===SPRING)resolveSpring(tx,ty);
      else if(t===ICE)resolveIce(tx,ty);
      else if(t===MUD)resolveMud(tx,ty);
      else if(t===TRAMPOLINE)resolveTrampoline(tx,ty);
      else if(t===CLOUD)resolveCloud(tx,ty);
      else if(t===CONVEYOR_R)resolveConveyorR(tx,ty);
      else if(t===CONVEYOR_L)resolveConveyorL(tx,ty);
      else if(t===CANNON)resolveCannon(tx,ty);
      else if(t===BOOST_R)resolveBoostR(tx,ty);
      else if(t===BOOST_L)resolveBoostL(tx,ty);
      else if(t===BUMPER)resolveBumper(tx,ty);
      else if(t===FLIPPER_R)resolveFlipperR(tx,ty);
      else if(t===FLIPPER_L)resolveFlipperL(tx,ty);
      else if(t===WARP_A)resolveWarpA(tx,ty);
      else if(t===WARP_B)resolveWarpB(tx,ty);
      else if(t===WARP_A2)resolveWarpA2(tx,ty);
      else if(t===WARP_B2)resolveWarpB2(tx,ty);
      else if(t===SPIKE||t===LAVA){if(isPlay)triggerFail();return;}
      else if(t===GEAR_R)resolveGear(tx,ty,1);
      else if(t===GEAR_L)resolveGear(tx,ty,-1);
      else if(t===FERRIS)resolveFerris(tx,ty);
    }
  }
  for(let row=0;row<ROWS;row++){for(let col=0;col<COLS;col++){const t=grid[row][col];if(t===MAGNET)resolveMagnet(col*CELL,row*CELL);else if(t===FAN_U)resolveFanU(col*CELL,row*CELL);}}
  if(ball.x-BALL_R<0){ball.x=BALL_R;ball.vx=Math.abs(ball.vx)*0.55;}
  if(ball.x+BALL_R>GW){ball.x=GW-BALL_R;ball.vx=-Math.abs(ball.vx)*0.55;}
  trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift();
  if(ball.y>GH+80)triggerFail();
}

function triggerWin(){
  if(state==='challengePlay'){
    clearedLevels[currentLevel]=true;
    localStorage.setItem('block_course_cleared_'+currentLevel,'1');
    state='challengeWin';
  } else {
    state='win';
  }
  ball=null;
  [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.3,0.25,'triangle'),i*120));
  for(let i=0;i<60;i++)confetti.push({x:Math.random()*GW,y:Math.random()*GH,vx:(Math.random()-0.5)*4,vy:Math.random()*-3-2,col:`hsl(${Math.random()*360|0},100%,60%)`,r:3+Math.random()*4,life:120});
}
let failReason='fall'; // 'fall' or 'time'
function triggerFail(reason){
  failReason=reason||'fall';
  state=(state==='challengePlay')?'challengeFail':'fail';
  ball=null;
  beep(400,0.1,0.28,'sawtooth');setTimeout(()=>beep(300,0.13,0.28,'sawtooth'),130);
  setTimeout(()=>beep(200,0.16,0.25,'sawtooth'),270);setTimeout(()=>beep(140,0.35,0.2,'sawtooth'),420);
}

// ── Toolbar layout ─────────────────────────────────────────────────
const ROW1 = 14;
const BTN_W = Math.floor(W / ROW1);
const BTN_H = Math.max(28, Math.floor((TOOL_H - 6) * 0.38));
const GO_W = Math.min(W * 0.56, 225);
const GO_H = Math.max(22, TOOL_H - BTN_H*2 - 16);
const GO_X = (W - GO_W) / 2;
const GO_Y = GH + BTN_H*2 + 11;

// Challenge toolbar: variable col count depending on allowed blocks
function getChallengeToolbarInfo(){
  const lv = LEVELS[currentLevel];
  // Include NONE (eraser) first, then allowed blocks
  const types = [NONE, ...lv.allowedBlocks];
  const infos = types.map(t=>BLOCK_INFO.find(b=>b.type===t)).filter(Boolean);
  return infos;
}
function getChallengeToolbarBtn(x,y){
  const infos = getChallengeToolbarInfo();
  const n = infos.length;
  const cols = Math.min(n, ROW1);
  const bw = Math.floor(W/cols);
  const r1=GH+3;
  if(y>=r1&&y<r1+BTN_H){const i=Math.min(cols-1,Math.floor(x/bw));return i<n?i:-1;}
  if(n>cols){
    const r2=r1+BTN_H+3;
    if(y>=r2&&y<r2+BTN_H){const i=cols+Math.min(cols-1,Math.floor(x/bw));return i<n?i:-1;}
  }
  return -1;
}
function getToolbarBtn(x,y){
  const r1=GH+3,r2=r1+BTN_H+3;
  if(y>=r1&&y<r1+BTN_H){const i=Math.min(ROW1-1,Math.floor(x/BTN_W));return i<BLOCK_INFO.length?i:-1;}
  if(y>=r2&&y<r2+BTN_H){const i=ROW1+Math.min(ROW1-1,Math.floor(x/BTN_W));return i<BLOCK_INFO.length?i:-1;}
  return -1;
}

  ctx.fillStyle='#aaccff';ctx.font=`${CELL*0.38}px sans-serif`;
  ctx.fillText('どっちで遊ぶ？',W/2,GH*0.35);
  // Buttons
  const bw=Math.min(W*0.7,320),bh=CELL*1.4,bx=W/2-bw/2;
  // Free mode button
  const freeY=GH*0.45;
  ctx.fillStyle='#2255aa';ctx.beginPath();ctx.roundRect(bx,freeY,bw,bh,bh*0.2);ctx.fill();
  ctx.strokeStyle='#55aaff';ctx.lineWidth=2;ctx.stroke();

// ── Level Select Screen ────────────────────────────────────────────
const LS_COLS=5, LS_ROWS=4;
function drawLevelSelect(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffdd00';ctx.font=`bold ${CELL*0.7}px sans-serif`;ctx.textAlign='center';
  ctx.fillText('🏆 ステージ選択',W/2,CELL*0.8);
  // Back button
  const backW=CELL*2.5,backH=CELL*0.6,backX=10,backY=8;
  ctx.fillStyle='#334';ctx.beginPath();ctx.roundRect(backX,backY,backW,backH,backH*0.3);ctx.fill();
  ctx.fillStyle='#aaa';ctx.font=`${CELL*0.32}px sans-serif`;ctx.textAlign='left';
  ctx.fillText('← もどる',backX+10,backY+backH*0.68);
  canvas._lsBackBtn={x:backX,y:backY,w:backW,h:backH};
  // Level buttons grid
  const padX=CELL*0.3,padY=CELL*1.1;
  const bw=Math.floor((W-padX*2)/LS_COLS)-4;
  const bh=Math.floor((GH-padY-CELL*0.3)/LS_ROWS)-4;
  canvas._lsBtns=[];
  for(let i=0;i<20;i++){
    const col=i%LS_COLS,row=Math.floor(i/LS_COLS);
    const bx=padX+col*(bw+4),by=padY+row*(bh+4);
    canvas._lsBtns.push({x:bx,y:by,w:bw,h:bh,idx:i});
    const cleared=clearedLevels[i];
    const unlocked=i===0||clearedLevels[i-1];
    ctx.fillStyle=cleared?'#225522':unlocked?'#223355':'#1e1e2e';
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,4);ctx.fill();
    ctx.strokeStyle=cleared?'#44ff44':unlocked?'#4488ff':'#333344';ctx.lineWidth=1.5;ctx.stroke();
    if(cleared){
      ctx.fillStyle='#88ff88';ctx.font=`bold ${Math.min(bh*0.55,CELL*0.5)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('★',bx+bw/2,by+bh*0.38);
      ctx.font=`${Math.min(bh*0.28,CELL*0.25)}px sans-serif`;ctx.fillStyle='#aaffaa';
      ctx.fillText(i+1,bx+bw/2,by+bh*0.75);
    } else if(unlocked){
      ctx.fillStyle='#fff';ctx.font=`bold ${Math.min(bh*0.5,CELL*0.45)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(i+1,bx+bw/2,by+bh*0.35);
      // Show ball shape preview
      const sh=getBallShape(i);const diff=getLevelDifficulty(i);
      const pr=Math.min(bh*0.15,CELL*0.18)*diff.ballScale;
      ctx.fillStyle=sh.color1;drawBallPath(ctx,bx+bw/2,by+bh*0.72,pr,sh);ctx.fill();
      if(diff.timeLimit>0){ctx.fillStyle='#ffaa44';ctx.font=`${Math.min(bh*0.18,CELL*0.16)}px sans-serif`;ctx.fillText(`${diff.timeLimit}s`,bx+bw-6,by+10);}
    } else {
      ctx.fillStyle='#555';ctx.font=`${Math.min(bh*0.5,CELL*0.4)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🔒',bx+bw/2,by+bh/2);
    }
    ctx.textBaseline='alphabetic';
  }
  // Progress count
  const cleared30=Object.keys(clearedLevels).length;
  ctx.fillStyle='#aaa';ctx.font=`${CELL*0.3}px sans-serif`;ctx.textAlign='center';
  ctx.fillText(`クリア: ${cleared30}/20`,W/2,H-8);
}

// ── Grid draw helper ───────────────────────────────────────────────
function drawGrid(){
  ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,GW,GH);
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,GH);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(GW,r*CELL);ctx.stroke();}
  const isChallenge=(state==='challengeEdit'||state==='challengePlay'||state==='challengeWin'||state==='challengeFail');
  for(let row=0;row<ROWS;row++){
    for(let col=0;col<COLS;col++){
      const t=grid[row][col];
      if(t===NONE)continue;
      const tx=col*CELL,ty=row*CELL;
      if(t===GOAL)drawGoal(tx,ty,CELL);
      else BLOCK_INFO.find(b=>b.type===t)?.draw(tx,ty,CELL);
      // Lock indicator for challenge mode
      if(isChallenge&&lockedGrid[row]&&lockedGrid[row][col]){
        ctx.strokeStyle='rgba(255,220,0,0.55)';ctx.lineWidth=2;ctx.strokeRect(tx+1,ty+1,CELL-2,CELL-2);
        ctx.fillStyle='rgba(255,220,0,0.75)';ctx.font=`${CELL*0.22}px sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';
        ctx.fillText('🔒',tx+2,ty+1);ctx.textBaseline='alphabetic';
      }
    }
  }
}

// ── Challenge toolbar draw ─────────────────────────────────────────
function drawChallengeToolbar(){
  const infos=getChallengeToolbarInfo();
  const n=infos.length;
  const cols=Math.min(n,ROW1);
  const bw=Math.floor(W/cols);
  ctx.fillStyle='#111';ctx.fillRect(0,GH,W,TOOL_H);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,GH,W,2);
  for(let i=0;i<n;i++){
    const info=infos[i];
    const row=i<cols?0:1,col=i<cols?i:i-cols;
    const bx=col*bw,by=GH+3+row*(BTN_H+3);
    const active=sel===info.type;
    const rem=info.type!==NONE?getChallengeRemaining(info.type):Infinity;
    const depleted=(rem<=0&&info.type!==NONE);
    ctx.fillStyle=depleted?'#181818':active?info.col+'dd':'#1e1e1e';
    ctx.fillRect(bx+1,by+1,bw-2,BTN_H-2);
    if(active){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(bx+1,by+1,bw-2,BTN_H-2);}
    ctx.save();ctx.beginPath();ctx.rect(bx+1,by+1,bw-2,BTN_H-2);ctx.clip();
    const ps=Math.min(bw-8,BTN_H-14);
    const px=bx+bw/2-ps/2,py=by+2;
    if(info.type!==NONE&&!depleted)info.draw(px,py,ps);
    else if(info.type===NONE)info.draw(px,py,ps);
    ctx.restore();
    ctx.fillStyle=depleted?'#555':active?'#fff':'#999';
    ctx.font=`${Math.max(6,Math.min(8,bw*.22))}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(info.label,bx+bw/2,by+BTN_H-2);
    // Count badge
    if(info.type!==NONE&&rem!==Infinity){
      const badge=`あと${rem}`;
      ctx.fillStyle=rem<=0?'#882222':'#226633';
      const bby=by+BTN_H-10;
      ctx.fillRect(bx+2,bby,bw-4,10);
      ctx.fillStyle=rem<=0?'#ff6666':'#88ff88';
      ctx.font=`${Math.max(5,Math.min(7,bw*.19))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(badge,bx+bw/2,bby+8);
    }
  }
}

// ── Free toolbar draw ─────────────────────────────────────────────
function drawFreeToolbar(){
  ctx.fillStyle='#111';ctx.fillRect(0,GH,W,TOOL_H);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,GH,W,2);
  for(let i=0;i<BLOCK_INFO.length;i++){
    const info=BLOCK_INFO[i];
    const row=i<ROW1?0:1,col=i<ROW1?i:i-ROW1;
    const bx=col*BTN_W,by=GH+3+row*(BTN_H+3);
    const active=sel===info.type;
    ctx.fillStyle=active?info.col+'dd':'#1e1e1e';
    ctx.fillRect(bx+1,by+1,BTN_W-2,BTN_H-2);
    if(active){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(bx+1,by+1,BTN_W-2,BTN_H-2);}
    ctx.save();ctx.beginPath();ctx.rect(bx+1,by+1,BTN_W-2,BTN_H-2);ctx.clip();
    const ps=Math.min(BTN_W-8,BTN_H-14);
    const px=bx+BTN_W/2-ps/2,py=by+2;
    if(info.type!==NONE)info.draw(px,py,ps);
    ctx.restore();
    ctx.fillStyle=active?'#fff':'#999';
    ctx.font=`${Math.max(6,Math.min(8,BTN_W*.22))}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(info.label,bx+BTN_W/2,by+BTN_H-2);
  }
}

// ── Main draw ──────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);

  if(state==='modeSelect'){drawModeSelect();return;}
  if(state==='levelSelect'){drawLevelSelect();return;}
  if(state==='savePicker'){drawSlotList('どこに保存する？ 💾','save');return;}
  if(state==='loadPicker'){drawSlotList('どのコースを読み込む？ 📂','load');return;}

  // Grid area
  drawGrid();

  // Start indicator
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font=`${CELL*0.5}px sans-serif`;ctx.textAlign='center';
  ctx.fillText('🔴',CELL*1+CELL/2,CELL*0.5+CELL/4+CELL*0.2);
  const isEdit=state==='freeEdit'||state==='challengeEdit';
  if(isEdit){ctx.fillStyle='rgba(255,200,0,0.8)';ctx.font=`${CELL*0.22}px sans-serif`;ctx.fillText('スタート',CELL*1+CELL/2,CELL*0.5+CELL/4+CELL*0.52);}

  // Trail & Ball — shape changes by level in challenge mode
  const isChallMode=(state==='challengeEdit'||state==='challengePlay'||state==='challengeWin'||state==='challengeFail');
  const bShape=isChallMode?getBallShape(currentLevel):BALL_SHAPES[0];
  for(let i=0;i<trail.length;i++){ctx.globalAlpha=(i/trail.length)*0.4;ctx.fillStyle=bShape.color1;const tr=BALL_R*(0.3+0.7*i/trail.length);drawBallPath(ctx,trail[i].x,trail[i].y,tr,bShape);ctx.fill();}ctx.globalAlpha=1;

  // Ball
  if(ball){const g=ctx.createRadialGradient(ball.x-BALL_R*.3,ball.y-BALL_R*.3,0,ball.x,ball.y,BALL_R);g.addColorStop(0,'#ffffff');g.addColorStop(0.4,bShape.color1);g.addColorStop(1,bShape.color2);drawBallPath(ctx,ball.x,ball.y,BALL_R,bShape);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();}

  // Confetti
  for(const c of confetti){ctx.fillStyle=c.col;ctx.globalAlpha=c.life/120;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;

  // Toolbar
  if(state==='challengeEdit'||state==='challengePlay'||state==='challengeWin'||state==='challengeFail'){
    drawChallengeToolbar();
  } else {
    drawFreeToolbar();
  }

  // Action buttons
  const isPlay=state==='freePlay'||state==='challengePlay';
  if(isEdit){
    ctx.fillStyle='#22aa33';ctx.fillRect(GO_X,GO_Y,GO_W,GO_H);
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(11,GO_H*0.5)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('▶ ためしてみる！',GO_X+GO_W/2,GO_Y+GO_H*0.68);
    const bkH=GO_H,bkY=GO_Y;
    // Back button (compact)
    const bkW=CELL*1.8,bkX=6;
    ctx.fillStyle='#334';ctx.beginPath();ctx.roundRect(bkX,bkY,bkW,bkH,bkH*0.3);ctx.fill();
    ctx.fillStyle='#aaa';ctx.font=`${Math.max(9,GO_H*0.48)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('← もどる',bkX+bkW/2,bkY+bkH*0.68);
    canvas._editBackBtn={x:bkX,y:bkY,w:bkW,h:bkH};
    // Save / Load buttons (free mode only)
    if(state==='freeEdit'){
      const svX=bkX+bkW+4,svW=CELL*2.1;
      ctx.fillStyle='#224466';ctx.beginPath();ctx.roundRect(svX,bkY,svW,bkH,bkH*0.3);ctx.fill();
      ctx.fillStyle='#88ddff';ctx.font=`${Math.max(9,GO_H*0.46)}px sans-serif`;ctx.textAlign='center';
      ctx.fillText('💾 保存',svX+svW/2,bkY+bkH*0.68);
      canvas._saveBtn={x:svX,y:bkY,w:svW,h:bkH};
      const ldX=svX+svW+4,ldW=CELL*2.4;
      ctx.fillStyle='#334422';ctx.beginPath();ctx.roundRect(ldX,bkY,ldW,bkH,bkH*0.3);ctx.fill();
      ctx.fillStyle='#aaff88';ctx.font=`${Math.max(9,GO_H*0.46)}px sans-serif`;ctx.textAlign='center';
      ctx.fillText('📂 よみこみ',ldX+ldW/2,bkY+bkH*0.68);
      canvas._loadBtn={x:ldX,y:bkY,w:ldW,h:bkH};
    }
  }
  if(isPlay){
    ctx.fillStyle='#aa2200';ctx.fillRect(GO_X,GO_Y,GO_W,GO_H);
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(11,GO_H*0.5)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('■ もどす',GO_X+GO_W/2,GO_Y+GO_H*0.68);
  }

  // Level hint bar in challenge edit
  if(state==='challengeEdit'){
    const lv=LEVELS[currentLevel];
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,GW,CELL*0.55);
    ctx.fillStyle='#ffdd88';ctx.font=`${CELL*0.26}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(`Lv${currentLevel+1}: ${lv.name} — ${lv.hint}`,GW/2,CELL*0.38);
  }

  // Timer display
  if(state==='challengePlay'&&challengeTimeLimit>0){
    const secs=Math.ceil(challengeTimer/60);
    const ratio=challengeTimer/(challengeTimeLimit*60);
    const tCol=ratio>0.3?'#44ff88':ratio>0.15?'#ffaa00':'#ff3333';
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(GW-CELL*3.2,CELL*0.1,CELL*3,CELL*0.55);
    ctx.fillStyle=tCol;ctx.font=`bold ${CELL*0.38}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(`⏱ ${secs}びょう`,GW-CELL*1.7,CELL*0.48);
    // Flashing warning when low
    if(ratio<=0.15&&frame%20<10){ctx.fillStyle='rgba(255,0,0,0.15)';ctx.fillRect(0,0,GW,GH);}
  }
  // Timer display in edit mode
  if(state==='challengeEdit'&&challengeTimeLimit>0){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(GW-CELL*3.2,CELL*0.1,CELL*3,CELL*0.55);
    ctx.fillStyle='#88ccff';ctx.font=`bold ${CELL*0.32}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(`⏱ ${challengeTimeLimit}びょう`,GW-CELL*1.7,CELL*0.46);
  }

  // Danger zone
  if(isPlay){
    const dangerH=CELL*0.55,stripeCount=10;
    for(let i=0;i<stripeCount;i++){const blink=Math.sin(frame*0.18+i*0.6)>0;ctx.fillStyle=blink?'rgba(255,60,0,0.22)':'rgba(255,140,0,0.13)';ctx.fillRect(i*(GW/stripeCount),GH-dangerH,GW/stripeCount,dangerH);}
    ctx.fillStyle='rgba(255,80,0,0.65)';ctx.font=`bold ${CELL*0.3}px sans-serif`;ctx.textAlign='center';ctx.fillText('⚠ おちたらゲームオーバー！ ⚠',GW/2,GH-dangerH*0.28);
  }

  // Overlays
  if(state==='win'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,GH);
    ctx.fillStyle='#ffdd00';ctx.font=`bold ${CELL*1.2}px sans-serif`;ctx.textAlign='center';ctx.shadowColor='#ffaa00';ctx.shadowBlur=30;ctx.fillText('🎉クリア！！',W/2,GH*0.42);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font=`${CELL*0.5}px sans-serif`;ctx.fillText('すごい！ゴールまで届いた！',W/2,GH*0.6);
    ctx.fillStyle='#88ff88';ctx.font=`${CELL*0.38}px sans-serif`;ctx.fillText('タップでもういっかい',W/2,GH*0.75);
  }
  if(state==='fail'){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,GH);
    ctx.font=`${CELL*1.5}px sans-serif`;ctx.textAlign='center';ctx.fillText('💥',W/2,GH*0.28);
    ctx.shadowColor='#ff2200';ctx.shadowBlur=30;ctx.fillStyle='#ff3333';ctx.font=`bold ${CELL*0.92}px sans-serif`;ctx.fillText('ゲームオーバー！',W/2,GH*0.48);ctx.shadowBlur=0;
    ctx.fillStyle='#ffcc44';ctx.font=`${CELL*0.4}px sans-serif`;ctx.fillText('ボールが落っこちた〜！',W/2,GH*0.63);
    const btnY=GH*0.77,btnW=CELL*5.5,btnH=CELL*0.75;
    ctx.fillStyle='#ff5533';ctx.beginPath();ctx.roundRect(W/2-btnW/2,btnY-btnH*0.7,btnW,btnH,btnH/2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold ${CELL*0.38}px sans-serif`;ctx.fillText('👆 タップしてなおす',W/2,btnY);
  }
  if(state==='challengeWin'){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,GH);
    ctx.fillStyle='#ffdd00';ctx.font=`bold ${CELL*1.1}px sans-serif`;ctx.textAlign='center';ctx.shadowColor='#ffaa00';ctx.shadowBlur=30;ctx.fillText('🎉 ステージクリア！',W/2,GH*0.3);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font=`${CELL*0.45}px sans-serif`;ctx.fillText(`Lv${currentLevel+1}: ${LEVELS[currentLevel].name}`,W/2,GH*0.43);
    // Show next level changes
    if(currentLevel<19){
      const nextShape=getBallShape(currentLevel+1);const curShape=getBallShape(currentLevel);
      const nextDiff=getLevelDifficulty(currentLevel+1);const curDiff=getLevelDifficulty(currentLevel);
      let hints=[];
      if(nextShape!==curShape) hints.push(`🆕 ボール→${nextShape.name}`);
      if(nextDiff.ballScale<curDiff.ballScale) hints.push('🔍 ボールが小さくなる！');
      if(nextDiff.timeLimit>0&&curDiff.timeLimit===0) hints.push('⏱ タイム制限スタート！');
      else if(nextDiff.timeLimit>0&&nextDiff.timeLimit<curDiff.timeLimit) hints.push(`⏱ ${nextDiff.timeLimit}びょう！`);
      if(hints.length>0){ctx.fillStyle='#88ffcc';ctx.font=`bold ${CELL*0.32}px sans-serif`;ctx.fillText(hints.join('  '),W/2,GH*0.52);}
    }
    // Next level / back buttons
    const bw2=CELL*4,bh2=CELL*0.85,by2=GH*0.6;
    if(currentLevel<19){
      ctx.fillStyle='#22aa44';ctx.beginPath();ctx.roundRect(W/2-bw2/2,by2,bw2,bh2,bh2*0.3);ctx.fill();
      ctx.fillStyle='#fff';ctx.font=`bold ${CELL*0.45}px sans-serif`;ctx.fillText('つぎへ！▶',W/2,by2+bh2*0.68);
      canvas._chalWinNextBtn={x:W/2-bw2/2,y:by2,w:bw2,h:bh2};
    } else {
      ctx.fillStyle='#ffdd00';ctx.font=`bold ${CELL*0.55}px sans-serif`;ctx.fillText('🏆 全ステージクリア！！',W/2,by2+bh2*0.68);
      canvas._chalWinNextBtn=null;
    }
    const by3=GH*0.6+bh2+CELL*0.4;
    ctx.fillStyle='#334466';ctx.beginPath();ctx.roundRect(W/2-bw2/2,by3,bw2,bh2*0.8,bh2*0.25);ctx.fill();
    ctx.fillStyle='#aaa';ctx.font=`${CELL*0.38}px sans-serif`;ctx.fillText('← ステージ選択に戻る',W/2,by3+bh2*0.55);
    canvas._chalWinBackBtn={x:W/2-bw2/2,y:by3,w:bw2,h:bh2*0.8};
  }
  if(state==='challengeFail'){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,GH);
    const failEmoji=failReason==='time'?'⏱':'💥';
    const failMsg=failReason==='time'?'じかんぎれ！':'ざんねん！';
    const failSub=failReason==='time'?'もっとはやくクリアしよう！':'もう一回チャレンジ！';
    ctx.font=`${CELL*1.4}px sans-serif`;ctx.textAlign='center';ctx.fillText(failEmoji,W/2,GH*0.25);
    ctx.shadowColor='#ff2200';ctx.shadowBlur=30;ctx.fillStyle='#ff4444';ctx.font=`bold ${CELL*0.85}px sans-serif`;ctx.fillText(failMsg,W/2,GH*0.46);ctx.shadowBlur=0;
    ctx.fillStyle='#ffcc44';ctx.font=`${CELL*0.38}px sans-serif`;ctx.fillText(failSub,W/2,GH*0.58);
    const bw2=CELL*4,bh2=CELL*0.85,by2=GH*0.67;
    ctx.fillStyle='#aa3311';ctx.beginPath();ctx.roundRect(W/2-bw2/2,by2,bw2,bh2,bh2*0.3);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold ${CELL*0.42}px sans-serif`;ctx.fillText('🔄 もう一回！',W/2,by2+bh2*0.68);
    canvas._chalFailRetryBtn={x:W/2-bw2/2,y:by2,w:bw2,h:bh2};
    const by3=by2+bh2+CELL*0.3;
    ctx.fillStyle='#334466';ctx.beginPath();ctx.roundRect(W/2-bw2/2,by3,bw2,bh2*0.8,bh2*0.25);ctx.fill();
    ctx.fillStyle='#aaa';ctx.font=`${CELL*0.35}px sans-serif`;ctx.fillText('← ステージ選択に戻る',W/2,by3+bh2*0.55);
    canvas._chalFailBackBtn={x:W/2-bw2/2,y:by3,w:bw2,h:bh2*0.8};
  }
}

// ── Game loop ──────────────────────────────────────────────────────
function loop(){
  frame++;
  if(state==='freePlay'||state==='challengePlay')updateBall();
  for(let i=confetti.length-1;i>=0;i--){confetti[i].x+=confetti[i].vx;confetti[i].y+=confetti[i].vy;confetti[i].vy+=0.1;confetti[i].life--;if(confetti[i].life<=0)confetti.splice(i,1);}
  draw();
  requestAnimationFrame(loop);
}

// ── Input ──────────────────────────────────────────────────────────
function getCell(x,y){
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS)return null;
  return{col,row};
}
let painting=false,paintType=FLOOR;

function hitBtn(btn,x,y){return btn&&x>=btn.x&&x<=btn.x+btn.w&&y>=btn.y&&y<=btn.y+btn.h;}

function onDown(x,y){
  initAudio();

  // ── modeSelect ──
  if(state==='modeSelect'){
    if(hitBtn(canvas._modeFreeBtn,x,y)){initFreePlay();beep(440,0.1,0.2,'triangle');}
    else if(hitBtn(canvas._modeChalBtn,x,y)){state='levelSelect';beep(500,0.1,0.2,'triangle');}
    return;
  }

  // ── levelSelect ──
  if(state==='levelSelect'){
    if(hitBtn(canvas._lsBackBtn,x,y)){state='modeSelect';return;}
    if(canvas._lsBtns){
      for(const b of canvas._lsBtns){
        if(hitBtn(b,x,y)){
          const unlocked=b.idx===0||clearedLevels[b.idx-1];
          if(unlocked){initChallenge(b.idx);beep(440,0.1,0.2,'triangle');}
          else beep(200,0.1,0.1,'sawtooth');
          return;
        }
      }
    }
    return;
  }

  // ── challengeWin ──
  if(state==='challengeWin'){
    if(hitBtn(canvas._chalWinNextBtn,x,y)&&currentLevel<19){initChallenge(currentLevel+1);beep(440,0.12,0.2,'triangle');return;}
    if(hitBtn(canvas._chalWinBackBtn,x,y)){state='levelSelect';return;}
    return;
  }

  // ── challengeFail ──
  if(state==='challengeFail'){
    if(hitBtn(canvas._chalFailRetryBtn,x,y)){initChallenge(currentLevel);beep(440,0.1,0.15,'triangle');return;}
    if(hitBtn(canvas._chalFailBackBtn,x,y)){state='levelSelect';return;}
    return;
  }

  // ── savePicker ──
  if(state==='savePicker'){
    if(hitBtn(canvas._slotBackBtn,x,y)){state='freeEdit';return;}
    for(let i=0;i<SAVE_MAX;i++){
      if(canvas[`_slotBtn_${i}`]?.valid!==false&&hitBtn(canvas[`_slotBtn_${i}`],x,y)){
        writeSave(i);beep(660,0.12,0.25,'triangle');setTimeout(()=>beep(880,0.1,0.2,'triangle'),100);
        state='freeEdit';return;
      }
    }
    return;
  }

  // ── loadPicker ──
  if(state==='loadPicker'){
    if(hitBtn(canvas._slotBackBtn,x,y)){state='freeEdit';return;}
    for(let i=0;i<SAVE_MAX;i++){
      if(canvas[`_slotBtn_${i}`]?.valid&&hitBtn(canvas[`_slotBtn_${i}`],x,y)){
        applyLoad(i);beep(440,0.1,0.2,'triangle');setTimeout(()=>beep(660,0.12,0.25,'triangle'),100);return;
      }
    }
    return;
  }

  // ── win/fail (free mode) ──
  if(state==='win'||state==='fail'){state='freeEdit';ball=null;trail=[];confetti=[];return;}

  // ── Toolbar area ──
  if(y>GH){
    // save/load buttons (free edit only)
    if(state==='freeEdit'&&hitBtn(canvas._saveBtn,x,y)){state='savePicker';return;}
    if(state==='freeEdit'&&hitBtn(canvas._loadBtn,x,y)){state='loadPicker';return;}
    // back button from edit
    if(hitBtn(canvas._editBackBtn,x,y)){
      state=(state==='freeEdit'||state==='freePlay')?'modeSelect':'levelSelect';
      ball=null;trail=[];return;
    }
    // Go / stop button
    if(x>=GO_X&&x<=GO_X+GO_W&&y>=GO_Y&&y<=GO_Y+GO_H){
      if(state==='freeEdit'){state='freePlay';spawnBall();beep(440,0.1,0.2,'triangle');}
      else if(state==='freePlay'){state='freeEdit';ball=null;trail=[];}
      else if(state==='challengeEdit'){state='challengePlay';challengeTimer=challengeTimeLimit*60;spawnBall();beep(440,0.1,0.2,'triangle');}
      else if(state==='challengePlay'){state='challengeEdit';ball=null;trail=[];}
      return;
    }
    // Toolbar button
    if(state==='challengeEdit'){
      const btn=getChallengeToolbarBtn(x,y);
      if(btn>=0){
        const infos=getChallengeToolbarInfo();
        const info=infos[btn];
        if(info){const rem=info.type!==NONE?getChallengeRemaining(info.type):Infinity;if(rem>0||info.type===NONE){sel=info.type;beep(600,0.05,0.1);}}
      }
    } else {
      const btn=getToolbarBtn(x,y);
      if(btn>=0){sel=BLOCK_INFO[btn].type;beep(600,0.05,0.1);}
    }
    return;
  }

  // ── Grid painting ──
  if(state!=='freeEdit'&&state!=='challengeEdit')return;
  const cell=getCell(x,y);if(!cell)return;
  // Check locked
  if(lockedGrid[cell.row]&&lockedGrid[cell.row][cell.col])return;
  // Check goal in free mode
  if(state==='freeEdit'&&grid[cell.row][cell.col]===GOAL)return;
  if(state==='freeEdit'&&cell.row===ROWS-1)return;

  // Challenge: count check
  if(state==='challengeEdit'&&sel!==NONE){
    const rem=getChallengeRemaining(sel);
    const already=grid[cell.row][cell.col];
    if(already===sel)return; // already same, don't double count
    if(rem<=0)return;
    // Placing: if cell had another counted block, uncount it
    if(already!==NONE&&placedCounts[already]!==undefined)placedCounts[already]=Math.max(0,(placedCounts[already]||0)-1);
    placedCounts[sel]=(placedCounts[sel]||0)+1;
  } else if(state==='challengeEdit'&&sel===NONE){
    const already=grid[cell.row][cell.col];
    if(already!==NONE&&placedCounts[already]!==undefined)placedCounts[already]=Math.max(0,(placedCounts[already]||0)-1);
  }

  painting=true;paintType=sel;
  grid[cell.row][cell.col]=sel;
  beep(500,0.04,0.08);
}

function onMove(x,y){
  if(!painting)return;
  if(state!=='freeEdit'&&state!=='challengeEdit')return;
  const cell=getCell(x,y);if(!cell)return;
  if(lockedGrid[cell.row]&&lockedGrid[cell.row][cell.col])return;
  if(state==='freeEdit'&&grid[cell.row][cell.col]===GOAL)return;
  if(state==='freeEdit'&&cell.row===ROWS-1)return;
  if(grid[cell.row][cell.col]===paintType)return;

  // Challenge count update on drag
  if(state==='challengeEdit'){
    const already=grid[cell.row][cell.col];
    if(paintType!==NONE){
      const rem=getChallengeRemaining(paintType);
      if(rem<=0)return;
      if(already!==NONE&&placedCounts[already]!==undefined)placedCounts[already]=Math.max(0,(placedCounts[already]||0)-1);
      placedCounts[paintType]=(placedCounts[paintType]||0)+1;
    } else {
      if(already!==NONE&&placedCounts[already]!==undefined)placedCounts[already]=Math.max(0,(placedCounts[already]||0)-1);
    }
  }
  grid[cell.row][cell.col]=paintType;
}
function onUp(){painting=false;}

canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();onDown(e.clientX-r.left,e.clientY-r.top);});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();onMove(e.clientX-r.left,e.clientY-r.top);});
canvas.addEventListener('mouseup',()=>onUp());
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),t=e.touches[0];onDown(t.clientX-r.left,t.clientY-r.top);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),t=e.touches[0];onMove(t.clientX-r.left,t.clientY-r.top);},{passive:false});
canvas.addEventListener('touchend',()=>onUp());
canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();const r=canvas.getBoundingClientRect();
  const cell=getCell(e.clientX-r.left,e.clientY-r.top);
  if(!cell)return;
  if(lockedGrid[cell.row]&&lockedGrid[cell.row][cell.col])return;
  if(state==='freeEdit'&&(grid[cell.row][cell.col]===GOAL||cell.row===ROWS-1))return;
  if(state==='challengeEdit'){const already=grid[cell.row][cell.col];if(already!==NONE&&placedCounts[already]!==undefined)placedCounts[already]=Math.max(0,(placedCounts[already]||0)-1);}
  if(state==='freeEdit'||state==='challengeEdit')grid[cell.row][cell.col]=NONE;
});

loop();
</script>
