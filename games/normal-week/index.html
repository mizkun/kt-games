<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふつうの一週間</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
  background:#87ceeb;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  user-select:none;
}
#game{
  width:min(480px,100vw);
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* レベルセレクト */
#level-select{
  position:fixed;inset:0;
  z-index:200;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:20px 16px;
  overflow-y:auto;
}
#level-select h1{
  font-size:clamp(20px,6vw,32px);
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,0.3);
  margin-bottom:4px;
  text-align:center;
}
#level-select p{
  font-size:clamp(11px,3vw,14px);
  color:rgba(255,255,255,0.85);
  margin-bottom:20px;
  text-align:center;
}
#level-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:100%;
  max-width:420px;
}
.level-card{
  background:rgba(255,255,255,0.95);
  border-radius:20px;
  padding:18px 14px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
  transition:transform 0.15s,box-shadow 0.15s;
  border:3px solid transparent;
}
.level-card:active{transform:scale(0.96);}
.level-card:hover{transform:scale(1.03);box-shadow:0 8px 28px rgba(0,0,0,0.3);}
.lc-num{
  font-size:clamp(10px,2.8vw,13px);
  font-weight:bold;
  margin-bottom:4px;
}
.lc-emoji{font-size:clamp(40px,12vw,56px);line-height:1;margin-bottom:6px;}
.lc-name{
  font-size:clamp(14px,4vw,18px);
  font-weight:bold;
  color:#333;
  margin-bottom:3px;
}
.lc-desc{
  font-size:clamp(9px,2.5vw,11px);
  color:#888;
}
.lc1{border-color:#43e97b;}
.lc2{border-color:#4facfe;}
.lc3{border-color:#f7971e;}
.lc4{border-color:#fd79a8;}
.lc1 .lc-num{color:#43e97b;}
.lc2 .lc-num{color:#4facfe;}
.lc3 .lc-num{color:#f7971e;}
.lc4 .lc-num{color:#fd79a8;}

/* 背景 */
#sky{
  position:absolute;inset:0;
  transition:background 1.2s;
  z-index:0;
}
#ground{
  position:absolute;bottom:0;left:0;right:0;
  height:38%;
  border-radius:40% 40% 0 0 / 8% 8% 0 0;
  transition:background 1.2s;
  z-index:1;
}
#house-wrap{
  position:absolute;
  bottom:34%;left:50%;
  transform:translateX(-50%);
  font-size:clamp(60px,22vw,110px);
  z-index:2;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  line-height:1;
}
#sun-moon{
  position:absolute;
  top:8%;right:10%;
  font-size:clamp(28px,8vw,44px);
  z-index:2;
  transition:all 1.2s;
}
#clouds{
  position:absolute;top:12%;left:5%;
  font-size:clamp(20px,5vw,30px);
  z-index:2;
  opacity:0.85;
}
#rain-layer{
  position:absolute;inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
  display:none;
}
.raindrop{
  position:absolute;
  width:2px;height:14px;
  background:rgba(100,160,255,0.55);
  border-radius:2px;
  animation:fall linear infinite;
}
@keyframes fall{from{top:-20px}to{top:100%}}

/* UI上部 */
#topbar{
  position:relative;z-index:10;
  padding:10px 14px 6px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
#day-label{
  font-size:clamp(13px,3.5vw,17px);
  font-weight:bold;
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,0.4);
}
#phase-label{
  font-size:clamp(11px,3vw,14px);
  color:rgba(255,255,255,0.9);
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
}
#happy-bar-wrap{
  display:flex;align-items:center;gap:8px;
}
#happy-icon{font-size:16px;}
#happy-bar-bg{
  flex:1;height:12px;
  background:rgba(255,255,255,0.35);
  border-radius:8px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.5);
}
#happy-bar{
  height:100%;
  background:linear-gradient(90deg,#ffdd44,#ff8844);
  border-radius:8px;
  transition:width 0.8s;
}
#happy-num{
  font-size:12px;color:#fff;
  font-weight:bold;
  text-shadow:0 1px 2px rgba(0,0,0,0.4);
  min-width:32px;
}

/* キャラクターエリア */
#chars{
  position:absolute;
  bottom:36%;left:0;right:0;
  display:flex;
  justify-content:center;
  gap:clamp(4px,2vw,14px);
  z-index:5;
  padding:0 20px;
}
.char{
  display:flex;flex-direction:column;align-items:center;
  gap:2px;
  animation:bounce 2.5s ease-in-out infinite;
}
.char:nth-child(2){animation-delay:0.4s;}
.char:nth-child(3){animation-delay:0.8s;}
.char:nth-child(4){animation-delay:1.2s;}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.char-emoji{font-size:clamp(28px,9vw,42px);line-height:1;}
.char-name{
  font-size:clamp(9px,2.5vw,12px);
  color:#fff;
  font-weight:bold;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);
  white-space:nowrap;
}
.char.talking .char-emoji{animation:talk 0.3s ease-in-out 4;}
@keyframes talk{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.2) translateY(-4px)}
}

/* イベントカード */
#card-wrap{
  position:absolute;
  bottom:0;left:0;right:0;
  z-index:20;
  padding:0 0 0;
}
#event-card{
  background:rgba(255,255,255,0.97);
  border-radius:24px 24px 0 0;
  padding:clamp(14px,4vw,22px) clamp(14px,4vw,22px) clamp(16px,4vw,24px);
  box-shadow:0 -4px 20px rgba(0,0,0,0.15);
  min-height:220px;
  display:flex;
  flex-direction:column;
  gap:10px;
  animation:slideUp 0.4s ease;
}
@keyframes slideUp{
  from{transform:translateY(60px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
#event-icon{font-size:clamp(24px,7vw,36px);text-align:center;}
#event-title{
  font-size:clamp(13px,3.8vw,18px);
  font-weight:bold;
  color:#333;
  text-align:center;
  line-height:1.4;
}
#event-text{
  font-size:clamp(12px,3.3vw,15px);
  color:#555;
  line-height:1.7;
  text-align:center;
  min-height:44px;
}
#choices{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:4px;
}
.choice-btn{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:clamp(10px,2.8vw,14px) 16px;
  font-size:clamp(13px,3.5vw,16px);
  font-weight:bold;
  cursor:pointer;
  transition:all 0.15s;
  font-family:inherit;
  box-shadow:0 3px 10px rgba(102,126,234,0.4);
  text-align:left;
  line-height:1.4;
}
.choice-btn:active{transform:scale(0.97);}
.choice-btn.green{background:linear-gradient(135deg,#43e97b,#38f9d7);box-shadow:0 3px 10px rgba(67,233,123,0.4);color:#1a5a3a;}
.choice-btn.orange{background:linear-gradient(135deg,#f7971e,#ffd200);box-shadow:0 3px 10px rgba(247,151,30,0.4);color:#5a3a00;}
.choice-btn.red{background:linear-gradient(135deg,#ff6b6b,#ee0979);box-shadow:0 3px 10px rgba(255,107,107,0.4);}
.choice-btn.next{
  background:linear-gradient(135deg,#a8edea,#fed6e3);
  color:#555;
  box-shadow:0 3px 10px rgba(168,237,234,0.4);
  text-align:center;
}

/* もどるボタン */
#back-to-level{
  position:absolute;
  top:10px;right:12px;
  z-index:30;
  background:rgba(255,255,255,0.85);
  border:none;
  border-radius:16px;
  padding:5px 11px;
  font-size:clamp(10px,2.8vw,13px);
  font-weight:bold;
  color:#555;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

/* 吹き出し */
#speech{
  position:absolute;
  z-index:15;
  background:#fff;
  border-radius:12px;
  padding:6px 10px;
  font-size:clamp(10px,2.8vw,13px);
  color:#333;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  max-width:180px;
  text-align:center;
  line-height:1.4;
  bottom:42%;
  left:50%;
  transform:translateX(-50%);
  display:none;
  white-space:pre-line;
}
#speech::after{
  content:'';
  position:absolute;
  bottom:-8px;left:50%;
  transform:translateX(-50%);
  border:4px solid transparent;
  border-top-color:#fff;
}

/* エフェクト */
#effect{
  position:fixed;inset:0;
  z-index:50;
  pointer-events:none;
  display:none;
  justify-content:center;
  align-items:center;
}
.confetti{
  position:absolute;
  width:8px;height:8px;
  border-radius:2px;
  animation:confettiFall 1.8s ease-in forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
#big-effect{
  font-size:clamp(36px,12vw,64px);
  animation:popIn 0.5s ease;
  text-align:center;
}
@keyframes popIn{
  0%{transform:scale(0) rotate(-10deg);opacity:0}
  70%{transform:scale(1.2) rotate(3deg)}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}

/* 結果画面 */
#week-result{
  position:fixed;inset:0;
  z-index:100;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#667eea,#764ba2);
  padding:24px;
  text-align:center;
  overflow-y:auto;
}
#week-result h1{
  font-size:clamp(22px,6vw,36px);
  color:#fff;
  margin-bottom:8px;
  text-shadow:0 2px 8px rgba(0,0,0,0.3);
}
#week-result .score-area{
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  padding:20px 30px;
  margin:16px 0;
  width:100%;
  max-width:340px;
}
#result-score{
  font-size:clamp(36px,12vw,64px);
  color:#ffd700;
  font-weight:bold;
  text-shadow:0 2px 8px rgba(0,0,0,0.4);
}
#result-rank{
  font-size:clamp(18px,5vw,28px);
  color:#fff;
  margin:8px 0;
}
#result-memories{
  font-size:clamp(11px,3vw,15px);
  color:rgba(255,255,255,0.9);
  line-height:1.8;
  margin:8px 0;
  text-align:left;
  max-width:340px;
  width:100%;
}
#result-life-special{
  font-size:clamp(13px,3.5vw,17px);
  color:#ffd700;
  font-weight:bold;
  margin:10px 0;
  text-align:center;
}
#replay-btn{
  background:#fff;
  color:#764ba2;
  border:none;
  border-radius:16px;
  padding:14px 36px;
  font-size:clamp(16px,4.5vw,22px);
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
  font-family:inherit;
}
#level-select-btn{
  background:rgba(255,255,255,0.2);
  color:#fff;
  border:2px solid rgba(255,255,255,0.5);
  border-radius:16px;
  padding:10px 24px;
  font-size:clamp(13px,3.5vw,17px);
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
  font-family:inherit;
}
#home-link{
  position:absolute;top:12px;left:12px;
  z-index:200;
  background:rgba(255,255,255,0.85);
  border-radius:20px;
  padding:6px 12px;
  font-size:clamp(11px,3vw,14px);
  text-decoration:none;
  color:#555;
  font-weight:bold;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
</style>
</head>
<body>
<div id="game">
  <a href="../../index.html" id="home-link">🏠 ゲームいちらんにもどる</a>

  <div id="sky"></div>
  <div id="ground"></div>
  <div id="sun-moon">☀️</div>
  <div id="clouds">☁️ &nbsp; ☁️</div>
  <div id="rain-layer"></div>
  <div id="house-wrap">🏠</div>

  <div id="chars">
    <div class="char" id="char-papa"><div class="char-emoji">👨</div><div class="char-name">パパ</div></div>
    <div class="char" id="char-mama"><div class="char-emoji">👩</div><div class="char-name">ママ</div></div>
    <div class="char" id="char-k1"><div class="char-emoji">👦</div><div class="char-name">けんた</div></div>
    <div class="char" id="char-k2"><div class="char-emoji">👧</div><div class="char-name">さくら</div></div>
  </div>

  <div id="speech"></div>

  <div id="topbar">
    <div id="day-label">月曜日 🌅 あさ</div>
    <div id="phase-label">ふつうの一週間がはじまるよ</div>
    <div id="happy-bar-wrap">
      <span id="happy-icon">😊</span>
      <div id="happy-bar-bg"><div id="happy-bar" style="width:60%"></div></div>
      <span id="happy-num">60</span>
    </div>
  </div>

  <button id="back-to-level" onclick="showLevelSelect()">← レベルえらびにもどる</button>

  <div id="card-wrap">
    <div id="event-card">
      <div id="event-icon">🌞</div>
      <div id="event-title">読み込み中…</div>
      <div id="event-text"></div>
      <div id="choices"></div>
    </div>
  </div>

  <div id="effect"><div id="big-effect"></div></div>
</div>

<!-- レベルセレクト -->
<div id="level-select">
  <h1>🏠 ふつうのじんせい</h1>
  <p>どの時間をすごす？</p>
  <div id="level-grid">
    <div class="level-card lc1" onclick="startLevel(1)">
      <div class="lc-num">レベル 1</div>
      <div class="lc-emoji">📅</div>
      <div class="lc-name">一週間</div>
      <div class="lc-desc">月〜日の7日間</div>
    </div>
    <div class="level-card lc2" onclick="startLevel(2)">
      <div class="lc-num">レベル 2</div>
      <div class="lc-emoji">🗓️</div>
      <div class="lc-name">一ヶ月</div>
      <div class="lc-desc">30日間のできごと</div>
    </div>
    <div class="level-card lc3" onclick="startLevel(3)">
      <div class="lc-num">レベル 3</div>
      <div class="lc-emoji">🌸</div>
      <div class="lc-name">一年</div>
      <div class="lc-desc">1月〜12月をすごす</div>
    </div>
    <div class="level-card lc4" onclick="startLevel(4)">
      <div class="lc-num">レベル 4</div>
      <div class="lc-emoji">👶</div>
      <div class="lc-name">100年</div>
      <div class="lc-desc">赤ちゃんから100歳まで！</div>
    </div>
  </div>
</div>

<div id="week-result">
  <h1 id="result-title">🎉 一週間おわったよ！</h1>
  <div class="score-area">
    <div id="result-score">0</div>
    <div id="result-rank">ふつうのかぞく</div>
  </div>
  <div id="result-memories"></div>
  <div id="result-life-special"></div>
  <button id="replay-btn" onclick="replayLevel()">もう一回やってみる！</button>
  <button id="level-select-btn" onclick="backToLevelSelect()">↩ レベルえらびにもどる</button>
  <a href="../../index.html" style="color:rgba(255,255,255,0.7);margin-top:12px;font-size:14px;">🏠 ゲームいちらんにもどる</a>
</div>

<script>
// ===== 状態 =====
let happy = 60;
let memories = [];
let eventQueue = [];
let qIdx = 0;
let isRaining = false;
let currentLevel = 1;
let lifeAge = 0; // Level4用

// ===== 背景テーマ =====
const themes = {
  morning: { sky:'linear-gradient(180deg,#87ceeb 0%,#ffe8cc 100%)', ground:'#5a9e52', sun:'☀️', sunPos:'top:8%;right:10%' },
  noon:    { sky:'linear-gradient(180deg,#4fa8dc 0%,#87ceeb 100%)', ground:'#4a8e42', sun:'🌤', sunPos:'top:5%;right:20%' },
  evening: { sky:'linear-gradient(180deg,#ff7043 0%,#ffb74d 50%,#7e57c2 100%)', ground:'#3a7032', sun:'🌆', sunPos:'top:10%;right:8%' },
  night:   { sky:'linear-gradient(180deg,#0d1b4b 0%,#1a237e 100%)', ground:'#1a3a18', sun:'🌙', sunPos:'top:8%;right:12%' },
  spring:  { sky:'linear-gradient(180deg,#a8edea 0%,#fed6e3 100%)', ground:'#7ec87e', sun:'🌸', sunPos:'top:8%;right:10%' },
  summer:  { sky:'linear-gradient(180deg,#2196f3 0%,#87ceeb 100%)', ground:'#2e8b57', sun:'☀️', sunPos:'top:5%;right:15%' },
  autumn:  { sky:'linear-gradient(180deg,#ffa726 0%,#ffe0b2 100%)', ground:'#8b6914', sun:'🍂', sunPos:'top:8%;right:12%' },
  winter:  { sky:'linear-gradient(180deg,#b3c6e0 0%,#e8eaf6 100%)', ground:'#dce8f5', sun:'❄️', sunPos:'top:8%;right:10%' },
};

function setTheme(t, rainy=false){
  isRaining = rainy;
  const theme = themes[t] || themes.morning;
  document.getElementById('sky').style.background = theme.sky;
  document.getElementById('ground').style.background = theme.ground;
  document.getElementById('sun-moon').textContent = rainy ? '🌧️' : theme.sun;
  const rainEl = document.getElementById('rain-layer');
  if(rainy){
    rainEl.style.display='block';
    if(rainEl.children.length===0) makeRain();
    document.getElementById('clouds').textContent='🌧️ 🌧️';
  } else {
    rainEl.style.display='none';
    document.getElementById('clouds').textContent='☁️  ☁️';
  }
}

function makeRain(){
  const r = document.getElementById('rain-layer');
  for(let i=0;i<28;i++){
    const d=document.createElement('div');
    d.className='raindrop';
    d.style.left=Math.random()*100+'%';
    d.style.animationDuration=(0.5+Math.random()*0.7)+'s';
    d.style.animationDelay=Math.random()*1.5+'s';
    r.appendChild(d);
  }
}

// ===== 幸せ度 =====
function setHappy(delta, text=''){
  happy = Math.max(0, Math.min(100, happy + delta));
  document.getElementById('happy-bar').style.width = happy+'%';
  document.getElementById('happy-num').textContent = happy;
  const icon = happy>=80?'😄':happy>=50?'😊':happy>=30?'😐':'😢';
  document.getElementById('happy-icon').textContent = icon;
  document.getElementById('happy-bar').style.background =
    happy>=70 ? 'linear-gradient(90deg,#43e97b,#38f9d7)' :
    happy>=40 ? 'linear-gradient(90deg,#ffdd44,#ff8844)' :
                'linear-gradient(90deg,#ff6b6b,#ee0979)';
}

// ===== 吹き出し =====
function showSpeech(charId, text, ms=2200){
  const charEl = document.getElementById('char-'+charId);
  if(!charEl) return;
  charEl.classList.add('talking');
  const s = document.getElementById('speech');
  s.textContent = text;
  const rect = charEl.getBoundingClientRect();
  const gameRect = document.getElementById('game').getBoundingClientRect();
  s.style.display='block';
  s.style.bottom = '42%';
  s.style.left = '';
  s.style.right = '';
  const cx = rect.left - gameRect.left + rect.width/2;
  const gw = gameRect.width;
  if(cx < gw/2){
    s.style.left = Math.max(4,cx-60)+'px';
    s.style.right='auto';
  } else {
    s.style.right = Math.max(4, gw-cx-60)+'px';
    s.style.left='auto';
  }
  setTimeout(()=>{
    s.style.display='none';
    charEl.classList.remove('talking');
  }, ms);
}

// ===== エフェクト =====
function showEffect(emoji, delta){
  const eff = document.getElementById('effect');
  const big = document.getElementById('big-effect');
  big.textContent = emoji + (delta>0?'\n+'+delta+'😊':'');
  eff.style.display='flex';
  if(delta>0) makeConfetti();
  setTimeout(()=>{ eff.style.display='none'; eff.innerHTML='<div id="big-effect"></div>'; },1600);
}

function makeConfetti(){
  const eff = document.getElementById('effect');
  const colors=['#ff6b6b','#ffd700','#43e97b','#667eea','#f093fb','#4facfe'];
  for(let i=0;i<20;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.top='-10px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*0.8+'s';
    c.style.animationDuration=(1.2+Math.random()*0.8)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    eff.appendChild(c);
  }
}

// ===== Level4: 年齢→キャラ =====
function ageToChar(age){
  if(age<=12) return '🧒';
  if(age<=17) return '👦';
  if(age<=25) return '🧑';
  if(age<=45) return '👨';
  if(age<=60) return '👨‍🦳';
  if(age<=75) return '🧓';
  return '👴';
}

function updateCharsForAge(age){
  const emoji = ageToChar(age);
  document.getElementById('char-k1').querySelector('.char-emoji').textContent = emoji;
  document.getElementById('char-k2').querySelector('.char-emoji').textContent = emoji;
}

// ===== ゲーム状態 =====
let events = [];
let eventIndex = 0;

function showLevelSelect(){
  document.getElementById('level-select').style.display='flex';
  document.getElementById('week-result').style.display='none';
}

function backToLevelSelect(){
  document.getElementById('week-result').style.display='none';
  document.getElementById('level-select').style.display='flex';
}

function startLevel(level){
  currentLevel = level;
  document.getElementById('level-select').style.display='none';
  happy = 60;
  memories = [];
  eventIndex = 0;
  lifeAge = 0;
  setHappy(0);

  // キャラをリセット
  document.getElementById('char-k1').querySelector('.char-emoji').textContent='👦';
  document.getElementById('char-k2').querySelector('.char-emoji').textContent='👧';
  document.getElementById('char-k1').querySelector('.char-name').textContent='けんた';
  document.getElementById('char-k2').querySelector('.char-name').textContent='さくら';

  if(level===1) events = buildEventsLevel1();
  else if(level===2) events = buildEventsLevel2();
  else if(level===3) events = buildEventsLevel3();
  else if(level===4){
    events = buildEventsLevel4();
    document.getElementById('char-k1').querySelector('.char-name').textContent='あなた';
    document.getElementById('char-k2').querySelector('.char-name').textContent='あなた';
  }

  document.getElementById('week-result').style.display='none';
  showEvent();
}

function replayLevel(){
  startLevel(currentLevel);
}

function showEvent(){
  if(eventIndex >= events.length){
    showResult();
    return;
  }
  const ev = events[eventIndex];

  // Level4: 年齢を更新
  if(currentLevel===4 && ev.age !== undefined){
    lifeAge = ev.age;
    updateCharsForAge(lifeAge);
    document.getElementById('day-label').textContent = ev.day;
    document.getElementById('phase-label').textContent = '';
  } else {
    setTheme(ev.theme || 'morning', ev.rainy || false);
    document.getElementById('day-label').textContent = ev.day + ' ' + (ev.phase||'');
    document.getElementById('phase-label').textContent = '';
  }

  if(currentLevel===4){
    // level4は年齢ベースの背景
    const age = ev.age || 0;
    const themeKey = age<=20 ? 'morning' : age<=40 ? 'noon' : age<=60 ? 'evening' : age<=80 ? 'autumn' : 'night';
    setTheme(themeKey, false);
  }

  document.getElementById('event-icon').textContent = ev.icon;
  document.getElementById('event-title').textContent = ev.title;
  document.getElementById('event-text').textContent = ev.text || '';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const cols = ['','green','orange','red'];
  ev.choices.forEach((ch,i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn ' + (cols[i]||'');
    btn.textContent = ch.label;
    btn.onclick = ()=> doChoice(ch, ev);
    choicesEl.appendChild(btn);
  });

  if(ev.char && ev.speech){
    setTimeout(()=>showSpeech(ev.char, ev.speech), 600);
  }

  const card = document.getElementById('event-card');
  card.style.animation='none';
  void card.offsetWidth;
  card.style.animation='slideUp 0.4s ease';
}

function doChoice(choice, ev){
  const delta = choice.delta || 0;
  setHappy(delta);

  if(ev.memory && delta > 0) memories.push(ev.memory);

  if(delta >= 8) showEffect(choice.icon||'✨', delta);
  else if(delta <= -5) showEffect('😱', delta);

  const titleEl = document.getElementById('event-title');
  const textEl = document.getElementById('event-text');
  titleEl.textContent = choice.txt || '';
  textEl.textContent = '';
  document.getElementById('choices').innerHTML = `
    <button class="choice-btn next" onclick="nextEvent()">つぎへ →</button>
  `;
}

function nextEvent(){
  eventIndex++;
  showEvent();
}

// ===== 結果 =====
function showResult(){
  const resultEl = document.getElementById('week-result');
  resultEl.style.display='flex';

  const levelNames = ['','一週間','一ヶ月','一年間','100年の人生'];
  document.getElementById('result-title').textContent = `🎉 ${levelNames[currentLevel]}おわったよ！`;

  document.getElementById('result-score').textContent = happy + '点';

  let rank, rankEmoji;
  if(happy >= 90){ rank='最高の人生！🌟'; rankEmoji='🏆'; }
  else if(happy >= 75){ rank='たのしかったね！😄'; rankEmoji='🎉'; }
  else if(happy >= 55){ rank='ふつうにいい毎日👨‍👩‍👦‍👦'; rankEmoji='😊'; }
  else if(happy >= 35){ rank='ちょっとくたびれた…'; rankEmoji='😐'; }
  else { rank='たいへんだったね😢'; rankEmoji='💪'; }

  document.getElementById('result-rank').textContent = rankEmoji + ' ' + rank;

  const mem = document.getElementById('result-memories');
  if(memories.length > 0){
    const label = currentLevel===4 ? '📔 人生の思い出：' : '📔 おもいで：';
    mem.innerHTML = `<strong style="color:#fff">${label}</strong><br>` +
      memories.map(m=>'✨ '+m).join('<br>');
  } else {
    mem.innerHTML = '<span style="color:rgba(255,255,255,0.7)">もっといっぱい思い出を作ろう！</span>';
  }

  const special = document.getElementById('result-life-special');
  if(currentLevel===4){
    special.textContent = 'すごい！100年の大冒険だったね！🎉';
  } else {
    special.textContent = '';
  }

  document.getElementById('replay-btn').textContent = `もう一回${['','一週間','一ヶ月','一年間','100年'][currentLevel]}やってみる！`;

  makeConfetti();
  document.getElementById('effect').style.display='flex';
  setTimeout(()=>{
    document.getElementById('effect').style.display='none';
    document.getElementById('effect').innerHTML='<div id="big-effect"></div>';
  }, 2500);
}

// ===== START =====
showLevelSelect();
</script>
