<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>👻 廃病院からの脱出</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;overflow:hidden;touch-action:none;user-select:none;font-family:serif;}
    canvas{display:block;}
    #home{position:fixed;top:8px;left:10px;color:#660000;text-decoration:none;font-size:.75rem;background:rgba(0,0,0,.8);padding:4px 10px;border-radius:4px;z-index:20;border:1px solid #660000;}
    #tc{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-between;padding:14px 20px 24px;z-index:10;pointer-events:none;}

    .cb{width:70px;height:70px;border-radius:50%;background:rgba(80,0,0,.4);border:2px solid rgba(200,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:1.6rem;pointer-events:auto;-webkit-tap-highlight-color:transparent;}

<body>
<canvas id="c"></canvas>
<a href="../../index.html" id="home">🏠 にげる</a>
<div id="tc">
  <div class="cside">
    <div class="cb" id="bl">←</div>
    <div class="cb" id="br">→</div>
  </div>
  <div class="cside">
    <div class="cb" id="batk">⚡<br><small style="font-size:.5rem">攻撃</small></div>
    <div class="cb" id="bu">↑</div>
    <div class="cb" id="bd">↓</div>
  </div>
</div>
<script>
'use strict';
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H;
function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
resize();
window.addEventListener('resize',resize);

// ======== 音声 ========
let ac;
function initAudio(){ if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)(); }

function playNoise(freq,dur,type='sawtooth',vol=0.3){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.3,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur);
}

// 超怖いスクリーム（音量UP、周波数UP）
function playScream(){
  if(!ac) return;
  for(let i=0;i<8;i++){
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(1200+i*300,ac.currentTime+i*0.03);
    o.frequency.exponentialRampToValueAtTime(100,ac.currentTime+1.2);
    g.gain.setValueAtTime(0.7,ac.currentTime+i*0.03);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+1.2);
    o.connect(g); g.connect(ac.destination);
    o.start(ac.currentTime+i*0.03); o.stop(ac.currentTime+1.3);
  }
  // 低音の衝撃
  const b=ac.createOscillator(), bg=ac.createGain();
  b.type='sine'; b.frequency.value=30;
  bg.gain.setValueAtTime(0.8,ac.currentTime);
  bg.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
  b.connect(bg); bg.connect(ac.destination);
  b.start(); b.stop(ac.currentTime+0.5);
}

// 子どもの笑い声みたいな怖い音
function playChildLaugh(){
  if(!ac) return;
  const notes=[523,494,440,392,350];
  notes.forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle';
    o.frequency.value=f;
    g.gain.setValueAtTime(0,ac.currentTime+i*0.12);
    g.gain.linearRampToValueAtTime(0.3,ac.currentTime+i*0.12+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.12+0.18);
    o.connect(g); g.connect(ac.destination);
    o.start(ac.currentTime+i*0.12); o.stop(ac.currentTime+i*0.12+0.2);
  });
}

// ドン！という突然の大音量
function playBang(){
  if(!ac) return;
  const buf=ac.createBuffer(1,ac.sampleRate*0.4,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.1));
  const s=ac.createBufferSource(), g=ac.createGain();
  g.gain.value=1.0;
  s.buffer=buf; s.connect(g); g.connect(ac.destination);
  s.start();
  // 低い衝撃音
  const o=ac.createOscillator(), g2=ac.createGain();
  o.type='sine'; o.frequency.value=40;
  g2.gain.setValueAtTime(0.9,ac.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
  o.connect(g2); g2.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+0.3);
}

// ヒソヒソ声みたいなノイズ
function playWhisper(){
  if(!ac) return;
  const buf=ac.createBuffer(1,ac.sampleRate*1.5,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const env=Math.sin(i/d.length*Math.PI);
    d[i]=(Math.random()*2-1)*0.08*env;
  }
  const s=ac.createBufferSource();
  // バンドパスフィルタで「声」っぽく
  const f=ac.createBiquadFilter();
  f.type='bandpass'; f.frequency.value=2000+Math.random()*500; f.Q.value=3;
  const g=ac.createGain(); g.gain.value=0.5;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start();
}

// ドアのきしみ音
function playCreak(){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(200,ac.currentTime);
  o.frequency.linearRampToValueAtTime(80,ac.currentTime+0.4);
  o.frequency.linearRampToValueAtTime(140,ac.currentTime+0.7);
  g.gain.setValueAtTime(0.2,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.8);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+0.8);
}

function playHeartbeat(fast){
  if(!ac) return;
  const vol=fast?0.8:0.5;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.value=60;
  g.gain.setValueAtTime(0,ac.currentTime);
  g.gain.linearRampToValueAtTime(vol,ac.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+0.3);
  const o2=ac.createOscillator(), g2=ac.createGain();
  o2.type='sine'; o2.frequency.value=50;
  g2.gain.setValueAtTime(0,ac.currentTime+0.18);
  g2.gain.linearRampToValueAtTime(vol*0.7,ac.currentTime+0.23);
  g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.45);
  o2.connect(g2); g2.connect(ac.destination);
  o2.start(ac.currentTime+0.18); o2.stop(ac.currentTime+0.5);
}

function playStatic(){
  if(!ac) return;
  const buf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.25;
  const s=ac.createBufferSource(), g=ac.createGain();
  g.gain.setValueAtTime(0.5,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
  s.buffer=buf; s.connect(g); g.connect(ac.destination);
  s.start();
}

function playDoor(){
  if(!ac) return;
  playNoise(80,0.6,'sine',0.4);
  setTimeout(()=>playNoise(60,0.4,'sine',0.3),200);
}

// ======== BGM（超怖い曲） ========
let bgmInterval=null, bgmStep=0, droneNodes=null;
function startBGM(){
  if(bgmInterval) return;
  if(!ac) return;
  // 3つのドローン音でうねる不協和音
  const drone1=ac.createOscillator();
  const drone2=ac.createOscillator();
  const drone3=ac.createOscillator();
  const droneGain=ac.createGain();
  drone1.type='sawtooth'; drone1.frequency.value=36;
  drone2.type='sawtooth'; drone2.frequency.value=37.8;  // うなり
  drone3.type='square';   drone3.frequency.value=54.7;  // 不協和な5度
  droneGain.gain.value=0.10;
  drone1.connect(droneGain); drone2.connect(droneGain); drone3.connect(droneGain);
  droneGain.connect(ac.destination);
  drone1.start(); drone2.start(); drone3.start();
  droneNodes=[drone1,drone2,drone3,droneGain];

  // 不気味なメロディーライン
  const NOTES=[98,103.8,110,116.5,87.3,92.5,82.4,77.8];
  bgmInterval=setInterval(()=>{
    if(!ac||state==='title') return;
    const note=NOTES[bgmStep%NOTES.length];
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=note;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(0.12,ac.currentTime+0.4);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+2.5);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+2.5);

    // 時々突然の高音スクリーチ
    if(bgmStep%5===0){
      const o2=ac.createOscillator(), g2=ac.createGain();
      o2.type='sawtooth';
      o2.frequency.setValueAtTime(800+Math.random()*400,ac.currentTime);
      o2.frequency.exponentialRampToValueAtTime(100,ac.currentTime+2);
      g2.gain.setValueAtTime(0.07+Math.random()*0.05,ac.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+2);
      o2.connect(g2); g2.connect(ac.destination);
      o2.start(); o2.stop(ac.currentTime+2);
    }
    // 突然のドーン！
    if(bgmStep%11===0) setTimeout(()=>playBang(),300+Math.random()*500);
    // ヒソヒソ
    if(bgmStep%13===0) setTimeout(()=>playWhisper(),Math.random()*800);
    // ドアのきしみ
    if(bgmStep%17===0) setTimeout(()=>playCreak(),Math.random()*1000);
    bgmStep++;
  },900);
}
function stopBGM(){
  if(bgmInterval){ clearInterval(bgmInterval); bgmInterval=null; }
  if(droneNodes){
    droneNodes.slice(0,3).forEach(n=>{ try{n.stop();}catch(e){} });
    droneNodes=null;
  }
}
function playHit(){
  if(!ac) return;
  playNoise(300,0.15,'square',0.5);
  setTimeout(()=>playNoise(150,0.2,'sawtooth',0.4),80);
}
function playMonsterDie(){
  if(!ac) return;
  for(let i=0;i<5;i++){
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(500-i*80,ac.currentTime+i*0.1);
    o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+i*0.1+0.5);
    g.gain.setValueAtTime(0.45,ac.currentTime+i*0.1);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.1+0.5);
    o.connect(g); g.connect(ac.destination);
    o.start(ac.currentTime+i*0.1); o.stop(ac.currentTime+i*0.1+0.6);
  }
}

// ======== マップ設計 ========
const TILE=48;
const RAW=[
  '####################',
  '#S.......#....3....#',
  '#.#####..#.########',
  '#.#...#..#.......3#',
  '#.#.3.#..#########.',
  '#.#...#..........3#',
  '#.################.',
  '#................E#',
  '#.################.',
  '#.#..............#.',
  '#.#.##########.#.#.',
  '#...#........#...#.',
  '##.##.######.##.##.',
  '#....#......#....#.',
  '#.####.####.####.#.',
  '#.#..#.#..#.#..#.#.',
  '#....#.#..#.#....#.',
  '######.####.######.',
  '#..................#',
  '####################',
];
const ROWS=RAW.length, COLS=RAW[0].length;
const MAP_W=COLS*TILE, MAP_H=ROWS*TILE;

const T_WALL=1, T_FLOOR=0, T_KEY=3, T_EXIT=9;
let tileMap=[], startX=0, startY=0, exitX=0, exitY=0;
const keyPositions=[];

function buildMap(){
  tileMap=[];
  keyPositions.length=0;
  for(let r=0;r<ROWS;r++){
    tileMap[r]=[];
    for(let c=0;c<COLS;c++){
      const ch=RAW[r][c];
      if(ch==='#') tileMap[r][c]=T_WALL;
      else if(ch==='S'){ tileMap[r][c]=T_FLOOR; startX=c*TILE+TILE/2; startY=r*TILE+TILE/2; }
      else if(ch==='3'){ tileMap[r][c]=T_KEY; keyPositions.push({r,c,got:false}); }
      else if(ch==='E'){ tileMap[r][c]=T_EXIT; exitX=c*TILE+TILE/2; exitY=r*TILE+TILE/2; }
      else tileMap[r][c]=T_FLOOR;
    }
  }
}

function isWall(px,py){
  const c=~~(px/TILE), r=~~(py/TILE);
  if(r<0||r>=ROWS||c<0||c>=COLS) return true;
  return tileMap[r][c]===T_WALL;
}

// ======== モンスター（3体！） ========
const MONSTER_DEFS=[
  {name:'MARY',   color:'#cc0000', eyeColor:'#ff3300', speed:2.0, size:22, hp:3, maxHp:3, hitFlash:0, dying:false, dyingTimer:0, respawnTimer:0},
  {name:'SHADOW', color:'#220044', eyeColor:'#bb00ff', speed:2.5, size:20, hp:3, maxHp:3, hitFlash:0, dying:false, dyingTimer:0, respawnTimer:0},
  {name:'CHILD',  color:'#334400', eyeColor:'#aaff00', speed:3.2, size:14, hp:2, maxHp:2, hitFlash:0, dying:false, dyingTimer:0, respawnTimer:0}, // 子どもの幽霊：小さいが超速い
];

// ======== ゲーム状態 ========
let state='title';
let player, monsters, keys_collected, totalKeys;
let camX=0,camY=0;
let frameCount=0;
let heartbeatTimer=0;
let flickerTimer=0, flickerOn=true;
let jumpScare=0, jumpscareFace=0;
let jsTimer=0;
let staticEffect=0;
let bloodAlpha=0;
let gameKeys={};
let tL=false,tR=false,tU=false,tD=false;
let deathTimer=0;
let winTimer=0;
let attackTimer=0;
let attackFlash=0;
let tAtk=false;
let killCount=0;
let shakeX=0, shakeY=0;   // 画面シェイク
let glitchTimer=0;         // グリッチ効果
let creepyMsgTimer=0;      // 不気味なメッセージ
let creepyMsg='';
let bloodDrips=[];         // 血が垂れる
let ghostApparition=0;     // ゴーストの幻

const CREEPY_MSGS=[
  'みてる…','きこえてる','もうすぐいく','にげられない',
  '…うしろ','たすけて','こわい…','あなたを…みつけた',
  '…ここにいる','かえれない','ずっとここにいる',
];

function initGame(){
  buildMap();
  player={x:startX,y:startY,vx:0,vy:0,r:14,dir:1,stepTimer:0};
  // モンスターの初期位置をバラバラに
  monsters=MONSTER_DEFS.map((m,i)=>({
    ...m,
    x:exitX+[2,-2,0][i]*TILE*2+i*TILE,
    y:exitY+[1,-1,2][i]*TILE,
    pathTimer:0,
  }));
  keys_collected=0;
  totalKeys=keyPositions.length;
  keyPositions.forEach(k=>k.got=false);
  monsters.forEach(m=>{ m.hp=m.maxHp; m.hitFlash=0; m.dying=false; m.dyingTimer=0; m.respawnTimer=0; });
  frameCount=0; heartbeatTimer=0;
  flickerTimer=0; flickerOn=true;
  jumpScare=0; jsTimer=0;
  jsTimer=0;
  staticEffect=0; bloodAlpha=0;
  deathTimer=0; winTimer=0;
  attackTimer=0; attackFlash=0; killCount=0;
  shakeX=0; shakeY=0; glitchTimer=0;
  creepyMsgTimer=0; creepyMsg='';
  ghostApparition=0;
  // 血のしたたり初期化
  bloodDrips=[];
  for(let i=0;i<20;i++) bloodDrips.push({
    x:Math.random()*MAP_W, y:Math.random()*MAP_H,
    len:10+Math.random()*40, speed:0.2+Math.random()*0.5,
    alpha:0.4+Math.random()*0.4, cur:0
  });
  camX=player.x-W/2; camY=player.y-H/2;
  stopBGM(); setTimeout(startBGM,500);
}

// ======== プレイヤー更新 ========
const PSPD=2.8;
function updatePlayer(){
  const L=gameKeys['arrowleft']||gameKeys['a']||tL;
  const R=gameKeys['arrowright']||gameKeys['d']||tR;
  const U=gameKeys['arrowup']||gameKeys['w']||tU;
  const D=gameKeys['arrowdown']||gameKeys['s']||tD;
  let dx=0,dy=0;
  if(L) dx=-PSPD; if(R) dx=PSPD;
  if(U) dy=-PSPD; if(D) dy=PSPD;
  if(dx&&dy){dx*=0.707;dy*=0.707;}

  const nx=player.x+dx;
  if(!isWall(nx-player.r,player.y)&&!isWall(nx+player.r,player.y)&&
     !isWall(nx-player.r,player.y-player.r)&&!isWall(nx+player.r,player.y+player.r)) player.x=nx;
  const ny=player.y+dy;
  if(!isWall(player.x-player.r,ny)&&!isWall(player.x+player.r,ny)&&
     !isWall(player.x-player.r,ny-player.r)&&!isWall(player.x+player.r,ny+player.r)) player.y=ny;

  if(dx>0) player.dir=1;
  if(dx<0) player.dir=-1;
  if(dx||dy) player.stepTimer++;
  if(attackTimer>0) attackTimer--;
  if(tAtk && attackTimer<=0) doAttack();

  for(const k of keyPositions){
    if(k.got) continue;
    const kx=k.c*TILE+TILE/2, ky=k.r*TILE+TILE/2;
    if(Math.hypot(player.x-kx,player.y-ky)<TILE*0.7){
      k.got=true; keys_collected++;
      playDoor();
      bloodAlpha=0.4;
      // 鍵を取ったら突然のドーン！
      setTimeout(()=>playBang(),200);
    }
  }

  if(keys_collected>=totalKeys){
    if(Math.hypot(player.x-exitX,player.y-exitY)<TILE*0.9){
      state='win'; winTimer=0; stopBGM();
    }
  }

  camX+=(player.x-W/2-camX)*0.12;
  camY+=(player.y-H/2-camY)*0.12;
  camX=Math.max(0,Math.min(MAP_W-W,camX));
  camY=Math.max(0,Math.min(MAP_H-H,camY));
}

// ======== モンスター更新 ========
function updateMonsters(){
  for(const m of monsters){
    if(m.respawnTimer>0){ m.respawnTimer--; continue; }
    if(m.dying){
      m.dyingTimer--;
      if(m.dyingTimer<=0){
        m.dying=false; m.hp=m.maxHp; m.hitFlash=0;
        m.respawnTimer=480; // 少し早く復活
        m.x=exitX; m.y=exitY;
      }
      continue;
    }
    if(m.hitFlash>0) m.hitFlash--;
    const dx=player.x-m.x, dy=player.y-m.y;
    const dist=Math.hypot(dx,dy)||1;
    // 時間とともに少しずつ加速
    const spd=m.speed*(1+frameCount/2500);
    const mx=dx/dist*spd, my=dy/dist*spd;
    if(!isWall(m.x+mx,m.y)) m.x+=mx; else m.x+=mx*0.4;
    if(!isWall(m.x,m.y+my)) m.y+=my; else m.y+=my*0.4;

    if(!m.dying&&m.respawnTimer<=0&&dist<m.size+player.r){
      state='death'; deathTimer=0;
      stopBGM(); playScream();
      jumpscareFace=~~(Math.random()*5); // 5種類に増えた！
      jumpScare=150; // 長く表示
    }
  }
}

// ======== ジャンプスケア（超頻繁に！） ========
let nextRandomScare=150+~~(Math.random()*200);
function updateJumpScare(){
  jsTimer++;
  if(jsTimer>=nextRandomScare){
    jsTimer=0;
    nextRandomScare=150+~~(Math.random()*250); // 150-400フレームごと（超頻繁！）
    jumpScare=45;
    jumpscareFace=~~(Math.random()*5);
    playStatic();
    setTimeout(()=>playScream(),80);
    shakeX=(Math.random()-0.5)*30; shakeY=(Math.random()-0.5)*30;
  }
  if(jumpScare>0) jumpScare--;
}

// ======== フリッカー（もっと激しく） ========
function updateFlicker(){
  flickerTimer++;
  if(flickerTimer%70===0){ // 70フレームごと（より頻繁）
    flickerOn=false;
    setTimeout(()=>{ flickerOn=true; },60+~~(Math.random()*300));
    // 二重フリッカー
    if(Math.random()<0.5) setTimeout(()=>{
      flickerOn=false;
      setTimeout(()=>flickerOn=true,50+~~(Math.random()*150));
    },200);
    // 三重フリッカー
    if(Math.random()<0.25) setTimeout(()=>{
      flickerOn=false;
      setTimeout(()=>flickerOn=true,40);
    },500);
  }
}

// ======== ハートビート ========
function updateHeartbeat(){
  const minDist=monsters.reduce((min,m)=>m.respawnTimer>0?min:Math.min(min,Math.hypot(player.x-m.x,player.y-m.y)),9999);
  const rate=Math.max(15,Math.min(80,~~(minDist/4)));
  heartbeatTimer++;
  if(heartbeatTimer>=rate){
    heartbeatTimer=0;
    playHeartbeat(minDist<TILE*4);
  }
  return minDist;
}

// ======== 画面シェイク更新 ========
function updateShake(){
  shakeX*=0.85; shakeY*=0.85;
  const minDist=monsters.reduce((min,m)=>m.respawnTimer>0?min:Math.min(min,Math.hypot(player.x-m.x,player.y-m.y)),9999);
  if(minDist<TILE*3){
    const s=(TILE*3-minDist)/(TILE*3)*4;
    shakeX+=(Math.random()-0.5)*s;
    shakeY+=(Math.random()-0.5)*s;
  }
}

// ======== 不気味なメッセージ ========
function updateCreepyMsg(){
  creepyMsgTimer++;
  if(creepyMsgTimer>200+~~(Math.random()*300)){
    creepyMsgTimer=0;
    creepyMsg=CREEPY_MSGS[~~(Math.random()*CREEPY_MSGS.length)];
    setTimeout(()=>creepyMsg='',1500+Math.random()*1000);
    if(Math.random()<0.3) playWhisper();
    if(Math.random()<0.2) playChildLaugh();
  }
}

// ======== ゴーストの幻 ========
function updateGhostApparition(){
  if(ghostApparition>0){ ghostApparition--; return; }
  if(Math.random()<0.003){
    ghostApparition=60+~~(Math.random()*60);
  }
}

function doAttack(){
  if(attackTimer>0) return;
  attackTimer=30; attackFlash=15;
  playHit();
  for(const m of monsters){
    if(m.dying||m.respawnTimer>0) continue;
    const dist=Math.hypot(player.x-m.x,player.y-m.y);
    if(dist<TILE*1.8){
      m.hp--;
      m.hitFlash=20;
      if(m.hp<=0){
        m.dying=true; m.dyingTimer=60;
        killCount++;
        playMonsterDie();
        bloodAlpha=0.6;
      } else {
        playHit();
        shakeX=(Math.random()-0.5)*15; shakeY=(Math.random()-0.5)*15;
      }
    }
  }
}

    cx.beginPath(); cx.ellipse(-scale*0.22,0,scale*0.22*pulse,scale*0.14*pulse,0,0,Math.PI*2); cx.fill();
    const gR=cx.createRadialGradient(scale*0.22,0,0,scale*0.22,0,scale*0.22*pulse);

    cx.beginPath(); cx.ellipse(scale*0.22,0,scale*0.22*pulse,scale*0.14*pulse,0,0,Math.PI*2); cx.fill();

    cx.beginPath(); cx.ellipse(0,-scale*0.05,scale*0.25,scale*0.3,0,0,Math.PI*2); cx.fill();

    cx.fillStyle='#000';

    cx.beginPath(); cx.ellipse(scale*0.1,-scale*0.12,scale*0.03,scale*0.04,0,0,Math.PI*2); cx.fill();

    cx.beginPath(); cx.ellipse(0,0,scale*0.6*p2,scale*0.35*p2,0,0,Math.PI*2); cx.fill();

    cx.beginPath(); cx.ellipse(0,0,scale*0.1*p2,scale*0.15*p2,0,0,Math.PI*2); cx.fill();
    // 血管
    cx.strokeStyle='rgba(200,0,0,0.5)'; cx.lineWidth=2;
    for(let i=0;i<8;i++){

      cx.beginPath();

function drawMap(){
  const c0=Math.max(0,~~(camX/TILE)-1), c1=Math.min(COLS,~~((camX+W)/TILE)+2);
  const r0=Math.max(0,~~(camY/TILE)-1), r1=Math.min(ROWS,~~((camY+H)/TILE)+2);
  for(let r=r0;r<r1;r++){
    for(let c=c0;c<c1;c++){
      const sx=c*TILE-camX, sy=r*TILE-camY;
      const t=tileMap[r][c];
      if(t===T_WALL){
        cx.fillStyle='#150808';
        cx.fillRect(sx,sy,TILE,TILE);
        cx.fillStyle='#200d0d';
        cx.fillRect(sx+1,sy+1,TILE-2,TILE-2);
        cx.strokeStyle='#0d0404'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(sx+8,sy+4); cx.lineTo(sx+18,sy+24); cx.lineTo(sx+12,sy+40); cx.stroke();
        // 壁に滲む血
        if((r*11+c*7)%13===0){
          cx.fillStyle='rgba(60,0,0,0.5)';
          cx.fillRect(sx,sy+TILE*0.6,TILE,TILE*0.4);
        }
      } else {
        cx.fillStyle='#080506';
        cx.fillRect(sx,sy,TILE,TILE);
        if((r+c)%4===0){
          cx.fillStyle='#0d0809';
          cx.fillRect(sx+1,sy+1,TILE-2,TILE-2);
        }
        // 血のシミ（多め）
        if((r*7+c*13)%11===0){
          cx.fillStyle='rgba(80,0,0,0.5)';
          cx.beginPath(); cx.ellipse(sx+TILE/2,sy+TILE/2,(r*3+c*5)%14+8,(r*5+c*7)%12+6,0,0,Math.PI*2); cx.fill();
        }
      }
      if(t===T_KEY){
        const k=keyPositions.find(k=>k.r===r&&k.c===c);
        if(k&&!k.got){
          const bob=Math.sin(Date.now()*0.003+r)*4;
          cx.font=`${TILE*0.7}px sans-serif`; cx.textAlign='center';
          cx.fillText('🗝️',sx+TILE/2,sy+TILE/2+10+bob);
          const gl=cx.createRadialGradient(sx+TILE/2,sy+TILE/2,0,sx+TILE/2,sy+TILE/2,TILE*0.8);
          gl.addColorStop(0,'rgba(255,200,0,0.15)'); gl.addColorStop(1,'transparent');
          cx.fillStyle=gl;
          cx.fillRect(sx,sy-TILE/2,TILE*2,TILE*2);
        }
      }
      if(t===T_EXIT){
        const open=keys_collected>=totalKeys;
        cx.fillStyle=open?'#003300':'#330000';
        cx.fillRect(sx+4,sy+4,TILE-8,TILE-8);
        cx.font=`${TILE*0.65}px sans-serif`; cx.textAlign='center';
        cx.fillText(open?'🚪':'🔒',sx+TILE/2,sy+TILE*0.75);
        if(open){
          const gl=cx.createRadialGradient(sx+TILE/2,sy+TILE/2,0,sx+TILE/2,sy+TILE/2,TILE);
          gl.addColorStop(0,'rgba(0,255,100,0.2)'); gl.addColorStop(1,'transparent');
          cx.fillStyle=gl;
          cx.fillRect(sx-TILE,sy-TILE,TILE*3,TILE*3);
        }
      }
    }
  }
  // 血のしたたり
  for(const d of bloodDrips){
    const sx=d.x-camX, sy=d.y-camY;
    if(sx<-10||sx>W+10||sy<-10||sy>H+80) continue;
    d.cur=Math.min(d.cur+d.speed,d.len);
    cx.fillStyle=`rgba(120,0,0,${d.alpha})`;
    cx.fillRect(sx-2,sy,3,d.cur);
    // 滴
    if(d.cur>=d.len){
      cx.beginPath(); cx.arc(sx,sy+d.len+3,3,0,Math.PI*2);
      cx.fillStyle=`rgba(120,0,0,${d.alpha*0.7})`; cx.fill();
    }
  }
}

function drawPlayer(){
  const sx=player.x-camX+shakeX, sy=player.y-camY+shakeY;
  // ライトなし！懐中電灯の描画を削除
  cx.save();
  cx.translate(sx,sy);
  if(player.dir<0) cx.scale(-1,1);
  // ほぼ見えない暗いシルエット
  cx.globalAlpha=0.18;
  cx.fillStyle='#221100';
  cx.fillRect(-10,-26,20,26);
  cx.beginPath(); cx.arc(0,-30,13,0,Math.PI*2); cx.fill();
  cx.globalAlpha=1;
  cx.restore();
  if(attackFlash>0){
    attackFlash--;
    cx.save();
    cx.translate(sx,sy);
    cx.globalAlpha=attackFlash/15;
    cx.strokeStyle='#ffffff'; cx.lineWidth=4;
    cx.beginPath();
    cx.arc(player.dir*30,0,TILE*1.5,-Math.PI*0.5,Math.PI*0.5);
    cx.stroke();
    cx.globalAlpha=1;
    cx.restore();
  }
}

function drawMonster(m){
  if(m.respawnTimer>0) return;
  const sx=m.x-camX+shakeX, sy=m.y-camY+shakeY;
  if(sx<-100||sx>W+100||sy<-100||sy>H+100) return;
  const t=Date.now()*0.004;
  cx.save();
  cx.translate(sx,sy);
  cx.globalAlpha=m.dying?m.dyingTimer/60:(m.hitFlash>0?0.5+Math.sin(m.hitFlash)*0.5:0.9);
  const grad=cx.createRadialGradient(0,0,0,0,0,m.size*2.8);
  grad.addColorStop(0,m.color);
  grad.addColorStop(0.5,m.color+'88');
  grad.addColorStop(1,'transparent');
  cx.fillStyle=grad;
  cx.beginPath(); cx.arc(0,Math.sin(t)*4,m.size*2.8,0,Math.PI*2); cx.fill();
  cx.globalAlpha=0.95+Math.sin(t*3)*0.05;
  cx.fillStyle=m.eyeColor;
  cx.beginPath(); cx.ellipse(-8,Math.sin(t)*3-4,7,9,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(8,Math.sin(t)*3-4,7,9,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(-8,Math.sin(t)*3-4,3,4,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(8,Math.sin(t)*3-4,3,4,0,0,Math.PI*2); cx.fill();
  // モンスター名（暗くて見えにくい）
  cx.globalAlpha=0.25;
  cx.fillStyle='#ff0000'; cx.font='9px serif'; cx.textAlign='center';
  cx.fillText(m.name,-0,-m.size*3);
  if(m.hitFlash>0){
    cx.globalAlpha=m.hitFlash/20*0.7;
    cx.fillStyle='#fff';
    cx.beginPath(); cx.arc(0,0,m.size*2,0,Math.PI*2); cx.fill();
  }
  if(m.dying){
    cx.globalAlpha=m.dyingTimer/60;
    cx.fillStyle='#ff0000'; cx.font=`${30+~~(m.dyingTimer*0.5)}px sans-serif`; cx.textAlign='center';
    cx.fillText('💥',0,-35);
  }
  cx.restore();
}

// ゴーストの幻（画面の端に）
function drawGhostApparition(){
  if(ghostApparition<=0) return;
  const alpha=Math.min(1,ghostApparition/30)*0.4;
  cx.save();
  cx.globalAlpha=alpha;
  const gx=W*0.8, gy=H*0.3;
  cx.fillStyle='rgba(150,200,255,0.5)';
  cx.beginPath(); cx.ellipse(gx,gy,20,26,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(gx-8,gy-5,5,7,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(gx+8,gy-5,5,7,0,0,Math.PI*2); cx.fill();
  cx.restore();
}

function drawDarkness(){
  // ライトなし！画面全体を真っ暗に
  cx.fillStyle='rgba(0,0,0,0.97)';
  cx.fillRect(0,0,W,H);
  // モンスターの目だけがうっすら赤く光って見える（超怖い）
  for(const m of monsters){
    if(m.respawnTimer>0||m.dying) continue;
    const mx=m.x-camX+shakeX, my=m.y-camY+shakeY;
    const dist=Math.hypot(player.x-m.x,player.y-m.y);
    if(dist>TILE*8) continue; // 近くのモンスターの目だけ光る
    const eyeAlpha=Math.min(0.9,(TILE*8-dist)/(TILE*8))*0.85;
    const eyeGlow=cx.createRadialGradient(mx,my,0,mx,my,30);
    eyeGlow.addColorStop(0,`rgba(255,0,0,${eyeAlpha})`);
    eyeGlow.addColorStop(1,'transparent');
    cx.fillStyle=eyeGlow;
    cx.fillRect(mx-35,my-35,70,70);
  }
}

function drawHUD(){
  cx.fillStyle='rgba(0,0,0,0.75)';
  cx.fillRect(0,0,W,50);
  cx.font='20px sans-serif'; cx.textAlign='left';
  cx.fillText('🗝️ '+keys_collected+' / '+totalKeys, 10, 34);
  cx.fillStyle='rgba(255,190,190,0.9)';
  cx.font='16px sans-serif'; cx.textAlign='right';
  cx.fillText('💀 '+killCount+'体やっつけた', W-10, 34);
  cx.fillStyle='rgba(255,255,80,0.75)';
  cx.font='13px sans-serif'; cx.textAlign='center';
  cx.fillText('Z/スペース：攻撃', W/2, H-10);

  const minDist=monsters.reduce((mn,m)=>m.respawnTimer>0?mn:Math.min(mn,Math.hypot(player.x-m.x,player.y-m.y)),9999);
  if(minDist<TILE*5){
    const danger=Math.min(1,(TILE*5-minDist)/(TILE*4));
    cx.fillStyle=`rgba(180,0,0,${danger*0.5})`;
    cx.fillRect(0,0,W,H);
    cx.fillStyle=`rgba(255,0,0,${danger})`;
    cx.font=`bold ${28+~~(danger*22)}px serif`;
    cx.textAlign='center';
    cx.shadowColor='#ff0000'; cx.shadowBlur=20;
    cx.fillText('⚠ にげろ！！', W/2, 85);
    cx.shadowBlur=0;
  }

  // 不気味なメッセージ
  if(creepyMsg){
    const alpha=0.5+Math.sin(Date.now()*0.003)*0.3;
    cx.fillStyle=`rgba(180,0,0,${alpha})`;
    cx.font=`bold ${Math.min(36,W/14)}px serif`;
    cx.textAlign='center';
    cx.shadowColor='#ff0000'; cx.shadowBlur=25;
    cx.fillText(creepyMsg, W/2+Math.sin(Date.now()*0.01)*5, H/2);
    cx.shadowBlur=0;
  }

  if(bloodAlpha>0){
    cx.fillStyle=`rgba(150,0,0,${bloodAlpha})`;
    cx.fillRect(0,0,W,H);
    bloodAlpha-=0.012;
  }
}

// グリッチエフェクト
function drawGlitch(){
  if(Math.random()>0.04) return;
  const lines=3+~~(Math.random()*6);
  for(let i=0;i<lines;i++){
    const y=~~(Math.random()*H);
    const h=1+~~(Math.random()*4);
    const shift=(Math.random()-0.5)*20;
    const imgData=cx.getImageData(0,y,W,h);
    cx.putImageData(imgData,shift,y);
    // 色ずれ
    cx.fillStyle=`rgba(${~~(Math.random()*200)},0,0,0.15)`;
    cx.fillRect(0,y,W,h);
  }
}

function drawTitle(){
  cx.fillStyle='#000'; cx.fillRect(0,0,W,H);
  if(Math.random()<0.08){
    cx.fillStyle='rgba(120,0,0,0.35)';
    cx.fillRect(0,0,W,H);
  }
  const t=Date.now();
  cx.save();
  cx.translate(W/2,H/2);
  const shake=Math.sin(t*0.0025)*3;
  cx.rotate(shake*0.01);
  cx.fillStyle='#770000';
  cx.font=`bold ${Math.min(50,W/8)}px serif`;
  cx.textAlign='center';
  cx.shadowColor='#ff0000'; cx.shadowBlur=40;
  cx.fillText('廃病院からの脱出',shake,H*-0.3);
  cx.shadowBlur=0;
  cx.fillStyle='#990000';
  cx.font=`bold ${Math.min(26,W/16)}px serif`;
  cx.fillText('── 呪われた廃病院 ──',0,H*-0.19);
  cx.shadowBlur=0;

  cx.fillStyle='#777'; cx.font='15px sans-serif';
  cx.fillText('🗝️ カギを全部集めて出口へ逃げろ',0,H*-0.04);
  cx.fillText('👻 3体のモンスターが追いかけてくる！',0,H*0.05);
  cx.fillStyle='#444'; cx.font='14px sans-serif';
  cx.fillText('↑↓←→ / WASD で移動',0,H*0.15);
  cx.fillStyle='#555'; cx.font='13px sans-serif';
  cx.fillText('Z/スペース：攻撃してやっつけろ！',0,H*0.23);

  const blink=Math.floor(t/650)%2;
  if(blink){
    cx.fillStyle='#dd0000'; cx.shadowColor='#ff0000'; cx.shadowBlur=20;
    cx.font='bold 22px serif';
    cx.fillText('▶ スペースキーでスタート',0,H*0.28);
    cx.shadowBlur=0;
  }

  // タイトルの赤い目
  const ep=Math.sin(t*0.002)*0.1+1;
  cx.fillStyle='#cc0000';
  cx.beginPath(); cx.ellipse(-W*0.38,H*0.38,18*ep,25*ep,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(W*0.38,H*0.38,18*ep,25*ep,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(-W*0.38,H*0.38,7,10,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(W*0.38,H*0.38,7,10,0,0,Math.PI*2); cx.fill();
  cx.restore();

  // タイトルでもグリッチ
  if(Math.random()<0.03) drawGlitch();
}

function drawDeath(){
  deathTimer++;
  if(jumpScare>0){
    drawScaryFace(jumpscareFace);
    for(let i=0;i<12;i++){
      cx.fillStyle=`rgba(255,0,0,${Math.random()*0.35})`;
      cx.fillRect(0,~~(Math.random()*H),W,2+~~(Math.random()*5));
    }
    jumpScare--;
  } else {
    cx.fillStyle='#000'; cx.fillRect(0,0,W,H);
    // 血の滴り
    for(let i=0;i<5;i++){
      cx.fillStyle=`rgba(150,0,0,${0.4+Math.random()*0.3})`;
      cx.fillRect(W*0.1+i*W*0.18,0,8,H*0.3+Math.random()*H*0.4);
    }
    cx.fillStyle='#990000';
    cx.font=`bold ${Math.min(62,W/8)}px serif`;
    cx.textAlign='center';
    cx.shadowColor='#ff0000'; cx.shadowBlur=50;
    cx.fillText('つかまった…', W/2, H/2-40);
    cx.shadowBlur=0;
    cx.fillStyle='#444';
    cx.font='20px sans-serif';
    cx.fillText('スペースでもういっかい', W/2, H/2+50);
  }
}

function drawWin(){
  winTimer++;
  cx.fillStyle=`rgba(0,40,0,${Math.min(1,winTimer/60)})`;
  cx.fillRect(0,0,W,H);
  if(winTimer>60){
    cx.fillStyle='#00ff66';
    cx.font=`bold ${Math.min(52,W/8)}px serif`;
    cx.textAlign='center';
    cx.shadowColor='#00ff00'; cx.shadowBlur=30;
    cx.fillText('脱出成功！！', W/2, H/2-40);
    cx.shadowBlur=0;
    cx.fillStyle='#aaa'; cx.font='20px sans-serif';
    cx.fillText('よく生き残った…', W/2, H/2+20);
    cx.fillText('スペースでタイトルへ', W/2, H/2+60);
  }
}

// ======== メインループ ========
function loop(){
  requestAnimationFrame(loop);
  frameCount++;

  if(state==='title'){ drawTitle(); return; }

  if(state==='play'){
    updatePlayer();
    updateMonsters();
    updateJumpScare();
    updateFlicker();
    updateHeartbeat();
    updateShake();
    updateCreepyMsg();
    updateGhostApparition();
    if(bloodAlpha>0) bloodAlpha-=0.008;
  }

  cx.save();
  cx.translate(~~shakeX, ~~shakeY); // 画面シェイク

  drawMap();
  for(const m of monsters) drawMonster(m);
  drawPlayer();
  drawGhostApparition();
  drawDarkness();
  drawHUD();
  drawGlitch();

  // スタティックノイズ（多め）
  if(Math.random()<0.04||!flickerOn){
    for(let i=0;i<10;i++){
      cx.fillStyle=`rgba(255,255,255,${Math.random()*0.07})`;
      cx.fillRect(0,~~(Math.random()*H),W,1+~~(Math.random()*3));
    }
  }
  // 暗闇フリッカー時のフラッシュ
  if(!flickerOn){
    cx.fillStyle='rgba(0,0,0,0.6)';
    cx.fillRect(0,0,W,H);
  }

  cx.restore();

  // ジャンプスケア（全画面で上書き）
  if(jumpScare>0 && state==='play'){
    const alpha=jumpScare>25?1:jumpScare/25;
    cx.globalAlpha=alpha;
    drawScaryFace(jumpscareFace);
    cx.globalAlpha=1;
  }

  if(state==='death') drawDeath();
  if(state==='win'){ drawMap(); drawDarkness(); drawWin(); }
}

// ======== 入力 ========
document.addEventListener('keydown',e=>{
  gameKeys[e.key.toLowerCase()]=true;
  if(e.key===' ') e.preventDefault();
  if(state==='title'&&(e.key===' '||e.key==='Enter')){ initAudio(); initGame(); state='play'; }
  if(state==='death'&&jumpScare<=0&&deathTimer>30&&(e.key===' '||e.key==='Enter')){ initGame(); state='play'; }
  if(state==='win'&&winTimer>120&&(e.key===' '||e.key==='Enter')) state='title';
  if(state==='play'&&(e.key==='z'||e.key==='Z')) doAttack();
});
document.addEventListener('keyup',e=>gameKeys[e.key.toLowerCase()]=false);

window.addEventListener('touchstart',e=>{
  initAudio();
  document.getElementById('tc').classList.add('show');
  if(state==='title'){ initGame(); state='play'; }
  if(state==='death'&&jumpScare<=0&&deathTimer>30){ initGame(); state='play'; }
  if(state==='win'&&winTimer>120) state='title';
},{once:false});

document.getElementById('bl').addEventListener('touchstart',e=>{e.preventDefault();tL=true;},{passive:false});
document.getElementById('bl').addEventListener('touchend',()=>tL=false);
document.getElementById('bl').addEventListener('touchcancel',()=>tL=false);
document.getElementById('br').addEventListener('touchstart',e=>{e.preventDefault();tR=true;},{passive:false});
document.getElementById('br').addEventListener('touchend',()=>tR=false);
document.getElementById('br').addEventListener('touchcancel',()=>tR=false);
document.getElementById('bu').addEventListener('touchstart',e=>{e.preventDefault();tU=true;},{passive:false});
document.getElementById('bu').addEventListener('touchend',()=>tU=false);
document.getElementById('bu').addEventListener('touchcancel',()=>tU=false);
document.getElementById('bd').addEventListener('touchstart',e=>{e.preventDefault();tD=true;},{passive:false});
document.getElementById('bd').addEventListener('touchend',()=>tD=false);
document.getElementById('bd').addEventListener('touchcancel',()=>tD=false);
document.getElementById('batk').addEventListener('touchstart',e=>{e.preventDefault();tAtk=true;doAttack();},{passive:false});
document.getElementById('batk').addEventListener('touchend',()=>tAtk=false);

// ======== 起動 ========
buildMap();
window.onload=()=>requestAnimationFrame(loop);
if(document.readyState==='complete') requestAnimationFrame(loop);
</script>
</body>
</html>
