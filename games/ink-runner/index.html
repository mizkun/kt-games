<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>インクランナー</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#111;overflow:hidden;touch-action:none;user-select:none;}
    canvas{display:block;}
    #home{position:fixed;top:8px;left:10px;color:#aaa;text-decoration:none;font-size:.75rem;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;z-index:20;}
    #tc{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:14px 20px 20px;z-index:10;pointer-events:none;}
    #tc.show{display:flex;}
    .cb{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:1.4rem;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
    .cside{display:flex;gap:12px;align-items:flex-end;}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<a href="../../index.html" id="home">🏠 ゲームいちらんにもどる</a>
<div id="tc">
  <div class="cside">
    <div class="cb" id="bl">◀</div>
    <div class="cb" id="br">▶</div>
  </div>
  <div class="cside">
    <div class="cb" id="bsh">🎨</div>
    <div class="cb" id="bjp">🅰<br><small>ジャンプ</small></div>
  </div>
</div>
<script>
// =============================================
//  インクランナー - スプラ風マリオゲーム
// =============================================
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ---- 定数 ----
const GY = 0.55;
const JV = -14;
const SPD = 5;
const INK_SPD_BOOST = 2.5;  // 自分のインクの上は速い
const ENEMY_INK_SLOW = 0.4; // 敵のインクの上は遅い
const T = 48;               // タイルサイズ
const LW = 60000;           // レベル幅（6万px！超超広い！）
const LH = 720;
const PW = 30, PH = 40;
const GOAL_X = LW - 400;

// インクの色
const MY_INK   = '#22ddff';  // プレイヤーのインク（水色）
const BAD_INK  = '#ff4499';  // 敵のインク（ピンク）
const SHOOT_CD = 12;         // 弾のクールダウン

// ---- レベル生成 ----
// 地面 + 空中ブロック をランダム＆手動でたっぷり作る
const PLATS = [];
// 地面ベース
for(let x = 0; x < LW; x += T) {
  PLATS.push({x, y: LH - T, w: T, h: T, type:'ground'});
}
// 穴（一部の地面を消す）
const HOLES = [
  {sx:1200, ex:1400}, {sx:2400, ex:2650}, {sx:3800, ex:4000},
  {sx:5500, ex:5800}, {sx:7000, ex:7300}, {sx:9000, ex:9400},
  {sx:11000, ex:11400}, {sx:13500, ex:13900}, {sx:16000, ex:16500},
  {sx:19000, ex:19500}, {sx:22000, ex:22600}, {sx:25000, ex:25600},
  {sx:28000, ex:28600}, {sx:31000, ex:31700}, {sx:34000, ex:34800},
  {sx:37000, ex:37900}, {sx:40000, ex:40900}, {sx:43000, ex:43900},
  {sx:46000, ex:47000}, {sx:49000, ex:50000}, {sx:52000, ex:53000},
  {sx:55000, ex:56000}, {sx:57500, ex:58500},
];

// 穴の場所の地面を削除
for(let i = PLATS.length - 1; i >= 0; i--){
  const p = PLATS[i];
  if(p.type !== 'ground') continue;
  for(const h of HOLES){
    if(p.x >= h.sx && p.x < h.ex){ PLATS.splice(i, 1); break; }
  }
}

// 空中プラットフォーム（ランダム生成）
function addPlat(x, y, tiles, type='block'){
  for(let i=0;i<tiles;i++) PLATS.push({x:x+i*T, y, w:T, h:T, type});
}
// 規則的に + ランダムに大量配置
let rng = 42;
function rand(min, max){ rng = (rng * 1664525 + 1013904223) & 0xffffffff; return min + (Math.abs(rng) % (max-min)); }

// セクションごとに空中ブロックを大量配置
for(let sec = 0; sec < Math.floor(LW / 1000); sec++){
  const baseX = sec * 1000 + 300;
  // 1セクションに5〜10個のプラットフォーム
  const count = rand(4, 8);
  for(let i = 0; i < count; i++){
    const px = baseX + rand(0, 800);
    const py = LH - T - rand(100, 500);
    const pw = rand(2, 7);
    addPlat(px, py, pw);
  }
  // たまに高いところにも
  if(sec % 3 === 0){
    addPlat(baseX + rand(0,500), LH - T - rand(350, 550), rand(3, 8));
  }
  // 階段状プラットフォーム
  if(sec % 5 === 0){
    const sx = baseX + rand(0, 400);
    for(let s=0;s<5;s++) addPlat(sx + s*T*2, LH - T - (s+1)*80, 3);
  }
}

// 特別な広い足場（穴の上）
for(const h of HOLES){
  const mx = (h.sx + h.ex) / 2;
  addPlat(mx - T*2, LH - T - 180, 4);
  if(h.ex - h.sx > 300) addPlat(mx - T, LH - T - 340, 3);
}

// ---- 地面のインクマップ（Uint8Array: 0=なし, 1=自分, 2=敵） ----
// 1pxに1ユニットとしてグリッドで管理
const INK_GRID = 4;  // 4pxごとに1セル
const INK_COLS = Math.ceil(LW / INK_GRID);
const INK_ROWS = Math.ceil(LH / INK_GRID);
const inkMap = new Uint8Array(INK_COLS * INK_ROWS);
function inkIdx(x, y){ return Math.floor(y/INK_GRID)*INK_COLS + Math.floor(x/INK_GRID); }
function getInk(x, y){ const i=inkIdx(x,y); return i>=0&&i<inkMap.length ? inkMap[i] : 0; }
function setInk(x, y, r, val){
  const gx0=Math.floor((x-r)/INK_GRID), gx1=Math.ceil((x+r)/INK_GRID);
  const gy0=Math.floor((y-r)/INK_GRID), gy1=Math.ceil((y+r)/INK_GRID);
  for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++){
    const i=gy*INK_COLS+gx;
    if(i>=0&&i<inkMap.length) inkMap[i]=val;
  }
}

// 敵の初期インクをランダムに塗る
for(let i=0;i<3000;i++){
  setInk(rand(0, LW), rand(LH-80, LH), rand(12,28), 2);
}

// ---- エネミー定義 ----
const ENEMIES = [];
// 60000pxの中に大量の敵
for(let ex=800; ex<LW-500; ex+=rand(300,700)){
  const ey = LH - T - PH - 5;
  ENEMIES.push({x:ex, y:ey, vx:-1.5, vy:0, w:36, h:36, hp:1, dead:false, deadTimer:0, dir:-1, startX:ex, range:200, onGround:false, shootTimer:rand(0,120), inkTimer:0});
}

// ---- ゲーム状態 ----
let state = 'title';
let player, bullets, enemies, particles;
let score = 0, camX = 0;
let keys = {};
let touchL=false, touchR=false, touchJp=false, touchSh=false;
let jumpQueued=false;
let shootQueued=false;
let lives = 5;
let inkLeft = 100; // インク残量

function initGame(){
  player = {x:120, y:400, vx:0, vy:0, onGround:false, dir:1, dead:false, deadTimer:0, invincible:0, swimming:false, swimTimer:0};
  bullets = [];
  enemies = ENEMIES.map(e => ({...e, dead:false, deadTimer:0, vx:-1.5}));
  particles = [];
  score = 0;
  camX = 0;
  inkLeft = 100;
  // 敵インク再配置
  inkMap.fill(0);
  for(let i=0;i<3000;i++) setInk(rand(0, LW), rand(LH-80, LH), rand(12,28), 2);
}

// ---- プラットフォーム高速検索用 ----
// プラットフォームをX座標でソート済みの配列として使う
// プレイヤー付近のものだけ確認すればOK

function getPlatsNear(x, range){
  return PLATS.filter(p => p.x+p.w >= x-range && p.x <= x+range);
}

function overlap(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function moveAndCollide(obj, solids, ox=0, ow=PW, oh=PH){
  const w = obj.w || ow, h = obj.h || oh;
  obj.onGround = false;
  obj.x += obj.vx;
  const box = {x:obj.x-w/2, y:obj.y-h, w, h};
  for(const s of solids){
    if(!overlap(box, s)) continue;
    if(obj.vx > 0) { obj.x = s.x - w/2; }
    else if(obj.vx < 0) { obj.x = s.x + s.w + w/2; }
    obj.vx = 0;
  }
  obj.vy = Math.min(obj.vy + GY, 20);
  obj.y += obj.vy;
  box.x = obj.x-w/2; box.y = obj.y-h;
  for(const s of solids){
    if(!overlap(box, s)) continue;
    if(obj.vy > 0 && obj.y - obj.vy - h <= s.y + 4){
      obj.y = s.y; obj.vy = 0; obj.onGround = true;
    } else if(obj.vy < 0) {
      obj.y = s.y + s.h + h; obj.vy = 1;
    }
  }
}

// ---- 弾の更新 ----
function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    // インクを塗る
    if(b.owner === 'player'){
      setInk(b.x, b.y+16, 20, 1);
      setInk(b.x, b.y-16, 20, 1);
    }
    // 床に当たったら爆発
    const onFloor = b.y > LH - T;
    // プラットフォームに当たったら
    const plat = getPlatsNear(b.x, 60).find(p => b.x>=p.x && b.x<=p.x+p.w && b.y>=p.y && b.y<=p.y+p.h);
    if(b.life <= 0 || onFloor || plat || b.x < 0 || b.x > LW){
      if(b.owner === 'player') inkSplash(b.x, b.y, 1);
      else inkSplash(b.x, b.y, 2);
      bullets.splice(i, 1);
      continue;
    }
    // 敵に当たる
    if(b.owner === 'player'){
      for(const e of enemies){
        if(e.dead) continue;
        if(Math.abs(b.x-e.x)<e.w/2+8 && Math.abs(b.y-(e.y-e.h/2))<e.h/2+8){
          e.dead = true; e.deadTimer = 40;
          inkSplash(e.x, e.y, 1);
          score += 100;
          bullets.splice(i, 1);
          break;
        }
      }
    }
    // 敵弾がプレイヤーに当たる
    if(b.owner === 'enemy' && !player.dead && player.invincible <= 0){
      if(Math.abs(b.x-player.x)<PW/2+6 && Math.abs(b.y-(player.y-PH/2))<PH/2+6){
        playerHit();
        bullets.splice(i, 1);
      }
    }
  }
}

function inkSplash(x, y, val){
  setInk(x, y, 30, val);
  for(let i=0;i<6;i++) particles.push({x, y, vx:(Math.random()-0.5)*5, vy:(Math.random()-3)*3, life:30, color: val===1?MY_INK:BAD_INK});
}

function playerHit(){
  lives--;
  player.dead = true;
  player.deadTimer = 90;
  for(let i=0;i<12;i++) particles.push({x:player.x, y:player.y-PH/2, vx:(Math.random()-0.5)*6, vy:(Math.random()-3)*4, life:40, color:'#fff'});
  if(lives <= 0) setTimeout(() => state='gameover', 1000);
}

// ---- プレイヤー更新 ----
function updatePlayer(){
  if(player.dead){
    player.deadTimer--;
    if(player.deadTimer <= 0 && lives > 0){
      player.dead = false;
      player.x = Math.max(100, camX + 100);
      player.y = 300;
      player.vx = 0; player.vy = 0;
      player.invincible = 120;
    }
    return;
  }
  if(player.invincible > 0) player.invincible--;

  const left  = keys['arrowleft']  || keys['a'] || touchL;
  const right = keys['arrowright'] || keys['d'] || touchR;
  const jump  = keys[' '] || keys['arrowup'] || keys['z'] || touchJp || jumpQueued;
  const shoot = keys['x'] || keys['c'] || touchSh || shootQueued;
  jumpQueued = false;
  shootQueued = false;

  // インクの上に乗ってるか
  const footInk = getInk(player.x, player.y + 2);
  const swimming = footInk === 1 && (keys['arrowdown'] || keys['s']);
  player.swimming = swimming;

  // 速度倍率
  let speedMult = 1;
  if(footInk === 1) speedMult = 1 + INK_SPD_BOOST * 0.3;
  if(footInk === 2) speedMult = ENEMY_INK_SLOW;

  if(left)  { player.vx = -SPD * speedMult; player.dir = -1; }
  else if(right) { player.vx = SPD * speedMult; player.dir = 1; }
  else { player.vx *= 0.7; }

  if((jump) && player.onGround){
    player.vy = JV;
    player.onGround = false;
  }

  // 弾発射
  if(shoot && inkLeft > 5){
    // クールダウンは bulletTimer で管理
    if(!player.shootCd || player.shootCd <= 0){
      const bvx = player.dir * 14;
      bullets.push({x:player.x + player.dir*20, y:player.y-PH*0.6, vx:bvx, vy:-1, life:60, owner:'player'});
      inkLeft = Math.max(0, inkLeft - 8);
      player.shootCd = SHOOT_CD;
    }
  }
  if(player.shootCd > 0) player.shootCd--;
  // インク回復（自分のインクの上や待機中）
  if(footInk === 1 || (!left && !right)) inkLeft = Math.min(100, inkLeft + 0.5);

  const near = getPlatsNear(player.x, W + 200);
  moveAndCollide(player, near, 0, PW, PH);

  // 落下死
  if(player.y > LH + 100 && !player.dead){
    playerHit();
  }

  // クリア判定
  if(player.x >= GOAL_X && state === 'play'){
    state = 'win';
    for(let i=0;i<40;i++) particles.push({x:player.x, y:player.y, vx:(Math.random()-0.5)*10, vy:Math.random()*-8, life:60, color:`hsl(${rand(0,360)},100%,60%)`});
  }

  // カメラ
  camX = Math.max(0, Math.min(LW - W, player.x - W * 0.35));
}

// ---- 敵更新 ----
function updateEnemies(){
  for(const e of enemies){
    if(e.dead){ e.deadTimer--; continue; }
    // 左右移動
    e.x += e.vx;
    if(Math.abs(e.x - e.startX) > e.range) e.vx *= -1;
    e.x = Math.max(0, Math.min(LW, e.x));
    // インクを塗りながら歩く
    e.inkTimer = (e.inkTimer||0) + 1;
    if(e.inkTimer % 8 === 0) setInk(e.x, e.y, 16, 2);
    // 弾発射（カメラ近くの敵だけ）
    if(Math.abs(e.x - (camX+W/2)) < W){
      e.shootTimer--;
      if(e.shootTimer <= 0){
        const dx = player.x - e.x;
        const spd = 7;
        bullets.push({x:e.x, y:e.y-20, vx: dx>0?spd:-spd, vy:-1, life:80, owner:'enemy'});
        e.shootTimer = rand(80, 160);
      }
    }
    // 重力
    e.vy = Math.min((e.vy||0) + GY, 20);
    e.y += e.vy;
    const near = getPlatsNear(e.x, 200);
    e.onGround = false;
    const ebox = {x:e.x-e.w/2, y:e.y-e.h, w:e.w, h:e.h};
    for(const s of near){
      if(!overlap(ebox, s)) continue;
      if(e.vy >= 0 && e.y - e.vy - e.h <= s.y + 4){ e.y=s.y; e.vy=0; e.onGround=true; }
    }
    if(e.y > LH+100) e.dead=true;
    // プレイヤーと接触
    if(!player.dead && player.invincible<=0){
      if(Math.abs(player.x-e.x)<PW/2+e.w/2-4 && Math.abs((player.y-PH/2)-(e.y-e.h/2))<PH/2+e.h/2-4){
        // 踏み（上から）
        if(player.vy > 0 && player.y - PH < e.y - e.h/2){
          e.dead=true; e.deadTimer=40; score+=200; player.vy=JV*0.6;
          inkSplash(e.x, e.y-e.h/2, 1);
        } else {
          playerHit();
        }
      }
    }
  }
}

// ---- パーティクル ----
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

// ---- 描画 ----
const SKY_TOP = '#0a1a3a';
const SKY_BOT = '#1a3a6a';

function drawBG(){
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, SKY_TOP); g.addColorStop(1, SKY_BOT);
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // 背景の建物っぽいシルエット
  cx.fillStyle='rgba(0,60,120,.35)';
  for(let bi=0;bi<30;bi++){
    const bx = (bi*900 - camX*0.3) % (W+200) - 100;
    const bh = 60+bi*20%200;
    cx.fillRect(bx, H-T-bh, 80+bi*7%100, bh);
  }
  // 遠景山
  cx.fillStyle='rgba(20,80,160,.3)';
  for(let mi=0;mi<15;mi++){
    const mx = (mi*1400 - camX*0.15) % (W+400) - 200;
    const mh = 100+mi*30%200;
    cx.beginPath(); cx.moveTo(mx,H-T); cx.lineTo(mx+150,H-T-mh); cx.lineTo(mx+300,H-T); cx.fill();
  }
}

// インクを地面に描画
function drawInk(){
  // 画面内のインクだけ描画
  const x0 = Math.floor(camX / INK_GRID);
  const x1 = Math.ceil((camX + W) / INK_GRID);
  const y0 = Math.floor((LH - T*4) / INK_GRID);
  const y1 = INK_ROWS;
  cx.save();
  for(let gy=y0;gy<y1;gy++){
    for(let gx=x0;gx<x1;gx++){
      const v = inkMap[gy*INK_COLS+gx];
      if(!v) continue;
      cx.fillStyle = v===1 ? MY_INK : BAD_INK;
      cx.globalAlpha = 0.7;
      cx.fillRect(gx*INK_GRID - camX, gy*INK_GRID, INK_GRID+1, INK_GRID+1);
    }
  }
  cx.globalAlpha = 1;
  cx.restore();
}

function drawTile(x, y, type){
  const sx = x - camX;
  if(type==='ground'){
    cx.fillStyle='#3a2a1a';
    cx.fillRect(sx,y,T,T);
    cx.fillStyle='#5a8a3a';
    cx.fillRect(sx,y,T,T*0.3);
    cx.fillStyle='rgba(255,255,255,.05)';
    cx.fillRect(sx,y,T,1);
  } else {
    // 空中ブロック
    cx.fillStyle='#c47a2a';
    cx.fillRect(sx,y,T,T);
    cx.fillStyle='#e8a040';
    cx.fillRect(sx+2,y+2,T-4,T*0.35);
    cx.strokeStyle='#7a4a10';
    cx.lineWidth=2;
    cx.strokeRect(sx+1,y+1,T-2,T-2);
    // クエスチョンマーク風
    cx.fillStyle='rgba(255,255,200,.3)';
    cx.font=`bold ${T*0.6}px monospace`;
    cx.textAlign='center';
    cx.fillText('?', sx+T/2, y+T*0.75);
  }
}

function drawPlayer(){
  if(player.dead) return;
  if(player.invincible>0 && Math.floor(player.invincible/4)%2===0) return;
  const sx = player.x - camX;
  const sy = player.y;
  cx.save();
  cx.translate(sx, sy);
  if(player.dir < 0) cx.scale(-1, 1);
  // 胴体
  cx.fillStyle = MY_INK;
  cx.fillRect(-PW/2, -PH, PW, PH*0.65);
  // 頭
  cx.fillStyle='#ffe0b0';
  cx.beginPath(); cx.ellipse(2, -PH*0.85, PW*0.45, PH*0.35, 0, 0, Math.PI*2); cx.fill();
  // 触手ヘア
  cx.fillStyle = MY_INK;
  cx.fillRect(-4, -PH*1.15, 6, PH*0.35);
  cx.fillRect(6, -PH*1.25, 6, PH*0.45);
  // 目
  cx.fillStyle='#111';
  cx.beginPath(); cx.ellipse(6, -PH*0.85, 5, 6, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle='#fff';
  cx.beginPath(); cx.ellipse(8, -PH*0.87, 2, 2, 0, 0, Math.PI*2); cx.fill();
  // 足
  const legOff = Math.sin(Date.now()*0.02) * 6;
  cx.fillStyle='#223366';
  cx.fillRect(-PW/2, -PH*0.35, PW*0.4, PH*0.35 + legOff);
  cx.fillRect(PW*0.1, -PH*0.35, PW*0.4, PH*0.35 - legOff);
  // インクガン
  cx.fillStyle='#aaa';
  cx.fillRect(PW*0.35, -PH*0.75, PW*0.6, PH*0.2);
  cx.restore();
}

function drawEnemy(e){
  if(e.dead){
    if(e.deadTimer > 0){
      const sx = e.x - camX;
      cx.globalAlpha = e.deadTimer/40;
      cx.fillStyle = BAD_INK;
      cx.beginPath(); cx.arc(sx, e.y-e.h/2, e.w*0.7, 0, Math.PI*2); cx.fill();
      cx.globalAlpha = 1;
    }
    return;
  }
  const sx = e.x - camX;
  if(sx < -100 || sx > W+100) return;
  cx.save();
  cx.translate(sx, e.y);
  if(e.vx > 0) cx.scale(-1, 1);
  // 敵キャラ（ピンクのイカ敵）
  cx.fillStyle = BAD_INK;
  cx.fillRect(-e.w/2, -e.h, e.w, e.h*0.7);
  cx.fillStyle='#ffd0e8';
  cx.beginPath(); cx.ellipse(0, -e.h*0.85, e.w*0.4, e.h*0.3, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle='#cc0066';
  cx.fillRect(-4, -e.h*1.1, 5, e.h*0.3);
  cx.fillRect(4, -e.h*1.2, 5, e.h*0.4);
  cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(5, -e.h*0.85, 4, 5, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle='#fff';
  cx.beginPath(); cx.ellipse(6.5, -e.h*0.87, 1.5, 1.5, 0, 0, Math.PI*2); cx.fill();
  cx.restore();
}

function drawBullet(b){
  const sx = b.x - camX;
  if(sx < -20 || sx > W+20) return;
  cx.beginPath();
  cx.arc(sx, b.y, 7, 0, Math.PI*2);
  cx.fillStyle = b.owner==='player' ? MY_INK : BAD_INK;
  cx.fill();
  cx.strokeStyle='#fff'; cx.lineWidth=2; cx.stroke();
}

function drawParticles(){
  for(const p of particles){
    const sx = p.x - camX;
    cx.globalAlpha = p.life / 60;
    cx.fillStyle = p.color;
    cx.beginPath(); cx.arc(sx, p.y, 5, 0, Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1;
}

function drawGoal(){
  const sx = GOAL_X - camX;
  if(sx < -100 || sx > W+100) return;
  // ゴールポール
  cx.fillStyle='#ffdd00';
  cx.fillRect(sx-4, LH-T*6, 8, T*5);
  // 旗
  cx.fillStyle='#22ddff';
  cx.beginPath(); cx.moveTo(sx+4, LH-T*6); cx.lineTo(sx+70, LH-T*5.5); cx.lineTo(sx+4, LH-T*5); cx.fill();
  cx.fillStyle='#fff'; cx.font='bold 28px sans-serif'; cx.textAlign='center';
  cx.fillText('🎌', sx+36, LH-T*5.2);
}

function drawHUD(){
  // インク残量
  cx.fillStyle='rgba(0,0,0,.5)';
  cx.fillRect(W-160, 10, 150, 22);
  cx.fillStyle=MY_INK;
  cx.fillRect(W-158, 12, inkLeft*1.46, 18);
  cx.fillStyle='#fff'; cx.font='13px monospace'; cx.textAlign='right';
  cx.fillText('🎨インク', W-10, 27);

  // ライフ
  cx.font='bold 22px sans-serif'; cx.textAlign='left';
  cx.fillText('❤️'.repeat(lives), 10, 35);

  // スコア
  cx.fillStyle='#fff'; cx.font='bold 16px monospace';
  cx.textAlign='left';
  cx.fillText('スコア: '+score, 10, 58);

  // 距離
  const pct = Math.floor(player.x / GOAL_X * 100);
  cx.fillStyle='rgba(0,0,0,.4)';
  cx.fillRect(W/2-100, 8, 200, 16);
  cx.fillStyle='#22ddff';
  cx.fillRect(W/2-100, 8, Math.min(200, pct*2), 16);
  cx.fillStyle='#fff'; cx.font='11px monospace'; cx.textAlign='center';
  cx.fillText('ゴールまで ' + Math.max(0,100-pct) + '%', W/2, 20);
}

function drawTitle(){
  cx.fillStyle='#0a1a3a'; cx.fillRect(0,0,W,H);
  // タイトル背景
  cx.fillStyle='rgba(0,180,255,.1)';
  cx.fillRect(W/2-280,H/2-170,560,340);
  cx.strokeStyle=MY_INK; cx.lineWidth=3;
  cx.strokeRect(W/2-280,H/2-170,560,340);

  cx.fillStyle=MY_INK; cx.font='bold 48px monospace'; cx.textAlign='center';
  cx.fillText('🦑 インクランナー', W/2, H/2-100);
  cx.fillStyle='#fff'; cx.font='18px sans-serif';
  cx.fillText('← → 移動　スペース/Z ジャンプ', W/2, H/2-40);
  cx.fillText('X/C でインク発射！　敵のインクは遅くなる！', W/2, H/2);
  cx.fillText('自分のインクの上は速い！ゴールを目指せ！', W/2, H/2+35);

  const blink=Math.floor(Date.now()/600)%2;
  if(blink){ cx.fillStyle='#ffdd00'; cx.font='bold 24px monospace'; cx.fillText('▶ スペースキーでスタート！', W/2, H/2+100); }
}

function drawWin(){
  cx.fillStyle='rgba(0,0,0,.6)'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#ffdd00'; cx.font='bold 52px monospace'; cx.textAlign='center';
  cx.fillText('🎉 クリア！！', W/2, H/2-60);
  cx.fillStyle='#fff'; cx.font='26px sans-serif';
  cx.fillText('スコア: '+score, W/2, H/2);
  cx.fillStyle='#aaa'; cx.font='18px sans-serif';
  cx.fillText('スペースでタイトルへ', W/2, H/2+60);
}
function drawGameOver(){
  cx.fillStyle='rgba(0,0,0,.75)'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#ff4466'; cx.font='bold 52px monospace'; cx.textAlign='center';
  cx.fillText('💀 ゲームオーバー', W/2, H/2-60);
  cx.fillStyle='#fff'; cx.font='26px sans-serif';
  cx.fillText('スコア: '+score, W/2, H/2);
  cx.fillStyle='#aaa'; cx.font='18px sans-serif';
  cx.fillText('スペースでタイトルへ', W/2, H/2+60);
}

// ---- メインループ ----
function loop(){
  if(state==='title'){ drawBG(); drawTitle(); return; }
  if(state==='play' || state==='win' || state==='gameover'){
    updatePlayer();
    updateEnemies();
    updateBullets();
    updateParticles();
    drawBG();
    drawInk();
    // プラットフォーム描画
    const sx0 = camX - T, sx1 = camX + W + T;
    for(const p of PLATS){
      if(p.x+p.w < sx0 || p.x > sx1) continue;
      drawTile(p.x, p.y, p.type==='ground'?'ground':'block');
    }
    // 弾
    for(const b of bullets) drawBullet(b);
    // 敵
    for(const e of enemies) drawEnemy(e);
    // プレイヤー
    drawPlayer();
    // パーティクル
    drawParticles();
    // ゴール
    drawGoal();
    // HUD
    drawHUD();
    if(state==='win') drawWin();
    if(state==='gameover') drawGameOver();
  }
}

// ---- 入力 ----
document.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key===' ') e.preventDefault();
  if(state==='title' && (e.key===' '||e.key==='Enter')){
    lives=5; initGame(); state='play';
  }
  if((state==='win'||state==='gameover') && (e.key===' '||e.key==='Enter')) state='title';
});
document.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

// タッチ
window.addEventListener('touchstart', ()=>{ document.getElementById('tc').classList.add('show'); }, {once:true});
const bl=document.getElementById('bl'), br=document.getElementById('br');
const bjp=document.getElementById('bjp'), bsh=document.getElementById('bsh');
bl.addEventListener('touchstart', e=>{e.preventDefault();touchL=true;});
bl.addEventListener('touchend', ()=>touchL=false); bl.addEventListener('touchcancel',()=>touchL=false);
br.addEventListener('touchstart', e=>{e.preventDefault();touchR=true;});
br.addEventListener('touchend', ()=>touchR=false); br.addEventListener('touchcancel',()=>touchR=false);
bjp.addEventListener('touchstart', e=>{
  e.preventDefault(); jumpQueued=true; touchJp=true;
  if(state==='title'){lives=5;initGame();state='play';}
  if(state==='win'||state==='gameover') state='title';
});
bjp.addEventListener('touchend', ()=>touchJp=false);
bjp.addEventListener('touchcancel', ()=>touchJp=false);
bsh.addEventListener('touchstart', e=>{e.preventDefault();touchSh=true;shootQueued=true;});
bsh.addEventListener('touchend', ()=>touchSh=false);
bsh.addEventListener('touchcancel', ()=>touchSh=false);

cv.addEventListener('click', ()=>{
  if(state==='title'){lives=5;initGame();state='play';}
  if(state==='win'||state==='gameover') state='title';
});

// ゲーム起動
lives = 5;
setInterval(loop, 16);
</script>
</body>
