<script>
'use strict';
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ========== 定数 ==========
const GY   = 0.58;
const JV   = -15;
const DJJV = -13;   // 二段ジャンプ
const SPD  = 5.5;
const T    = 48;
const LW   = 30000; // 3万px！超広い
const FLOOR_Y = 620; // 床のY座標

// インク色
const P_INK = '#00eeff';
const E_INK = '#ff2277';
const SPECIAL_COLOR = '#ffdd00';

// ========== レベル設計 ==========
// セクションごとに手動で丁寧に配置
// 地面プラットフォーム（穴あきで区切る）
const GROUNDS = [];
const FLOATING = [];

// --- 地面（穴の間を埋める） ---
function addGround(x, w){ GROUNDS.push({x, y:FLOOR_Y, w, h:T, type:'g'}); }
function addBlock(x, y, w){ FLOATING.push({x, y, w:w*T, h:T, type:'b'}); }

// ゾーン1 (0〜3000) - チュートリアル、余裕あり

addBlock(800,  FLOOR_Y-140, 4);
addBlock(1400, FLOOR_Y-200, 3);
addBlock(1800, FLOOR_Y-140, 5);
addBlock(2300, FLOOR_Y-280, 3);

// ゾーン2 (3200〜3600) 穴1

// ゾーン8 (19600〜20600) 穴7
addGround(20600, 2400);

// ゾーン9 (23000〜24000) 穴8
addGround(24000, 2200);
addBlock(24100, FLOOR_Y-200, 2);
addBlock(24300, FLOOR_Y-320, 2);
addBlock(24500, FLOOR_Y-440, 2);
addBlock(24700, FLOOR_Y-560, 3); // 最高高さ！
addBlock(25000, FLOOR_Y-440, 2);
addBlock(25200, FLOOR_Y-320, 2);

// ゾーン10 (26200〜27000) 穴9
addGround(27000, 1600);
addBlock(27100, FLOOR_Y-200, 2);
addBlock(27250, FLOOR_Y-320, 2);
addBlock(27400, FLOOR_Y-440, 2);
addBlock(27550, FLOOR_Y-560, 2);
addBlock(27700, FLOOR_Y-440, 2);
addBlock(27850, FLOOR_Y-320, 2);
addBlock(28000, FLOOR_Y-200, 3);

// ゾーン11 (28600〜29200) 穴10 ラストスパート
addGround(29200, 800); // ゴール前
addBlock(29300, FLOOR_Y-200, 3);
addBlock(29600, FLOOR_Y-320, 3);

const PLATS = [...GROUNDS, ...FLOATING];

// ゴール
const GOAL_X = LW - 300;

// ========== インクマップ ==========
const IG = 6; // グリッドサイズ（px）
const IC = Math.ceil(LW / IG);
const IR = Math.ceil((FLOOR_Y + T) / IG);
const inkMap = new Uint8Array(IC * IR);
function iIdx(x, y){ return ~~(y/IG)*IC + ~~(x/IG); }
function getInk(x, y){ const i=iIdx(x,y); return (i>=0&&i<inkMap.length)?inkMap[i]:0; }
function paintInk(cx2, cy2, r, v){
  const gx0=Math.max(0,~~((cx2-r)/IG)), gx1=Math.min(IC-1,~~((cx2+r)/IG)+1);
  const gy0=Math.max(0,~~((cy2-r)/IG)), gy1=Math.min(IR-1,~~((cy2+r)/IG)+1);
  for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++){
    const dx=(gx*IG+IG/2)-cx2, dy=(gy*IG+IG/2)-cy2;
    if(dx*dx+dy*dy<=r*r){ const i=gy*IC+gx; if(i>=0&&i<inkMap.length) inkMap[i]=v; }
  }
}

// ========== 敵の定義 ==========
// 手動で敵を配置（zone2以降）
const ENEMY_DEF = [];
function addEnemy(x, type='walk', y=null){
  ENEMY_DEF.push({x, y: y ?? FLOOR_Y-36, type});
}
// ゾーン1
addEnemy(600,'walk'); addEnemy(1200,'walk'); addEnemy(2000,'shoot');
// ゾーン2
addEnemy(3700,'walk'); addEnemy(4100,'walk'); addEnemy(4600,'shoot'); addEnemy(5000,'walk'); addEnemy(5400,'shoot');
// ゾーン3
addEnemy(6600,'walk'); addEnemy(7100,'shoot'); addEnemy(7500,'walk'); addEnemy(7900,'shoot'); addEnemy(8200,'walk');
// ゾーン4
addEnemy(9400,'walk'); addEnemy(9800,'shoot'); addEnemy(10100,'walk'); addEnemy(10500,'shoot');
// ゾーン5
addEnemy(12000,'walk'); addEnemy(12300,'shoot'); addEnemy(12700,'walk'); addEnemy(13100,'shoot'); addEnemy(13400,'walk');
// ゾーン6
addEnemy(14700,'walk'); addEnemy(15000,'shoot'); addEnemy(15300,'walk'); addEnemy(15600,'shoot');
addEnemy(16000,'walk'); addEnemy(16300,'shoot'); addEnemy(16600,'walk');
// ゾーン7
addEnemy(17900,'shoot'); addEnemy(18200,'walk'); addEnemy(18500,'shoot'); addEnemy(18800,'walk'); addEnemy(19000,'shoot');
// ゾーン8
addEnemy(20700,'walk'); addEnemy(21100,'shoot'); addEnemy(21500,'walk'); addEnemy(21800,'shoot');
addEnemy(22200,'walk'); addEnemy(22500,'shoot'); addEnemy(22800,'walk');
// ゾーン9
addEnemy(24200,'shoot'); addEnemy(24500,'walk'); addEnemy(24800,'shoot'); addEnemy(25100,'walk');
addEnemy(25400,'shoot'); addEnemy(25700,'walk');
// ゾーン10
addEnemy(27100,'shoot'); addEnemy(27300,'walk'); addEnemy(27500,'shoot'); addEnemy(27700,'walk'); addEnemy(27900,'shoot');
// ゾーン11
addEnemy(29300,'shoot'); addEnemy(29500,'walk'); addEnemy(29700,'shoot');

// ========== ゲーム状態 ==========
let state = 'title';
let player, enemies, bullets, particles;
let score = 0, lives = 5, camX = 0;
let inkBar = 0;       // インクゲージ 0〜100
let specialGauge = 0; // 必殺技ゲージ 0〜100
let specialFlash = 0; // 必殺技エフェクト
let keys = {};
let touchL=false,touchR=false,touchJp=false,touchSh=false,touchSp=false;
let jumpQueued=false,shootQueued=false,specialQueued=false;

function initGame(){
  player = {
    x:120, y:FLOOR_Y-PH, vx:0, vy:0,
    onGround:false, dir:1,
    dead:false, deadTimer:0,
    invincible:0, djump:false,
    shootCd:0
  };
  enemies = ENEMY_DEF.map(e=>({
    ...e, vx:e.type==='walk'?-2.8:0, vy:0,
    onGround:false, hp:e.type==='shoot'?3:2,
    shootTimer: 40+~~(Math.random()*40),
    inkTimer:0, dead:false, deadTimer:0,
    startX:e.x, range:320
  }));
  bullets = [];
  particles = [];
  score = 0; camX = 0;
  inkBar = 80; specialGauge = 0; specialFlash = 0;
  inkMap.fill(0);
  // 敵のインクを少量初期配置
  for(const e of ENEMY_DEF) paintInk(e.x, e.y, 40, 2);
}

// ========== サイズ ==========
const PW=28, PH=44;

// ========== 衝突 ==========
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function moveObj(obj, w, h){
  // obj.x = center, obj.y = bottom
  obj.onGround = false;
  obj.x += obj.vx;
  const bx={x:obj.x-w/2, y:obj.y-h, w, h};
  for(const p of PLATS){
    if(p.x>bx.x+bx.w+4||p.x+p.w<bx.x-4) continue;
    if(!overlap(bx,p)) continue;
    if(obj.vx>0){ obj.x=p.x-w/2; }
    else { obj.x=p.x+p.w+w/2; }
    obj.vx=0;
  }
  obj.vy = Math.min(obj.vy+GY, 22);
  obj.y += obj.vy;
  bx.x=obj.x-w/2; bx.y=obj.y-h;
  for(const p of PLATS){
    if(p.x>bx.x+bx.w+4||p.x+p.w<bx.x-4) continue;
    if(!overlap(bx,p)) continue;
    if(obj.vy>=0 && obj.y-obj.vy-h<=p.y+6){
      obj.y=p.y; obj.vy=0; obj.onGround=true;
      if(obj===player) obj.djump=false; // 着地で二段ジャンプリセット
    } else if(obj.vy<0){
      obj.y=p.y+p.h+h; obj.vy=1;
    }
  }
  // 壁クランプ
  if(obj.x<w/2){ obj.x=w/2; obj.vx=0; }
  if(obj.x>LW-w/2){ obj.x=LW-w/2; obj.vx=0; }
}

// ========== プレイヤー更新 ==========
function updatePlayer(){
  if(player.dead){
    player.deadTimer--;
    if(player.deadTimer<=0&&lives>0){
      player.dead=false; player.x=Math.max(120,camX+80); player.y=FLOOR_Y-PH;
      player.vx=0; player.vy=0; player.invincible=150; player.djump=false;
      inkBar=80;
    }
    return;
  }
  if(player.invincible>0) player.invincible--;
  if(player.shootCd>0) player.shootCd--;

  const L = keys['arrowleft']||keys['a']||touchL;
  const R = keys['arrowright']||keys['d']||touchR;
  const J = keys[' ']||keys['z']||keys['arrowup']||touchJp||jumpQueued;
  const S = keys['x']||keys['c']||touchSh||shootQueued;
  const SP= keys['shift']||keys['v']||touchSp||specialQueued;
  jumpQueued=false; shootQueued=false; specialQueued=false;

  // インクの速度補正
  const foot = getInk(player.x, player.y+2);
  let spd = SPD;
  if(foot===1) spd=SPD*1.6;
  if(foot===2) spd=SPD*0.4;

  if(L){ player.vx=-spd; player.dir=-1; }
  else if(R){ player.vx=spd; player.dir=1; }
  else player.vx*=0.75;

  // ジャンプ（二段ジャンプあり）
  if(J){
    if(player.onGround){ player.vy=JV; player.djump=false; }
    else if(!player.djump){ player.vy=DJJV; player.djump=true;
      for(let i=0;i<8;i++) particles.push({x:player.x,y:player.y-PH/2,vx:(Math.random()-0.5)*5,vy:Math.random()*-4,life:25,color:P_INK,size:6});
    }
  }

  // 射撃
  if(S && inkBar>5 && player.shootCd<=0){
    const bvx = player.dir*16;
    bullets.push({x:player.x+player.dir*24,y:player.y-PH*0.55,vx:bvx,vy:-0.5,life:55,owner:'player',r:7});
    inkBar=Math.max(0,inkBar-7);
    player.shootCd=10;
  }
  // インク回復
  if(foot===1||(!L&&!R)) inkBar=Math.min(100,inkBar+0.6);
  // インクを塗る（歩くだけで少し塗る）
  if((L||R)&&player.onGround) paintInk(player.x, player.y, 18, 1);

  // 必殺技！
  if(SP && specialGauge>=100){ useSpecial(); }

  moveObj(player, PW, PH);

  // カメラ
  camX = Math.max(0, Math.min(LW-W, player.x-W*0.38));

  // 落下死
  if(player.y>FLOOR_Y+300 && !player.dead) hitPlayer();

  // クリア
  if(player.x>=GOAL_X && state==='play'){
    state='win';
    for(let i=0;i<60;i++) particles.push({x:player.x,y:player.y-PH,vx:(Math.random()-0.5)*12,vy:Math.random()*-10,life:80,color:`hsl(${~~(Math.random()*360)},100%,60%)`,size:8});
  }
}

// ========== 必殺技 ==========
function useSpecial(){
  specialGauge = 0;
  specialFlash = 50; // フラッシュフレーム数
  // 周囲800pxをインクで塗りつぶす！
  paintInk(player.x, player.y, 800, 1);
  // 近くの敵を全滅
  let killed = 0;
  for(const e of enemies){
    if(e.dead) continue;
    if(Math.abs(e.x-player.x)<900 && Math.abs(e.y-player.y)<500){
      e.dead=true; e.deadTimer=50; killed++;
      score+=200;
      for(let i=0;i<8;i++) particles.push({x:e.x,y:e.y-20,vx:(Math.random()-0.5)*10,vy:-3-Math.random()*5,life:40,color:SPECIAL_COLOR,size:10});
    }
  }
  // 派手なエフェクト
  for(let i=0;i<50;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*400;
    particles.push({x:player.x+Math.cos(a)*r*0.1,y:player.y-PH/2+Math.sin(a)*r*0.1,vx:Math.cos(a)*8,vy:Math.sin(a)*8-4,life:50,color:SPECIAL_COLOR,size:12});
  }
  // 上に少し飛ぶ
  player.vy = -10;
  score += killed * 100;
}

// ========== 敵更新 ==========
function updateEnemies(){
  for(const e of enemies){
    if(e.dead){ e.deadTimer--; continue; }
    if(Math.abs(e.x-camX)>W+400) continue; // 画面外スキップ

    // 歩き敵
    if(e.type==='walk'){
      e.x+=e.vx;
      if(Math.abs(e.x-e.startX)>e.range) e.vx*=-1;
      e.vy=Math.min((e.vy||0)+GY,20);
      e.y+=e.vy;
      e.onGround=false;
      for(const p of PLATS){
        const ew=32,eh=36;
        const eb={x:e.x-ew/2,y:e.y-eh,w:ew,h:eh};
        if(!overlap(eb,p)) continue;
        if(e.vy>=0&&e.y-e.vy-eh<=p.y+6){e.y=p.y;e.vy=0;e.onGround=true;}
      }
    }
    // インクを塗りながら歩く
    e.inkTimer=(e.inkTimer||0)+1;
    if(e.inkTimer%6===0) paintInk(e.x, e.y, 22, 2);

    // 射撃敵
    if(e.type==='shoot'){
      e.shootTimer--;
      if(e.shootTimer<=0){
        const dx=player.x-e.x, dy=(player.y-PH/2)-(e.y-20);
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const spd=11;
        bullets.push({x:e.x,y:e.y-28,vx:dx/dist*spd,vy:dy/dist*spd,life:100,owner:'enemy',r:9});
        e.shootTimer=55+~~(Math.random()*40);
      }
    }

    // プレイヤーとの接触
    if(!player.dead&&player.invincible<=0){
      const ew=e.type==='walk'?32:28;
      if(Math.abs(player.x-e.x)<(PW+ew)/2-4&&Math.abs((player.y-PH/2)-(e.y-20))<(PH+36)/2-4){
        if(player.vy>1&&player.y-PH<e.y-30){
          // 踏んだ！
          e.hp--; player.vy=-10;
          if(e.hp<=0){
            e.dead=true; e.deadTimer=40; score+=300;
            specialGauge=Math.min(100,specialGauge+20);
            inkSplash(e.x, e.y-18, 1);
          } else {
            inkSplash(e.x, e.y-18, 1);
          }
        } else { hitPlayer(); }
      }
    }
  }
}

function inkSplash(x, y, v){
  paintInk(x, y, 35, v);
  const col=v===1?P_INK:E_INK;
  for(let i=0;i<8;i++) particles.push({x,y,vx:(Math.random()-0.5)*7,vy:-2-Math.random()*5,life:35,color:col,size:7});
}

// ========== 弾更新 ==========
function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    // インク塗り（プレイヤー弾）
    if(b.owner==='player'){
      paintInk(b.x,b.y,12,1);
      specialGauge=Math.min(100,specialGauge+0.05);
    }
    let hit=false;
    if(b.life<=0||b.y>FLOOR_Y+50){
      inkSplash(b.x,b.y,b.owner==='player'?1:2); bullets.splice(i,1); continue;
    }
    // プラットフォームとの衝突
    for(const p of PLATS){
      if(b.x>=p.x&&b.x<=p.x+p.w&&b.y>=p.y&&b.y<=p.y+p.h){
        inkSplash(b.x,b.y,b.owner==='player'?1:2); bullets.splice(i,1); hit=true; break;
      }
    }
    if(hit) continue;
    // 敵弾がプレイヤーに当たる
    if(b.owner==='enemy'&&!player.dead&&player.invincible<=0){
      if(Math.abs(b.x-player.x)<PW/2+b.r&&Math.abs(b.y-(player.y-PH/2))<PH/2+b.r){
        hitPlayer(); inkSplash(b.x,b.y,2); bullets.splice(i,1); continue;
      }
    }
    // プレイヤー弾が敵に当たる
    if(b.owner==='player'){
      for(const e of enemies){
        if(e.dead) continue;
        if(Math.abs(b.x-e.x)<20+b.r&&Math.abs(b.y-(e.y-20))<24+b.r){
          e.hp--;
          if(e.hp<=0){
            e.dead=true; e.deadTimer=40; score+=300;
            specialGauge=Math.min(100,specialGauge+25);
          }
          inkSplash(b.x,b.y,1); bullets.splice(i,1); hit=true; break;
        }
      }
    }
  }
}

function hitPlayer(){
  lives--;
  player.dead=true; player.deadTimer=90;
  for(let i=0;i<14;i++) particles.push({x:player.x,y:player.y-PH/2,vx:(Math.random()-0.5)*8,vy:-3-Math.random()*6,life:45,color:'#fff',size:8});
  if(lives<=0) setTimeout(()=>{ state='gameover'; },1200);
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

// ========== 描画 ==========
function drawBG(){
  // 空
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#08183a'); g.addColorStop(1,'#142a5a');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // 遠景ビル（視差）
  cx.fillStyle='rgba(0,40,100,.4)';
  for(let i=0;i<25;i++){
    const bx=(i*820-camX*0.12)%(W+300)-150;
    const bh=60+i*25%250;
    cx.fillRect(bx,H-bh,100+i*15%80,bh);
    // 窓
    cx.fillStyle='rgba(255,255,150,.15)';
    for(let wy=0;wy<bh;wy+=28) for(let wx=0;wx<5;wx++) cx.fillRect(bx+8+wx*16,H-bh+wy+4,8,14);
    cx.fillStyle='rgba(0,40,100,.4)';
  }
  // 山
  cx.fillStyle='rgba(0,30,80,.5)';
  for(let i=0;i<12;i++){
    const mx=(i*1600-camX*0.06)%(W+600)-300;
    const mh=80+i*40%300;
    cx.beginPath(); cx.moveTo(mx,H-T); cx.lineTo(mx+200,H-T-mh); cx.lineTo(mx+400,H-T); cx.fill();
  }
}

function drawInk(){
  const x0=Math.max(0,~~(camX/IG)-1);
  const x1=Math.min(IC-1,~~((camX+W)/IG)+2);
  const y0=Math.max(0,~~((FLOOR_Y-120)/IG));
  for(let gy=y0;gy<IR;gy++){
    let gx=x0;
    while(gx<=x1){
      const v=inkMap[gy*IC+gx];
      if(!v){gx++;continue;}
      // 連続する同じ色をまとめて描画（高速化）
      let gx2=gx+1;
      while(gx2<=x1&&inkMap[gy*IC+gx2]===v) gx2++;
      cx.fillStyle=v===1?P_INK:E_INK;
      cx.globalAlpha=0.72;
      cx.fillRect(gx*IG-camX,gy*IG,(gx2-gx)*IG+1,IG+1);
      gx=gx2;
    }
  }
  cx.globalAlpha=1;
}

function drawPlatform(p){
  const sx=p.x-camX;
  if(sx+p.w<-10||sx>W+10) return;
  if(p.type==='g'){
    // 地面
    cx.fillStyle='#3d2b1a'; cx.fillRect(sx,p.y,p.w,p.h);
    cx.fillStyle='#4a8a2a'; cx.fillRect(sx,p.y,p.w,T*0.35);
    // 草の細かい描写
    cx.fillStyle='#5faa3a';
    for(let gx=sx;gx<sx+p.w;gx+=16){
      cx.fillRect(gx,p.y-4,3,8); cx.fillRect(gx+6,p.y-6,3,10);
    }
  } else {
    // 空中ブロック
    cx.fillStyle='#c06020'; cx.fillRect(sx,p.y,p.w,p.h);
    cx.fillStyle='#e07838'; cx.fillRect(sx+2,p.y+2,p.w-4,T*0.4);
    cx.strokeStyle='#804010'; cx.lineWidth=2; cx.strokeRect(sx+1,p.y+1,p.w-2,p.h-2);
    // タイル区切り線
    for(let tx=sx+T;tx<sx+p.w;tx+=T){
      cx.strokeStyle='rgba(0,0,0,.25)'; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(tx,p.y+1); cx.lineTo(tx,p.y+p.h-1); cx.stroke();
    }
  }
}

function drawPlayer(){
  if(player.dead) return;
  if(player.invincible>0&&Math.floor(player.invincible/5)%2===0) return;
  const sx=player.x-camX;
  const sy=player.y-PH;
  cx.save();
  cx.translate(sx+PW/2, sy+PH/2);
  if(player.dir<0) cx.scale(-1,1);

  // 必殺技中はオーラ
  if(specialFlash>0){
    cx.shadowColor=SPECIAL_COLOR; cx.shadowBlur=20;
  }

  // 足
  const legSwing = Math.sin(Date.now()*0.025)*(player.onGround?6:0);
  cx.fillStyle='#1a2255';
  cx.fillRect(-PW/2, PH*0.25, PW*0.42, PH*0.45+legSwing);
  cx.fillRect(PW*0.08, PH*0.25, PW*0.42, PH*0.45-legSwing);
  // 靴
  cx.fillStyle='#fff';
  cx.fillRect(-PW/2-2,PH*0.55+legSwing, PW*0.48,PH*0.15);
  cx.fillRect(PW*0.05,PH*0.55-legSwing, PW*0.48,PH*0.15);
  // 胴体
  cx.fillStyle=P_INK;
  cx.fillRect(-PW/2, -PH*0.15, PW, PH*0.45);
  // 頭
  cx.fillStyle='#ffe8b0';
  cx.beginPath(); cx.ellipse(2,-PH*0.3,PW*0.42,PH*0.3,0,0,Math.PI*2); cx.fill();
  // 触手ヘア（2本）
  cx.fillStyle=P_INK;
  cx.beginPath();
  cx.ellipse(-4,-PH*0.6,4,PH*0.22,-.3,0,Math.PI*2); cx.fill();
  cx.beginPath();
  cx.ellipse(8,-PH*0.7,4,PH*0.28,.3,0,Math.PI*2); cx.fill();
  // 目
  cx.fillStyle='#111';
  cx.beginPath(); cx.ellipse(7,-PH*0.3,5,6,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#fff';
  cx.beginPath(); cx.ellipse(9,-PH*0.32,2,2.5,0,0,Math.PI*2); cx.fill();
  // インクガン
  cx.fillStyle='#888';
  cx.fillRect(PW*0.4,-PH*0.05,PW*0.6,PH*0.15);
  cx.fillStyle='#aaa';
  cx.fillRect(PW*0.8,-PH*0.1,PW*0.25,PH*0.25);

  cx.restore();
}

function drawEnemy(e){
  if(e.dead){
    if(e.deadTimer>0){
      const sx=e.x-camX;
      cx.globalAlpha=e.deadTimer/50;
      cx.fillStyle=E_INK;
      cx.beginPath(); cx.arc(sx,e.y-22,22*(1-e.deadTimer/50)+10,0,Math.PI*2); cx.fill();
      cx.globalAlpha=1;
    }
    return;
  }
  const sx=e.x-camX;
  if(sx<-60||sx>W+60) return;
  cx.save();
  cx.translate(sx,e.y-36);
  const facing=e.type==='walk'?(e.vx>0?-1:1):(player.x<e.x?-1:1);
  if(facing<0) cx.scale(-1,1);
  // 体
  const ew=e.type==='shoot'?30:32;
  cx.fillStyle=E_INK;
  cx.fillRect(-ew/2,0,ew,26);
  cx.fillStyle='#ffb0d0';
  cx.beginPath(); cx.ellipse(0,-8,ew*0.4,14,0,0,Math.PI*2); cx.fill();
  // 触手
  cx.fillStyle=E_INK;
  cx.beginPath(); cx.ellipse(-5,-22,4,12,-0.3,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(6,-26,4,14,0.3,0,Math.PI*2); cx.fill();
  // 目（怒り顔）
  cx.fillStyle='#fff';
  cx.beginPath(); cx.ellipse(6,-8,5,5,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#330000';
  cx.beginPath(); cx.ellipse(7,-9,2.5,3,0,0,Math.PI*2); cx.fill();
  // シュート敵は銃を持つ
  if(e.type==='shoot'){
    cx.fillStyle='#666';
    cx.fillRect(ew/2-2,2,18,8);
  }
  // HP2の敵は赤っぽい縁
  if(e.hp===2){
    cx.strokeStyle='rgba(255,0,0,.6)'; cx.lineWidth=3;
    cx.strokeRect(-ew/2,0,ew,26);
  }
  cx.restore();
}

function drawBullet(b){
  const sx=b.x-camX;
  if(sx<-20||sx>W+20) return;
  cx.beginPath(); cx.arc(sx,b.y,b.r,0,Math.PI*2);
  cx.fillStyle=b.owner==='player'?P_INK:E_INK;
  cx.fill();
  cx.strokeStyle='#fff'; cx.lineWidth=2; cx.stroke();
}

function drawGoal(){
  const sx=GOAL_X-camX;
  if(sx<-200||sx>W+50) return;
  // ポール
  cx.fillStyle='#ffd700';
  cx.fillRect(sx-5,FLOOR_Y-T*8,10,T*7);
  // 旗
  cx.fillStyle=P_INK;
  cx.beginPath(); cx.moveTo(sx+5,FLOOR_Y-T*8); cx.lineTo(sx+90,FLOOR_Y-T*6.5); cx.lineTo(sx+5,FLOOR_Y-T*5.5); cx.fill();
  cx.font='bold 30px sans-serif'; cx.textAlign='center';
  cx.fillText('🎌',sx+50,FLOOR_Y-T*6.3);
  // GOAL文字
  cx.fillStyle='#ffd700'; cx.font='bold 20px monospace'; cx.textAlign='center';
  cx.fillText('GOAL!',sx,FLOOR_Y-T*9);
}

function drawParticles(){
  for(const p of particles){
    const sx=p.x-camX;
    if(sx<-20||sx>W+20) continue;
    cx.globalAlpha=Math.max(0,p.life/60);
    cx.fillStyle=p.color;
    cx.beginPath(); cx.arc(sx,p.y,p.size||5,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha=1;
}

function drawHUD(){
  if(state!=='play') return;
  // ライフ
  cx.font='bold 22px sans-serif'; cx.textAlign='left';
  cx.fillText('❤️'.repeat(Math.max(0,lives)),10,35);

  // インクゲージ
  cx.fillStyle='rgba(0,0,0,.5)'; cx.fillRect(10,44,152,18);
  cx.fillStyle=P_INK; cx.fillRect(11,45,inkBar*1.5,16);
  cx.fillStyle='#fff'; cx.font='11px monospace'; cx.fillText('🎨インク',16,57);

  // 必殺技ゲージ
  cx.fillStyle='rgba(0,0,0,.5)'; cx.fillRect(10,68,152,18);
  const spColor = specialGauge>=100?SPECIAL_COLOR:'#ff8800';
  cx.fillStyle=spColor; cx.fillRect(11,69,specialGauge*1.5,16);
  cx.fillStyle='#fff'; cx.font='11px monospace';
  if(specialGauge>=100){
    const blink=Math.floor(Date.now()/300)%2;
    if(blink){ cx.fillStyle=SPECIAL_COLOR; cx.font='bold 12px monospace'; }
    cx.fillText('💥 必殺技！[Shift/V]',16,81);
  } else {
    cx.fillText(`💥 必殺 ${~~specialGauge}%`,16,81);
  }

  // スコア
  cx.fillStyle='#fff'; cx.font='bold 15px monospace'; cx.textAlign='right';
  cx.fillText('スコア: '+score,W-10,28);

  // 進捗バー
  const pct=Math.min(1,player.x/GOAL_X);
  cx.fillStyle='rgba(0,0,0,.4)'; cx.fillRect(W/2-120,8,240,14);
  cx.fillStyle=P_INK; cx.fillRect(W/2-120,8,240*pct,14);
  cx.fillStyle='#fff'; cx.font='10px monospace'; cx.textAlign='center';
  cx.fillText('ゴールまで '+(100-~~(pct*100))+'%', W/2, 19);

  // 必殺技フラッシュ
  if(specialFlash>0){
    specialFlash--;
    cx.fillStyle=`rgba(255,220,0,${specialFlash/50*0.3})`;
    cx.fillRect(0,0,W,H);
  }
}

function drawTitle(){
  cx.fillStyle='#08183a'; cx.fillRect(0,0,W,H);
  // インクっぽいデコ
  cx.fillStyle=P_INK; cx.globalAlpha=0.15;
  for(let i=0;i<6;i++){
    cx.beginPath(); cx.arc(W*0.1+i*W*0.16,H*0.8,80+i*20,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha=1;

  cx.fillStyle='rgba(0,30,80,.8)';
  cx.fillRect(W/2-290,H/2-180,580,360);
  cx.strokeStyle=P_INK; cx.lineWidth=3;
  cx.strokeRect(W/2-290,H/2-180,580,360);

  cx.fillStyle=P_INK; cx.font=`bold ${Math.min(48,W/12)}px monospace`; cx.textAlign='center';
  cx.fillText('🦑 インクランナー', W/2, H/2-120);

  cx.fillStyle='#fff'; cx.font='16px sans-serif';
  cx.fillText('← → で移動　スペース/Z でジャンプ（二段ジャンプあり！）', W/2, H/2-65);
  cx.fillText('X/C でインク射撃　Shift/V で必殺技！', W/2, H/2-35);
  cx.fillText('自分のインクの上は速い！　敵のインクの上は遅い！', W/2, H/2+5);
  cx.fillStyle='rgba(255,220,100,.9)'; cx.font='bold 14px sans-serif';
  cx.fillText('敵を倒して必殺技ゲージを溜めよう！　必殺技で周囲の敵を一掃！', W/2, H/2+40);

  const blink=Math.floor(Date.now()/600)%2;
  if(blink){ cx.fillStyle='#ffdd00'; cx.font='bold 22px monospace'; cx.fillText('▶ スペースキーでスタート！', W/2, H/2+100); }
}

function drawWin(){
  cx.fillStyle='rgba(0,0,0,.65)'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#ffdd00'; cx.font='bold 54px monospace'; cx.textAlign='center';
  cx.fillText('🎉 クリア！！', W/2, H/2-70);
  cx.fillStyle='#fff'; cx.font='26px sans-serif';
  cx.fillText('スコア: '+score, W/2, H/2-10);
  cx.fillStyle='#aaa'; cx.font='18px sans-serif';
  cx.fillText('スペースでタイトルへ', W/2, H/2+50);
}

function drawGameOver(){
  cx.fillStyle='rgba(0,0,0,.75)'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#ff3355'; cx.font='bold 54px monospace'; cx.textAlign='center';
  cx.fillText('💀 ゲームオーバー', W/2, H/2-70);
  cx.fillStyle='#fff'; cx.font='26px sans-serif';
  cx.fillText('スコア: '+score, W/2, H/2-10);
  cx.fillStyle='#aaa'; cx.font='18px sans-serif';
  cx.fillText('ざんねん！スペースでもういっかい？', W/2, H/2+50);
}

// ========== ループ ==========
function loop(){
  requestAnimationFrame(loop);
  if(state==='title'){ drawBG(); drawTitle(); return; }
  if(state==='play'){ updatePlayer(); updateEnemies(); updateBullets(); updateParticles(); }
  else if(state==='win'||state==='gameover'){ updateParticles(); }
  drawBG();
  drawInk();
  for(const p of PLATS) drawPlatform(p);
  for(const b of bullets) drawBullet(b);
  for(const e of enemies) drawEnemy(e);
  drawPlayer();
  drawParticles();
  drawGoal();
  drawHUD();
  if(state==='win') drawWin();
  if(state==='gameover') drawGameOver();
}

// ========== 入力 ==========
document.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '||e.key==='ArrowUp') e.preventDefault();
  if(state==='title'&&(e.key===' '||e.key==='Enter')){ lives=5; initGame(); state='play'; }
  if((state==='win'||state==='gameover')&&(e.key===' '||e.key==='Enter')) state='title';
});
document.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

window.addEventListener('touchstart', ()=>document.getElementById('tc').classList.add('show'), {once:true});
const $bl=document.getElementById('bl'), $br=document.getElementById('br');
const $bjp=document.getElementById('bjp'), $bsh=document.getElementById('bsh'), $bsp=document.getElementById('bsp');
$bl.addEventListener('touchstart',e=>{e.preventDefault();touchL=true;},{passive:false});
$bl.addEventListener('touchend',()=>touchL=false); $bl.addEventListener('touchcancel',()=>touchL=false);
$br.addEventListener('touchstart',e=>{e.preventDefault();touchR=true;},{passive:false});
$br.addEventListener('touchend',()=>touchR=false); $br.addEventListener('touchcancel',()=>touchR=false);
$bjp.addEventListener('touchstart',e=>{
  e.preventDefault();touchJp=true;jumpQueued=true;
  if(state==='title'){lives=3;initGame();state='play';}
  if(state==='win'||state==='gameover') state='title';
},{passive:false});
$bjp.addEventListener('touchend',()=>touchJp=false); $bjp.addEventListener('touchcancel',()=>touchJp=false);
$bsh.addEventListener('touchstart',e=>{e.preventDefault();touchSh=true;shootQueued=true;},{passive:false});
$bsh.addEventListener('touchend',()=>touchSh=false); $bsh.addEventListener('touchcancel',()=>touchSh=false);
$bsp.addEventListener('touchstart',e=>{e.preventDefault();specialQueued=true;},{passive:false});
$bsp.addEventListener('touchend',()=>touchSp=false);

cv.addEventListener('click',()=>{
  if(state==='title'){lives=3;initGame();state='play';}
  if(state==='win'||state==='gameover') state='title';
});

// ========== 起動 ==========
window.onload = ()=>{ requestAnimationFrame(loop); };
if(document.readyState==='complete'){ requestAnimationFrame(loop); }
</script>
</body>
</html>
