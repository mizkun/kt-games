<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ものづくり工房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{
  font-family:'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
  background:#fdcb6e;height:100dvh;overflow:hidden;
  display:flex;justify-content:center;
}
#game{
  width:min(480px,100vw);height:100dvh;
  position:relative;overflow:hidden;background:#fff;
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  transition:opacity 0.3s,transform 0.3s;
}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(0.97);}

/* タイトル */
#title-screen{
  background:linear-gradient(160deg,#ffeaa7 0%,#fdcb6e 60%,#e17055 100%);
  justify-content:flex-start;
}
#title-hd{width:100%;padding:clamp(14px,4vw,22px) 16px 8px;text-align:center;}
#title-hd h1{font-size:clamp(21px,6vw,32px);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.22);margin-bottom:3px;}
#title-hd p{font-size:clamp(11px,3.2vw,14px);color:rgba(255,255,255,.88);}
#proj-scroll{flex:1;width:100%;overflow-y:auto;padding:10px 14px 20px;display:flex;flex-direction:column;gap:9px;}
.proj-card{
  background:#fff;border-radius:18px;padding:13px 15px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
  transition:transform .15s;border-left:6px solid #fdcb6e;
}
.proj-card:active{transform:scale(.97);}
.proj-card .pe{font-size:clamp(34px,10vw,50px);line-height:1;}
.proj-card .pi{flex:1;}
.proj-card .pn{font-size:clamp(15px,4.5vw,21px);font-weight:bold;color:#2d3436;}
.proj-card .pd{font-size:clamp(10px,2.8vw,12px);color:#636e72;margin-top:2px;}
.proj-card .ps{font-size:clamp(9px,2.5vw,11px);color:#b2bec3;margin-top:3px;}

/* 工房 */
#craft-screen{background:#f8f9fa;justify-content:flex-start;}
#craft-top{
  width:100%;background:#fff;padding:9px 13px;
  display:flex;align-items:center;gap:9px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);z-index:10;
}
#back-btn{
  background:rgba(0,0,0,.06);border:none;border-radius:9px;
  padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit;
}
#craft-ttl{font-size:clamp(14px,4.2vw,19px);font-weight:bold;color:#2d3436;flex:1;}

#step-track{
  width:100%;padding:7px 13px;display:flex;gap:3px;
  background:#fff;border-bottom:1px solid #f0f0f0;overflow-x:auto;
}
.stk{flex:0 0 auto;min-width:18px;height:6px;border-radius:4px;background:#dfe6e9;transition:background .4s;}
.stk.done{background:#00b894;}
.stk.cur{background:#fdcb6e;box-shadow:0 0 5px rgba(253,203,110,.7);}

#inv{
  width:100%;min-height:36px;padding:5px 13px;
  display:flex;flex-wrap:wrap;gap:5px;
  background:#fff;border-bottom:1px solid #f0f0f0;
}
.ibadge{
  background:#f0f7ff;border:1.5px solid #bee3f8;border-radius:18px;
  padding:3px 9px;font-size:clamp(10px,2.8vw,12px);color:#2d6a9f;font-weight:bold;
  animation:pop .3s ease;
}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* メインシーン (canvas) */
#scene-wrap{
  flex:1;width:100%;position:relative;overflow:hidden;cursor:none;
}
#scene-canvas{display:block;width:100%;height:100%;}

/* プログレス */
#prog-wrap{width:100%;padding:7px 13px 9px;background:#fff;border-top:1px solid #f0f0f0;}
#prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
#prog-label{font-size:clamp(11px,3.2vw,13px);color:#636e72;font-weight:bold;}
#prog-cnt{font-size:clamp(10px,2.8vw,12px);color:#b2bec3;}
#prog-bg{height:16px;background:#eee;border-radius:8px;overflow:hidden;}
#prog-bar{height:100%;background:linear-gradient(90deg,#00b894,#00cec9);border-radius:8px;transition:width .12s;}

/* ステップ完了ポップアップ */
#step-pop{
  position:fixed;inset:0;z-index:80;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
}
#step-pop-card{
  background:#fff;border-radius:26px;
  padding:clamp(22px,5.5vw,36px) clamp(26px,7vw,48px);
  text-align:center;box-shadow:0 10px 36px rgba(0,0,0,.25);
  animation:pop .4s ease;max-width:310px;width:90%;
}
#sp-emoji{font-size:clamp(54px,16vw,82px);margin-bottom:9px;}
#sp-title{font-size:clamp(17px,5vw,24px);font-weight:bold;color:#2d3436;margin-bottom:5px;}
#sp-sub{font-size:clamp(11px,3.2vw,14px);color:#636e72;margin-bottom:18px;line-height:1.5;}
#sp-btn{
  background:linear-gradient(135deg,#00b894,#00cec9);color:#fff;
  border:none;border-radius:14px;padding:12px 30px;
  font-size:clamp(14px,4.2vw,19px);font-weight:bold;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(0,184,148,.35);
}

/* 完成 */
#final-screen{
  background:linear-gradient(135deg,#a29bfe,#fd79a8);
  justify-content:center;text-align:center;padding:24px;
}
#fin-emoji{font-size:clamp(88px,27vw,140px);line-height:1;animation:finPop .8s ease;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));}
@keyframes finPop{0%{transform:scale(0)rotate(-20deg);opacity:0}60%{transform:scale(1.22)rotate(5deg)}100%{transform:scale(1)rotate(0);opacity:1}}
#fin-name{font-size:clamp(22px,6.5vw,38px);font-weight:bold;color:#fff;margin:12px 0 5px;text-shadow:0 2px 8px rgba(0,0,0,.2);}
#fin-msg{font-size:clamp(13px,3.8vw,17px);color:rgba(255,255,255,.9);margin-bottom:18px;line-height:1.6;}
#fin-inv{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:18px;max-width:340px;}
.fi{background:rgba(255,255,255,.22);border-radius:14px;padding:4px 11px;font-size:clamp(11px,3vw,13px);color:#fff;font-weight:bold;}
.fbtns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:290px;}
.fbtn{border:none;border-radius:14px;padding:clamp(11px,3.2vw,15px) 18px;font-size:clamp(14px,4.2vw,18px);font-weight:bold;cursor:pointer;font-family:inherit;transition:transform .1s;}
.fbtn:active{transform:scale(.96);}
.fbtn.p{background:#fff;color:#a29bfe;box-shadow:0 4px 12px rgba(0,0,0,.18);}
.fbtn.s{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.45);}

#home-link{position:absolute;top:10px;left:10px;z-index:200;background:rgba(255,255,255,.88);border-radius:18px;padding:5px 11px;font-size:12px;text-decoration:none;color:#555;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,.13);}
</style>
</head>
<body>
<div id="game">
  <a href="../../index.html" id="home-link">🏠 もどる</a>

  <div id="title-screen" class="screen">
    <div id="title-hd">
      <h1>🔨 ものづくり工房</h1>
      <p>素材を集めて一から作ろう！</p>
    </div>
    <div id="proj-scroll"></div>
  </div>

  <div id="craft-screen" class="screen hidden">
    <div id="craft-top">
      <button id="back-btn" onclick="showTitle()">← もどる</button>
      <span id="craft-ttl"></span>
    </div>
    <div id="step-track"></div>
    <div id="inv"></div>
    <div id="scene-wrap">
      <canvas id="scene-canvas"></canvas>
    </div>
    <div id="prog-wrap">
      <div id="prog-row">
        <span id="prog-label"></span>
        <span id="prog-cnt"></span>
      </div>
      <div id="prog-bg"><div id="prog-bar" style="width:0%"></div></div>
    </div>
  </div>

  <div id="final-screen" class="screen hidden">
    <div id="fin-emoji">🐰</div>
    <div id="fin-name">完成！！</div>
    <div id="fin-msg"></div>
    <div id="fin-inv"></div>
    <div class="fbtns">
      <button class="fbtn p" onclick="showTitle()">🔨 ほかのものも作る！</button>
      <button class="fbtn s" onclick="replayCurrent()">🔄 もう一回作る</button>
    </div>
  </div>

  <div id="step-pop">
    <div id="step-pop-card">
      <div id="sp-emoji">🧶</div>
      <div id="sp-title">羊の毛 ゲット！</div>
      <div id="sp-sub">次は「糸に紡ぐ」だよ！</div>
      <button id="sp-btn" onclick="nextStep()">つぎへ →</button>
    </div>
  </div>
</div>

<script>

    { emoji:'🥣', bg:['#fce4ec','#f48fb1'], label:'🌀 全部ぐるぐる混ぜる！', hint:'ぐるぐる円を描こう！速く回すほどいい！', interact:CIRCLE, target:8, result:'生地', rE:'🫙', freq:300 },
    { emoji:'🏺', bg:['#e8eaf6','#9fa8da'], label:'🏺 型に生地を流し込む', hint:'↑↓ 上からドバドバ流し込もう！', interact:DRAG_UD, target:600, result:'型入り生地', rE:'🫙', freq:320 },

// ===== 状態 =====
let proj=null, stepIdx=0, inventory=[];
let audioCtx=null;
let raf=null;
let cW=0, cH=0; // canvas logical size

// インタラクション状態
let IS = {};
function resetIS(){
  IS = {
    prog:0, done:false,
    mx:0, my:0, down:false,
    lastX:0, lastY:0,
    accumDist:0,
    lastAngle:null, totalAngle:0,
    holdMs:0, holdActive:false,
    crackSpots:[], crackHit:0,
    trail:[],
    frame:0,
  };
}

// ===== オーディオ =====
function getAC(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(f,d=.12,v=.1,t='triangle'){
  try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function crackSound(){ beep(180,.06,.2,'sawtooth');setTimeout(()=>beep(120,.1,.15,'sawtooth'),60); }

// ===== 画面管理 =====
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function showTitle(){ if(raf){cancelAnimationFrame(raf);raf=null;} showScreen('title-screen'); }

// ===== タイトル =====
function buildTitle(){
  const sc=document.getElementById('proj-scroll'); sc.innerHTML='';
  PROJECTS.forEach(p=>{
    const c=document.createElement('div'); c.className='proj-card'; c.style.borderLeftColor=p.border;
    c.innerHTML=`<div class="pe">${p.emoji}</div><div class="pi"><div class="pn">${p.name}</div><div class="pd">${p.desc}</div><div class="ps">🔧 ${p.steps.length}ステップ</div></div><div style="font-size:22px;color:#ddd">›</div>`;
    c.onclick=()=>startProject(p); sc.appendChild(c);
  });
}

// ===== プロジェクト開始 =====
function startProject(p){ proj=p; stepIdx=0; inventory=[]; updateInv(); buildTrack(); loadStep(); showScreen('craft-screen'); }
function replayCurrent(){ if(proj) startProject(proj); }

function buildTrack(){
  const t=document.getElementById('step-track'); t.innerHTML='';
  const total=proj.steps.length;
  proj.steps.forEach((_,i)=>{
    const d=document.createElement('div');
    const w=Math.max(18, Math.floor(300/total));
    d.className='stk'+(i===0?' cur':'');
    d.id='tk'+i;
    d.style.width=w+'px';
    t.appendChild(d);
  });
}
function updateTrack(){
  proj.steps.forEach((_,i)=>{ const d=document.getElementById('tk'+i); if(!d)return; d.className='stk'+(i<stepIdx?' done':i===stepIdx?' cur':''); });
}
function updateInv(){
  document.getElementById('inv').innerHTML=inventory.map(i=>`<span class="ibadge">${i.e} ${i.n}</span>`).join('');
}

// ===== ステップ読み込み =====
function loadStep(){
  const step=proj.steps[stepIdx];
  resetIS();
  document.getElementById('craft-ttl').textContent=proj.name+'を作ろう！';
  updateTrack();
  refreshBar();
  // canvas setup
  const wrap=document.getElementById('scene-wrap');
  const canvas=document.getElementById('scene-canvas');
  const dpr=window.devicePixelRatio||1;
  cW=wrap.clientWidth; cH=wrap.clientHeight;
  canvas.width=cW*dpr; canvas.height=cH*dpr;
  canvas.style.width=cW+'px'; canvas.style.height=cH+'px';
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);

  // CRACK用スポット初期化
  if(step.interact===CRACK){
    IS.crackSpots=[
      {x:cW*.5, y:cH*.28, hit:false},
      {x:cW*.33, y:cH*.52, hit:false},
      {x:cW*.67, y:cH*.52, hit:false},
    ];
  }

  // ループ開始
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  const loop=()=>{ IS.frame++; render(canvas,step); raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop);
}

function refreshBar(){
  const step=proj.steps[stepIdx];
  const p=IS.prog||0;
  document.getElementById('prog-bar').style.width=(p*100)+'%';
  document.getElementById('prog-label').textContent=step.label;
  document.getElementById('prog-cnt').textContent=step.interact===HOLD?
    `${Math.floor(p*100)}%` : step.interact===CIRCLE?
    `${Math.floor(p*(step.target||5))}/${step.target||5}周` :
    step.interact===CRACK?`${IS.crackHit||0}/${step.target||3}` :
    step.interact===CLICK?`あと${Math.max(0,Math.ceil((1-p)*(step.target||10)))}かい`:'';
}

// ===== インプット =====
(()=>{
  const wrap=document.getElementById('scene-wrap');
  function pos(e){ const r=wrap.getBoundingClientRect(); const s=e.touches?e.touches[0]:e; return {x:s.clientX-r.left,y:s.clientY-r.top}; }
  wrap.addEventListener('mousedown',e=>{ IS.down=true;IS.holdActive=true; const p=pos(e); IS.mx=p.x;IS.my=p.y;IS.lastX=p.x;IS.lastY=p.y;IS.holdMs=IS.holdMs||0; onTap(p.x,p.y); },false);
  wrap.addEventListener('mousemove',e=>{ const p=pos(e); onMove(p.x,p.y); },false);
  wrap.addEventListener('mouseup',()=>{ IS.down=false;IS.holdActive=false; },false);
  wrap.addEventListener('touchstart',e=>{ e.preventDefault();IS.down=true;IS.holdActive=true; const p=pos(e); IS.mx=p.x;IS.my=p.y;IS.lastX=p.x;IS.lastY=p.y; onTap(p.x,p.y); },{passive:false});
  wrap.addEventListener('touchmove',e=>{ e.preventDefault(); const p=pos(e); onMove(p.x,p.y); },{passive:false});
  wrap.addEventListener('touchend',()=>{ IS.down=false;IS.holdActive=false; },false);
})();

function onTap(x,y){
  const step=proj.steps[stepIdx];
  if(IS.done) return;
  if(step.interact===CLICK){
    const target=step.target||10;
    IS.accumDist+=1;
    IS.prog=Math.min(1,IS.accumDist/target);
    beep(step.freq+(Math.random()-.5)*40+(IS.prog)*80);
    IS.trail.push({x,y,t:Date.now(),type:'click'});
    if(IS.prog>=1){ IS.done=true; setTimeout(()=>stepDone(step),250); }
    refreshBar();
  }
  if(step.interact===CRACK){
    IS.crackSpots.forEach(sp=>{
      if(sp.hit) return;
      const d=Math.hypot(x-sp.x, y-sp.y);
      if(d<55){
        sp.hit=true; IS.crackHit++;
        crackSound();
        IS.trail.push({x:sp.x,y:sp.y,t:Date.now(),type:'crack'});
        IS.prog=IS.crackHit/(step.target||3);
        if(IS.crackHit>=(step.target||3)){ IS.done=true; setTimeout(()=>stepDone(step),600); }
        refreshBar();
      }
    });
  }
}

function onMove(x,y){
  const step=proj.steps[stepIdx];
  if(IS.done) return;
  const px=IS.mx, py=IS.my;
  IS.mx=x; IS.my=y;

  // マウストレイル (全タイプ共通)
  IS.trail.push({x,y,t:Date.now(),type:'move'});
  if(IS.trail.length>120) IS.trail.shift();

  if(step.interact===DRAG_LR && IS.down){
    const dx=Math.abs(x-IS.lastX);
    if(x!==IS.lastX){ IS.accumDist+=dx; IS.prog=Math.min(1,IS.accumDist/(step.target||700)); }
    if(IS.accumDist%80<dx){ beep(step.freq+(Math.random()-.5)*30); }
    if(IS.prog>=1 && !IS.done){ IS.done=true; setTimeout(()=>stepDone(step),200); }
    refreshBar();
  }
  if(step.interact===DRAG_UD && IS.down){
    const dy=Math.abs(y-IS.lastY);
    if(y!==IS.lastY){ IS.accumDist+=dy; IS.prog=Math.min(1,IS.accumDist/(step.target||700)); }
    if(IS.accumDist%80<dy){ beep(step.freq+(Math.random()-.5)*30); }
    if(IS.prog>=1 && !IS.done){ IS.done=true; setTimeout(()=>stepDone(step),200); }
    refreshBar();
  }
  if(step.interact===CIRCLE){
    const cx=cW/2, cy=cH/2;
    const dx=x-cx, dy=y-cy, dist=Math.hypot(dx,dy);
    if(dist>35){
      const angle=Math.atan2(dy,dx);
      if(IS.lastAngle!==null){
        let d=angle-IS.lastAngle;
        while(d>Math.PI) d-=Math.PI*2;
        while(d<-Math.PI) d+=Math.PI*2;
        IS.totalAngle+=Math.abs(d);
        IS.prog=Math.min(1,IS.totalAngle/(Math.PI*2*(step.target||5)));
        if(Math.abs(d)>0.04) beep(step.freq+IS.totalAngle%(Math.PI*2)*15,0.06,0.07);
      }
      IS.lastAngle=angle;
    } else { IS.lastAngle=null; }
    if(IS.prog>=1 && !IS.done){ IS.done=true; setTimeout(()=>stepDone(step),200); }
    refreshBar();
  }
  IS.lastX=x; IS.lastY=y;
}

// HOLD は render ループで処理
let lastFrameTime=0;
function updateHold(step, now){
  if(step.interact!==HOLD) return;
  const dt=now-lastFrameTime;
  if(IS.holdActive){
    IS.holdMs+=dt;
    if(IS.holdMs%80<dt) beep(step.freq+(IS.prog)*200+(Math.random()-.5)*20,0.08,0.07);
  } else {
    IS.holdMs=Math.max(0,IS.holdMs-dt*0.6);
  }
  IS.prog=Math.min(1,IS.holdMs/(step.target||4000));
  if(IS.prog>=1 && !IS.done){ IS.done=true; setTimeout(()=>stepDone(step),300); }
  refreshBar();
}

// ===== レンダリング =====
function render(canvas, step){
  const now=Date.now();
  updateHold(step, now);
  lastFrameTime=now;

  const ctx=canvas.getContext('2d');
  // DPR対応
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const W=cW, H=cH, cx=W/2, cy=H/2;
  const bg=step.bg||['#f5f5f5','#e0e0e0'];
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,bg[0]); grad.addColorStop(1,bg[1]);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // タイプ別レンダリング
  switch(step.interact){
    case DRAG_LR: renderDragLR(ctx,W,H,cx,cy,step); break;
    case DRAG_UD: renderDragUD(ctx,W,H,cx,cy,step); break;
    case CIRCLE:  renderCircle(ctx,W,H,cx,cy,step); break;
    case CRACK:   renderCrack(ctx,W,H,cx,cy,step); break;
    case HOLD:    renderHold(ctx,W,H,cx,cy,step); break;
    case CLICK:   renderClick(ctx,W,H,cx,cy,step); break;
  }

  // マウスカーソル表示
  if(!IS.done){
    ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('👆',IS.mx,IS.my-14);
  }
}

// ===== DRAG_LR =====
function renderDragLR(ctx,W,H,cx,cy,step){
  drawTrail(ctx,'rgba(255,160,50,');

  const a=0.6+0.4*Math.sin(IS.frame*0.08);
  ctx.globalAlpha=a;
  ctx.font=`bold ${Math.floor(W*0.1)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('← →',cx,H*0.82);
  ctx.globalAlpha=1;

  const toolX=IS.down?IS.mx:cx;
  const toolY=IS.down?IS.my:cy;
  const tilt=IS.down?(IS.mx-cx)*0.03:0;
  ctx.save(); ctx.translate(toolX, toolY); ctx.rotate(tilt);
  ctx.font=`${Math.floor(W*0.28)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(step.emoji,0,0);
  ctx.restore();

  if(IS.down){
    ctx.strokeStyle='rgba(255,140,50,0.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(toolX,toolY,30+Math.sin(IS.frame*0.3)*8,0,Math.PI*2);ctx.stroke();
  }
}

// ===== DRAG_UD =====
function renderDragUD(ctx,W,H,cx,cy,step){
  drawTrail(ctx,'rgba(80,180,120,');

  const a=0.6+0.4*Math.sin(IS.frame*0.08);
  ctx.globalAlpha=a;
  ctx.font=`bold ${Math.floor(W*0.1)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('↑ ↓',cx,H*0.82);
  ctx.globalAlpha=1;

  const toolX=IS.down?IS.mx:cx;
  const toolY=IS.down?IS.my:cy;
  ctx.save(); ctx.translate(toolX,toolY);
  const tilt=IS.down?(IS.my-cy)*0.02:0;
  ctx.rotate(tilt);
  ctx.font=`${Math.floor(W*0.28)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(step.emoji,0,0);
  ctx.restore();

  if(IS.down && IS.my>cy && Math.abs(IS.my-IS.lastY)>8){
    ctx.strokeStyle='rgba(80,180,120,0.45)';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(toolX,toolY+30,15+Math.random()*10,0,Math.PI*2);ctx.stroke();
  }
}

// ===== CIRCLE =====
function renderCircle(ctx,W,H,cx,cy,step){
  const r=Math.min(W,H)*0.34;

  ctx.strokeStyle='rgba(150,100,255,0.2)'; ctx.lineWidth=r*0.18; ctx.setLineDash([10,8]);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  const totalTarget=Math.PI*2*(step.target||5);
  const pAngle=IS.totalAngle;
  if(pAngle>0){
    ctx.strokeStyle='rgba(120,60,255,0.65)'; ctx.lineWidth=r*0.15;
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.min(pAngle,totalTarget),false);
    ctx.stroke();
  }

  const fullCircles=Math.floor(IS.totalAngle/(Math.PI*2));
  for(let i=0;i<fullCircles;i++){
    ctx.strokeStyle=`rgba(120,60,255,${0.12+i*0.03})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,r*(0.9-i*0.06),0,Math.PI*2); ctx.stroke();
  }

  const toolAngle=IS.lastAngle||0;
  const toolX=cx+Math.cos(toolAngle)*r;
  const toolY=cy+Math.sin(toolAngle)*r;
  ctx.save(); ctx.translate(toolX,toolY); ctx.rotate(toolAngle+Math.PI/2);
  ctx.font=`${Math.floor(W*0.12)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🥄',0,0);
  ctx.restore();

  ctx.font=`${Math.floor(W*0.2)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(step.emoji,cx,cy);

  const a=0.5+0.4*Math.sin(IS.frame*0.07);
  ctx.globalAlpha=a;
  ctx.font=`${Math.floor(W*0.07)}px sans-serif`; ctx.fillStyle='rgba(100,60,200,0.7)';
  ctx.fillText('ぐるぐる！',cx,cy+r+26);
  ctx.globalAlpha=1;
}

// ===== CRACK =====
function renderCrack(ctx,W,H,cx,cy,step){
  const eW=W*0.42, eH=H*0.52;
  ctx.save(); ctx.translate(cx,cy*0.92);
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.ellipse(0,eH*0.52,eW*0.6,eH*0.12,0,0,Math.PI*2); ctx.fill();
  const eGrad=ctx.createRadialGradient(-eW*.15,-eH*.2,eW*.05,0,0,eW*.7);
  eGrad.addColorStop(0,'#fffef0'); eGrad.addColorStop(0.6,'#fff8e1'); eGrad.addColorStop(1,'#f5e6c8');
  ctx.fillStyle=eGrad;
  ctx.beginPath(); ctx.ellipse(0,0,eW*.5,eH*.5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(180,140,80,0.3)'; ctx.lineWidth=2; ctx.stroke();

  IS.crackSpots.forEach((sp,i)=>{
    const lx=sp.x-cx, ly=sp.y-cy*0.92;
    if(sp.hit){
      ctx.strokeStyle='rgba(120,80,30,0.7)'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(lx-20,ly-10); ctx.lineTo(lx+5,ly+5); ctx.lineTo(lx-10,ly+20); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(lx+20,ly-12); ctx.lineTo(lx-5,ly+3); ctx.lineTo(lx+12,ly+22); ctx.stroke();
      ctx.fillStyle='rgba(250,200,50,0.15)';
      ctx.beginPath(); ctx.arc(lx,ly,24,0,Math.PI*2); ctx.fill();
    } else {
      const pulse=0.6+0.4*Math.sin(IS.frame*0.12+i*1.2);
      ctx.strokeStyle=`rgba(220,50,50,${pulse*0.7})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(lx,ly,26*pulse,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=`rgba(255,80,80,${pulse*0.15})`;
      ctx.beginPath(); ctx.arc(lx,ly,26,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=`rgba(220,50,50,${pulse*0.9})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(lx-10,ly-10); ctx.lineTo(lx+10,ly+10);
      ctx.moveTo(lx+10,ly-10); ctx.lineTo(lx-10,ly+10); ctx.stroke();
    }
  });
  ctx.restore();

  if(IS.crackHit>=(step.target||3)){
    ctx.font=`${Math.floor(W*0.25)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🍳',cx,H*0.75);
  }

  if(IS.crackHit<(step.target||3)){
    ctx.font=`${Math.floor(W*0.052)}px sans-serif`; ctx.fillStyle='rgba(180,60,60,0.75)';
    ctx.textAlign='center'; ctx.textBaseline='top';
    const a=0.7+0.3*Math.sin(IS.frame*0.1);
    ctx.globalAlpha=a;
    ctx.fillText('💥 赤い × をタップ！',cx,H*0.88);
    ctx.globalAlpha=1;
  }
}

// ===== HOLD =====
function renderHold(ctx,W,H,cx,cy,step){
  const r=Math.min(W,H)*0.3;

  if(IS.holdActive){
    for(let i=0;i<6;i++){
      const fx=cx+(Math.random()-.5)*r*.8;
      const fy=cy+r*0.4+(Math.random()-.5)*r*.3;
      ctx.font=`${20+Math.random()*20}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha=0.4+Math.random()*.4;
      ctx.fillText('🔥',fx,fy-Math.random()*30);
      ctx.globalAlpha=1;
    }
  }

  const col=IS.prog<.4?'rgba(50,180,255,':'rgba(255,'+Math.floor(200-IS.prog*200)+',0,';
  ctx.strokeStyle='rgba(200,200,200,0.3)'; ctx.lineWidth=r*.2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

  ctx.strokeStyle=col+'0.8)'; ctx.lineWidth=r*.2;
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+IS.prog*Math.PI*2); ctx.stroke();

  const temp=Math.floor(IS.prog*1500);
  ctx.font=`bold ${Math.floor(W*0.07)}px sans-serif`; ctx.fillStyle='rgba(200,80,20,0.9)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(temp+'℃',cx,cy+r+24);

  const scale=IS.holdActive?1+Math.sin(IS.frame*0.25)*0.04:1;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);
  ctx.font=`${Math.floor(W*0.26)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(step.emoji,0,0);
  ctx.restore();

  const a=0.6+0.4*Math.sin(IS.frame*0.07);
  ctx.globalAlpha=a;
  ctx.font=`${Math.floor(W*0.048)}px sans-serif`; ctx.fillStyle='rgba(180,80,20,0.8)';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(IS.holdActive?'🔥 いいぞ！離すな！':'👇 押し続けよう！',cx,H*0.86);
  ctx.globalAlpha=1;
}

// ===== CLICK =====
function renderClick(ctx,W,H,cx,cy,step){
  IS.trail.filter(t=>t.type==='click').forEach(t=>{
    const age=(Date.now()-t.t)/300;
    if(age>1) return;
    const r=(1-age)*50+10;
    ctx.strokeStyle=`rgba(255,140,0,${1-age})`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(t.x,t.y,r,0,Math.PI*2); ctx.stroke();
  });

  const bounce=Math.sin(IS.frame*0.15)*4;
  ctx.font=`${Math.floor(W*0.3)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(step.emoji,cx,cy+bounce);

  const a=0.6+0.4*Math.sin(IS.frame*0.1);
  ctx.globalAlpha=a;
  ctx.font=`${Math.floor(W*0.07)}px sans-serif`; ctx.fillStyle='rgba(220,120,0,0.8)';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('👆 どんどんタップ！',cx,H*0.82);
  ctx.globalAlpha=1;
}

// ===== 共通トレイル =====
function drawTrail(ctx,colorBase){
  const now=Date.now();
  const pts=IS.trail.filter(t=>t.type==='move'&&now-t.t<500);
  for(let i=1;i<pts.length;i++){
    const age=(now-pts[i].t)/500;
    ctx.strokeStyle=colorBase+(1-age)*0.6+')'; ctx.lineWidth=4*(1-age)+2;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(pts[i-1].x,pts[i-1].y); ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
  }
}

// ===== ステップ完了 =====
function stepDone(step){
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  beep(550,.1); setTimeout(()=>beep(700,.12),130); setTimeout(()=>beep(880,.18),260);
  inventory.push({n:step.result, e:step.rE});
  updateInv();

  if(step.final){ setTimeout(showFinal,400); return; }

  const next=proj.steps[stepIdx+1];
  document.getElementById('sp-emoji').textContent=step.rE;
  document.getElementById('sp-title').textContent=step.result+' ゲット！';
  document.getElementById('sp-sub').textContent=next?`次は「${next.label}」だよ！`:'最終ステップへ！';
  document.getElementById('step-pop').style.display='flex';
}

function nextStep(){
  document.getElementById('step-pop').style.display='none';
  stepIdx++;
  loadStep();
}

// ===== 完成！ =====
function showFinal(){
  document.getElementById('fin-emoji').textContent=proj.emoji;
  document.getElementById('fin-name').textContent=proj.name+' 完成！！🎉';
  document.getElementById('fin-msg').textContent=`すごい！${proj.name}を素材から全部自分で作ったよ！`;
  document.getElementById('fin-inv').innerHTML=inventory.map(i=>`<div class="fi">${i.e} ${i.n}</div>`).join('');
  showScreen('final-screen');
  launchConfetti();
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,.13,'sine'),i*160));
}

function launchConfetti(){
  const fin=document.getElementById('final-screen');
  const emojis=['🎉','✨','🌟','🎊','💫','🎈'];
  for(let i=0;i<26;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.style.cssText=`position:absolute;font-size:22px;left:${Math.random()*100}%;top:-30px;z-index:30;pointer-events:none;`;
      c.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      const tx=(Math.random()-.5)*120, dur=1.8+Math.random()*.8;
      c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${tx}px,130vh) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:dur*1000,fill:'forwards'});
      fin.appendChild(c);
      setTimeout(()=>c.remove(),(dur+.3)*1000);
    },i*95);
  }
}

// ===== 初期化 =====
buildTitle();
showTitle();
</script>
