<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ものづくり工房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
  background:#ffeaa7;
  min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}
#game{
  width:min(480px,100vw);
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:#fff;
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  transition:opacity 0.3s, transform 0.3s;
}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(0.97);}

/* ===== タイトル ===== */
#title-screen{
  background:linear-gradient(160deg,#ffeaa7 0%,#fdcb6e 60%,#e17055 100%);
  padding:0;
  justify-content:flex-start;
}
#title-header{
  width:100%;
  padding:clamp(14px,4vw,24px) clamp(14px,4vw,20px) 8px;
  text-align:center;
}
#title-header h1{
  font-size:clamp(22px,6.5vw,34px);
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,0.2);
  margin-bottom:4px;
}
#title-header p{
  font-size:clamp(12px,3.5vw,15px);
  color:rgba(255,255,255,0.85);
}
#proj-scroll{
  flex:1;
  width:100%;
  overflow-y:auto;
  padding:10px 14px 20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.proj-card{
  background:#fff;
  border-radius:20px;
  padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,0.1);
  transition:transform 0.15s, box-shadow 0.15s;
  border-left:6px solid #fdcb6e;
}
.proj-card:active{transform:scale(0.97);}
.proj-card .pe{font-size:clamp(36px,11vw,52px);line-height:1;}
.proj-card .pinfo{flex:1;}
.proj-card .pname{font-size:clamp(16px,5vw,22px);font-weight:bold;color:#2d3436;}
.proj-card .pdesc{font-size:clamp(11px,3vw,13px);color:#636e72;margin-top:2px;}
.proj-card .psteps{font-size:clamp(10px,2.8vw,12px);color:#b2bec3;margin-top:3px;}

/* ===== 工房 ===== */
#craft-screen{background:#f8f9fa;justify-content:flex-start;}

#craft-topbar{
  width:100%;
  background:#fff;
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.07);
  z-index:10;
}
#back-btn{
  background:rgba(0,0,0,0.06);border:none;border-radius:10px;
  padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;
}
#craft-title{font-size:clamp(15px,4.5vw,20px);font-weight:bold;color:#2d3436;flex:1;}

/* ステップ進捗バー */
#step-track{
  width:100%;
  padding:8px 14px;
  display:flex;gap:5px;
  background:#fff;
  border-bottom:1px solid #f0f0f0;
}
.strack-dot{
  flex:1;height:7px;border-radius:5px;
  background:#dfe6e9;
  transition:background 0.4s;
}
.strack-dot.done{background:#00b894;}
.strack-dot.current{background:#fdcb6e;box-shadow:0 0 6px rgba(253,203,110,0.6);}

/* インベントリ */
#inventory{
  width:100%;
  min-height:38px;
  padding:6px 14px;
  display:flex;flex-wrap:wrap;gap:6px;
  background:#fff;
  border-bottom:1px solid #f0f0f0;
}
.inv-badge{
  background:#f0f7ff;
  border:1.5px solid #bee3f8;
  border-radius:20px;
  padding:3px 10px;
  font-size:clamp(11px,3vw,13px);
  color:#2d6a9f;
  font-weight:bold;
  animation:popIn 0.3s ease;
}
@keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* クリックシーン */
#click-scene{
  flex:1;
  width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background 0.6s;
}
#scene-bg{position:absolute;inset:0;transition:background 0.6s;z-index:0;}
#step-label{
  position:relative;z-index:2;
  font-size:clamp(17px,5.5vw,25px);
  font-weight:bold;color:#2d3436;
  text-shadow:0 1px 6px rgba(255,255,255,0.9);
  margin-bottom:6px;
}
#click-obj{
  position:relative;z-index:2;
  font-size:clamp(80px,25vw,130px);
  line-height:1;
  transition:transform 0.1s;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.2));
  user-select:none;
  pointer-events:none;
}
#click-obj.clicked{animation:clickAnim 0.18s ease;}
@keyframes clickAnim{
  0%{transform:scale(1)rotate(0)}
  40%{transform:scale(0.78)rotate(-12deg)}
  100%{transform:scale(1)rotate(0)}
}
#step-desc{
  position:relative;z-index:2;
  font-size:clamp(12px,3.5vw,16px);
  color:#555;
  text-align:center;padding:0 24px;
  text-shadow:0 1px 4px rgba(255,255,255,0.8);
  margin-top:8px;
}
#tap-hint{
  position:relative;z-index:2;
  font-size:clamp(14px,4vw,18px);
  color:#e17055;font-weight:bold;
  margin-top:12px;
  animation:blink 1.1s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* パーティクル */
.particle{
  position:absolute;
  font-size:20px;
  pointer-events:none;
  z-index:20;
  animation:pfly var(--dur,0.7s) ease-out forwards;
}
@keyframes pfly{
  0%{transform:translate(0,0)scale(1.2);opacity:1}
  100%{transform:translate(var(--tx),var(--ty))scale(0.2);opacity:0}
}

/* プログレス */
#progress-wrap{
  width:100%;padding:8px 14px 10px;
  background:#fff;
  border-top:1px solid #f0f0f0;
}
#progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
#progress-label{font-size:clamp(12px,3.5vw,14px);color:#636e72;font-weight:bold;}
#progress-count{font-size:clamp(11px,3vw,13px);color:#b2bec3;}
#progress-bg{height:18px;background:#eee;border-radius:10px;overflow:hidden;}
#progress-bar{
  height:100%;
  background:linear-gradient(90deg,#00b894,#00cec9);
  border-radius:10px;
  transition:width 0.15s;
}

/* ステップ完了ポップアップ */
#step-popup{
  position:fixed;inset:0;z-index:80;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0.45);
}
#step-popup-card{
  background:#fff;border-radius:28px;
  padding:clamp(24px,6vw,40px) clamp(28px,8vw,52px);
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
  animation:popIn 0.4s ease;
  max-width:320px;width:90%;
}
#popup-emoji{font-size:clamp(56px,18vw,88px);margin-bottom:10px;}
#popup-title{font-size:clamp(18px,5.5vw,26px);font-weight:bold;color:#2d3436;margin-bottom:6px;}
#popup-sub{font-size:clamp(12px,3.5vw,15px);color:#636e72;margin-bottom:20px;line-height:1.5;}
#popup-next-btn{
  background:linear-gradient(135deg,#00b894,#00cec9);
  color:#fff;border:none;border-radius:16px;
  padding:clamp(12px,3vw,16px) clamp(24px,6vw,36px);
  font-size:clamp(15px,4.5vw,20px);font-weight:bold;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px rgba(0,184,148,0.35);
  transition:transform 0.1s;
}
#popup-next-btn:active{transform:scale(0.96);}

/* 完成画面 */
#final-screen{
  background:linear-gradient(135deg,#a29bfe 0%,#fd79a8 100%);
  justify-content:center;
  text-align:center;
  padding:24px;
}
#final-emoji{
  font-size:clamp(90px,28vw,150px);
  line-height:1;
  animation:finalPop 0.8s ease;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,0.3));
}
@keyframes finalPop{
  0%{transform:scale(0)rotate(-20deg);opacity:0}
  60%{transform:scale(1.25)rotate(5deg)}
  100%{transform:scale(1)rotate(0);opacity:1}
}
#final-name{
  font-size:clamp(24px,7vw,40px);font-weight:bold;
  color:#fff;margin:14px 0 6px;
  text-shadow:0 2px 10px rgba(0,0,0,0.25);
}
#final-msg{
  font-size:clamp(14px,4vw,18px);
  color:rgba(255,255,255,0.92);
  margin-bottom:24px;line-height:1.6;
}
#inv-display{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-bottom:20px;max-width:340px;
}
.inv-final{
  background:rgba(255,255,255,0.25);
  border-radius:16px;padding:5px 12px;
  font-size:clamp(12px,3.5vw,14px);color:#fff;font-weight:bold;
}
.final-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;}
.fbtn{
  border:none;border-radius:16px;
  padding:clamp(12px,3.5vw,16px) 20px;
  font-size:clamp(15px,4.5vw,19px);font-weight:bold;
  cursor:pointer;font-family:inherit;
  transition:transform 0.1s;
}
.fbtn:active{transform:scale(0.96);}
.fbtn.primary{background:#fff;color:#a29bfe;box-shadow:0 4px 14px rgba(0,0,0,0.2);}
.fbtn.secondary{background:rgba(255,255,255,0.22);color:#fff;border:2px solid rgba(255,255,255,0.5);}

/* 共通 */
#home-link{
  position:absolute;top:10px;left:10px;z-index:200;
  background:rgba(255,255,255,0.88);border-radius:20px;
  padding:6px 12px;font-size:13px;text-decoration:none;
  color:#555;font-weight:bold;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
</style>
</head>
<body>
<div id="game">
  <a href="../../index.html" id="home-link">🏠 もどる</a>

  <!-- タイトル -->
  <div id="title-screen" class="screen">
    <div id="title-header">
      <h1>🔨 ものづくり工房</h1>
      <p>何を作る？素材を集めて一から作ろう！</p>

  </div>

    </div>
    <div id="step-track"></div>

    <div id="click-scene" ontouchstart="handleTouch(event)" onclick="handleClick(event)">
      <div id="scene-bg"></div>

      <div id="click-obj"></div>
      <div id="step-desc"></div>
      <div id="tap-hint">👆 タップしてね！</div>

    <div id="progress-wrap">
      <div id="progress-row">

        <span id="progress-count"></span>
      </div>
      <div id="progress-bg"><div id="progress-bar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- 完成 -->
  <div id="final-screen" class="screen hidden">
    <div id="final-emoji">🐰</div>
    <div id="final-name">完成！！</div>
    <div id="final-msg"></div>
    <div id="inv-display"></div>
    <div class="final-btns">
      <button class="fbtn primary" onclick="showTitle()">🔨 ほかのものも作る！</button>
      <button class="fbtn secondary" onclick="replayProject()">🔄 もう一回同じのを作る</button>
    </div>
  </div>

  <!-- ステップ完了ポップ -->
  <div id="step-popup">
    <div id="step-popup-card">

      <button id="popup-next-btn" onclick="proceedNext()">つぎへ →</button>
    </div>
  </div>
</div>

// ===== 状態 =====
let proj = null;
let stepIdx = 0;
let clicks = 0;
let inv = [];
let audioCtx = null;
let touchHandled = false;

function getAC(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function beep(f, d=0.12, v=0.1, t='triangle'){
  try{
    const ac=getAC();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}

// ===== 画面 =====
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function showTitle(){
  showScreen('title-screen');
}

// ===== タイトル構築 =====
function buildTitle(){
  const scroll = document.getElementById('proj-scroll');
  scroll.innerHTML = '';
  PROJECTS.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'proj-card';
    card.style.borderLeftColor = p.border;
    card.innerHTML = `
      <div class="pe">${p.emoji}</div>
      <div class="pinfo">
        <div class="pname">${p.name}</div>
        <div class="pdesc">${p.desc}</div>
        <div class="psteps">🔧 ${p.steps.length}ステップ</div>
      </div>
      <div style="font-size:22px;color:#ddd">›</div>
    `;
    card.onclick = ()=>startProject(p);
    scroll.appendChild(card);
  });
}

// ===== プロジェクト開始 =====
function startProject(p){
  proj = p; stepIdx = 0; clicks = 0; inv = [];
  document.getElementById('craft-title').textContent = p.name+'を作ろう！';
  buildTrack();
  updateInv();
  loadStep();
  showScreen('craft-screen');
}
function replayProject(){ if(proj) startProject(proj); }

function buildTrack(){
  const t = document.getElementById('step-track');
  t.innerHTML = '';
  proj.steps.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='strack-dot'+(i===0?' current':'');
    d.id='td'+i;
    t.appendChild(d);
  });
}
function updateTrack(){
  proj.steps.forEach((_,i)=>{
    const d=document.getElementById('td'+i);
    if(!d)return;
    d.className='strack-dot'+(i<stepIdx?' done':i===stepIdx?' current':'');
  });
}

// ===== ステップ読み込み =====
function loadStep(){
  const s = proj.steps[stepIdx];
  clicks = 0;
  document.getElementById('scene-bg').style.background = s.bg;
  document.getElementById('step-label').textContent = s.label;
  document.getElementById('click-obj').textContent = s.emoji;
  document.getElementById('step-desc').textContent = s.desc;
  updateTrack();
  refreshProgress();
}

function refreshProgress(){
  const s = proj.steps[stepIdx];
  const pct = (clicks/s.clicks)*100;
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('progress-label').textContent = `あと${s.clicks-clicks}かい`;
  document.getElementById('progress-count').textContent = `${clicks}/${s.clicks}`;
}

// ===== クリック処理 =====
function handleTouch(e){
  e.preventDefault();
  touchHandled = true;
  const t = e.touches[0];
  doTap(t.clientX, t.clientY);
}
function handleClick(e){
  if(touchHandled){ touchHandled=false; return; }
  doTap(e.clientX, e.clientY);
}
function doTap(cx, cy){
  const s = proj.steps[stepIdx];
  if(clicks >= s.clicks) return;
  clicks++;

  // アニメーション
  const obj = document.getElementById('click-obj');
  obj.classList.remove('clicked');
  void obj.offsetWidth;
  obj.classList.add('clicked');

  // パーティクル
  spawnParticles(cx, cy, s.ptcl);

  // 音
  beep(s.freq + (Math.random()-0.5)*40 + (clicks/s.clicks)*80);

  refreshProgress();

  if(clicks >= s.clicks){
    setTimeout(()=>stepDone(s), 250);
  }
}

function spawnParticles(cx, cy, emoji){
  const scene = document.getElementById('click-scene');
  const r = scene.getBoundingClientRect();
  const x = cx-r.left, y = cy-r.top;
  const count = 5;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=emoji;
    const angle=(Math.PI*2/count*i)+Math.random()*0.6-0.3;
    const dist=55+Math.random()*55;
    p.style.left=x+'px';
    p.style.top=y+'px';
    p.style.setProperty('--tx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist+'px');
    p.style.setProperty('--dur', (0.5+Math.random()*0.4)+'s');
    scene.appendChild(p);
    setTimeout(()=>p.remove(), 1100);
  }
}

// ===== ステップ完了 =====
function stepDone(s){
  beep(550,0.1); setTimeout(()=>beep(700,0.12),130); setTimeout(()=>beep(880,0.18),260);

  inv.push({name:s.result, emoji:s.rEmoji});
  updateInv();

  if(s.final){
    setTimeout(()=>showFinal(), 500);
    return;
  }

  const next = proj.steps[stepIdx+1];
  document.getElementById('popup-emoji').textContent = s.rEmoji;
  document.getElementById('popup-title').textContent = s.result+' ゲット！';
  document.getElementById('popup-sub').textContent =
    next ? `次は「${next.label}」だよ！` : '最終ステップ！';
  document.getElementById('step-popup').style.display='flex';
}

function proceedNext(){
  document.getElementById('step-popup').style.display='none';
  stepIdx++;
  loadStep();
}

function updateInv(){
  const el = document.getElementById('inventory');
  el.innerHTML = inv.map(i=>`<span class="inv-badge">${i.emoji} ${i.name}</span>`).join('');
}

// ===== 完成！ =====
function showFinal(){
  document.getElementById('final-emoji').textContent = proj.emoji;
  document.getElementById('final-name').textContent = proj.name+' 完成！！🎉';
  document.getElementById('final-msg').textContent =
    `すごい！${proj.name}を素材から全部自分で作ったよ！`;
  document.getElementById('inv-display').innerHTML =
    inv.map(i=>`<div class="inv-final">${i.emoji} ${i.name}</div>`).join('');
  showScreen('final-screen');
  launchConfetti();
  // 完成ファンファーレ
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,0.12,'sine'),i*160));
}

function launchConfetti(){
  const fin = document.getElementById('final-screen');
  const emojis=['🎉','✨','🌟','🎊','💫','🎈','⭐'];
  for(let i=0;i<24;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.style.cssText=`position:absolute;font-size:24px;left:${Math.random()*100}%;top:-30px;z-index:30;pointer-events:none;animation:pfly 2.2s ease-in forwards;`;
      c.style.setProperty('--tx',(Math.random()-0.5)*120+'px');
      c.style.setProperty('--ty','130vh');
      c.style.setProperty('--dur','2.2s');
      c.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      fin.appendChild(c);
      setTimeout(()=>c.remove(),2500);
    }, i*90);
  }
}

// ===== 初期化 =====
buildTitle();
showTitle();
</script>
</body>
</html>
