<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🪵 ねんどけずり</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#1a0e08; overflow:hidden; touch-action:none; font-family:-apple-system,sans-serif; }
    canvas { display:block; }
    #home { position:fixed; top:8px; left:10px; color:#aa8866; text-decoration:none; font-size:.75rem; background:rgba(0,0,0,.6); padding:4px 10px; border-radius:10px; z-index:20; }
  </style>
</head>
<body>
<a href="../../index.html" id="home">🏠 ゲームいちらんにもどる</a>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 600);
const H = Math.min(window.innerHeight, 520);
canvas.width = W; canvas.height = H;

const CLAY_LEFT = W * 0.08;
const CLAY_W = W * 0.84;
const CLAY_CY = H * 0.42;
const MAX_R = Math.min(H * 0.3, 105);
const N = 400; // profile resolution

let profile = new Float32Array(N);
let prevProfile = new Float32Array(N);

const CLAY_COLORS = [
  {base:'#cc8844',light:'#eebb77',dark:'#8b5e3c'},
  {base:'#cc4444',light:'#ee8877',dark:'#882222'},
  {base:'#4488cc',light:'#77aaee',dark:'#224466'},
  {base:'#44aa55',light:'#77cc88',dark:'#226633'},
  {base:'#ccaa44',light:'#eedd88',dark:'#886622'},
  {base:'#aa55aa',light:'#dd88dd',dark:'#663366'},
];
let colorIdx = 0;

const TOOLS = [
  {name:'ひろい', w:20, sharp:0.55},
  {name:'せまい', w:6,  sharp:1.0},
  {name:'まるい', w:16, sharp:0.3},
];
let toolIdx = 0;

let shavings = [];
let frame = 0;
let ac = null, noiseNode=null, noiseGain=null, humGain=null;
let isCarving = false;
let mouseX = W/2, mouseY = CLAY_CY;
let carveAmt = 0;

function initAudio() {
  if(ac) return;
  ac = new(window.AudioContext||window.webkitAudioContext)();
  // Lathe hum
  humGain = ac.createGain();
  humGain.gain.value = 0.055;
  humGain.connect(ac.destination);
  const h1 = ac.createOscillator();
  h1.frequency.value = 80; h1.type = 'sawtooth';
  const hf = ac.createBiquadFilter();
  hf.type='lowpass'; hf.frequency.value=200;
  h1.connect(hf); hf.connect(humGain); h1.start();
  const h2 = ac.createOscillator();
  h2.frequency.value=160; h2.type='sine';
  const hg2=ac.createGain(); hg2.gain.value=0.25;
  h2.connect(hg2); hg2.connect(humGain); h2.start();
}

function ensureNoise() {
  if(noiseNode) return;
  const buf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  noiseNode = ac.createBufferSource();
  noiseNode.buffer=buf; noiseNode.loop=true;
  const f = ac.createBiquadFilter();
  f.type='bandpass'; f.frequency.value=1100; f.Q.value=0.7;
  noiseGain = ac.createGain();
  noiseGain.gain.value=0;
  noiseNode.connect(f); f.connect(noiseGain);
  noiseGain.connect(ac.destination);
  noiseNode.start();
}

function setCarveVol(v) {
  if(!ac)return;
  ensureNoise();
  noiseGain.gain.setTargetAtTime(Math.min(0.4,v),ac.currentTime,0.02);
}

function initClay() {
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    profile[i]=MAX_R*0.88*Math.pow(Math.sin(t*Math.PI),0.45);
  }
}

function resetClay(){prevProfile.set(profile);initClay();shavings=[];}
function undoClay(){profile.set(prevProfile);shavings=[];}

function pxToIdx(x){ return Math.max(0,Math.min(N-1,Math.round((x-CLAY_LEFT)/CLAY_W*(N-1)))); }
function idxToX(i){ return CLAY_LEFT+i/(N-1)*CLAY_W; }

function carveAt(mx,my) {
  const idx=pxToIdx(mx);
  if(idx<1||idx>N-2)return;
  const relY=my-CLAY_CY;
  const targetR=Math.max(0,Math.abs(relY)-2);
  const tool=TOOLS[toolIdx];
  let removed=0;
  for(let di=-tool.w;di<=tool.w;di++){
    const ci=idx+di;
    if(ci<0||ci>=N)continue;
    const t=di/tool.w;
    const w=tool.sharp>0.8?Math.max(0,1-Math.abs(t)):Math.exp(-t*t/(2*(1-tool.sharp+0.15)));
    const nr=targetR+(profile[ci]-targetR)*(1-w*0.38);
    const rm=Math.max(0,profile[ci]-nr);
    if(rm>0&&nr<profile[ci]){profile[ci]=Math.max(0,nr);removed+=rm;}
  }
  if(removed>0.3){
    const col=CLAY_COLORS[colorIdx];
    const side=Math.sign(relY)||1;
    for(let p=0;p<Math.min(7,removed*0.5+1);p++){
      shavings.push({
        x:mx+(Math.random()-0.5)*10,
        y:CLAY_CY+profile[idx]*side+(Math.random()-0.5)*4,
        vx:(Math.random()-0.5)*4+(mx-W*0.5)*0.008,
        vy:-Math.random()*3-1,
        life:45+Math.random()*30|0,
        col:col.light,r:1.5+Math.random()*2.5,
        rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.25
      });
    }
    setCarveVol(removed*0.028);
    carveAmt=removed;
  } else {
    setCarveVol(0);carveAmt=0;
  }
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1a10');g.addColorStop(1,'#0d0806');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#110b04';
  ctx.fillRect(0,H*0.76,W,H*0.24);
  ctx.fillStyle='#0d0802';
  ctx.fillRect(W*0.04,H*0.32,W*0.045,H*0.44);
  ctx.fillRect(W*0.915,H*0.32,W*0.045,H*0.44);
  ctx.strokeStyle='rgba(255,180,80,0.1)';
  ctx.lineWidth=1;ctx.setLineDash([4,9]);
  ctx.beginPath();ctx.moveTo(CLAY_LEFT,CLAY_CY);ctx.lineTo(CLAY_LEFT+CLAY_W,CLAY_CY);ctx.stroke();
  ctx.setLineDash([]);
  // Title
  ctx.fillStyle='rgba(180,130,80,0.5)';
  ctx.font=`bold ${W*0.04}px sans-serif`;ctx.textAlign='center';
  ctx.fillText('🪵 ねんどけずり',W/2,H*0.08);
  ctx.font=`${W*0.028}px sans-serif`;
  ctx.fillStyle='rgba(140,100,60,0.5)';
  ctx.fillText('ドラッグしてけずろう！',W/2,H*0.13);
}

function drawClay(){
  const col=CLAY_COLORS[colorIdx];
  const sp=frame*0.09;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=22;ctx.shadowOffsetY=8;
  ctx.beginPath();
  for(let i=0;i<N;i++){const x=idxToX(i);i===0?ctx.moveTo(x,CLAY_CY-profile[i]):ctx.lineTo(x,CLAY_CY-profile[i]);}
  for(let i=N-1;i>=0;i--)ctx.lineTo(idxToX(i),CLAY_CY+profile[i]);
  ctx.closePath();
  const g=ctx.createLinearGradient(0,CLAY_CY-MAX_R,0,CLAY_CY+MAX_R);
  g.addColorStop(0,col.light+'bb');g.addColorStop(0.14,col.light);
  g.addColorStop(0.38,col.base);g.addColorStop(0.68,col.dark);g.addColorStop(1,col.dark+'aa');
  ctx.fillStyle=g;ctx.shadowBlur=0;ctx.fill();
  ctx.clip();
  // Lathe rings
  ctx.lineWidth=0.5;
  for(let xi=0;xi<=CLAY_W;xi+=Math.max(3,CLAY_W/55)){
    const i=Math.round(xi/CLAY_W*(N-1));
    const r=profile[Math.min(N-1,i)];
    if(r<3)continue;
    const phase=(sp+xi*0.26)%(Math.PI*2);
    const ellH=r*0.065*Math.abs(Math.cos(phase))+r*0.014;
    ctx.beginPath();ctx.ellipse(CLAY_LEFT+xi,CLAY_CY,0.5,ellH,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,0.11)';ctx.stroke();
  }
  // Specular
  const sg=ctx.createLinearGradient(0,CLAY_CY-MAX_R,0,CLAY_CY-MAX_R*0.28);
  sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(0.55,'rgba(255,255,255,0.28)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(CLAY_LEFT,CLAY_CY-MAX_R,CLAY_W,MAX_R*0.72);
  ctx.restore();
  // Outline
  ctx.beginPath();
  for(let i=0;i<N;i++){const x=idxToX(i);i===0?ctx.moveTo(x,CLAY_CY-profile[i]):ctx.lineTo(x,CLAY_CY-profile[i]);}
  for(let i=N-1;i>=0;i--)ctx.lineTo(idxToX(i),CLAY_CY+profile[i]);
  ctx.closePath();
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;ctx.stroke();
}

function drawShavings(){
  for(const s of shavings){
    ctx.save();ctx.globalAlpha=s.life/75;
    ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.ellipse(0,0,s.r*1.9,s.r*0.45,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawTool(){
  const tool=TOOLS[toolIdx];
  const vib=isCarving&&carveAmt>1?(Math.random()-0.5)*1.5:0;
  const tx=mouseX+vib,ty=mouseY+vib;
  ctx.save();ctx.translate(tx,ty);
  if(isCarving){ctx.shadowColor=CLAY_COLORS[colorIdx].light;ctx.shadowBlur=14;}
  ctx.beginPath();
  ctx.moveTo(-tool.w*0.55,-16);ctx.lineTo(tool.w*0.55,-16);
  ctx.lineTo(tool.w*0.38,6);ctx.lineTo(0,14);ctx.lineTo(-tool.w*0.38,6);
  ctx.closePath();
  ctx.fillStyle=isCarving?'#dde0ee':'#9aabbc';ctx.fill();
  ctx.strokeStyle='#556677';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-tool.w*0.22,-2);ctx.lineTo(tool.w*0.22,-2);ctx.lineTo(0,14);ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fill();
  ctx.restore();
}

function drawHUD(){
  // Tool buttons
  const btnW=58,btnH=28,btnGap=6;
  const tBtnY=H-42;
  const tTotalW=TOOLS.length*(btnW+btnGap)-btnGap;
  const tStartX=(W-tTotalW)/2;
  ctx.font='12px sans-serif';ctx.textAlign='center';
  for(let i=0;i<TOOLS.length;i++){
    const bx=tStartX+i*(btnW+btnGap);
    ctx.fillStyle=toolIdx===i?'#554422':'#1e1008';
    ctx.fillRect(bx,tBtnY,btnW,btnH);
    ctx.strokeStyle=toolIdx===i?'#ffcc55':'#443322';
    ctx.lineWidth=1.5;ctx.strokeRect(bx,tBtnY,btnW,btnH);
    ctx.fillStyle=toolIdx===i?'#ffdd88':'#886644';
    ctx.fillText(TOOLS[i].name,bx+btnW/2,tBtnY+btnH*0.68);
  }
  // Color buttons
  const cR=11,cGap=8,cY=H-80;
  const cTotalW=CLAY_COLORS.length*(cR*2+cGap)-cGap;
  const cStartX=(W-cTotalW)/2;
  for(let i=0;i<CLAY_COLORS.length;i++){
    const bx=cStartX+i*(cR*2+cGap)+cR;
    ctx.beginPath();ctx.arc(bx,cY,cR,0,Math.PI*2);
    ctx.fillStyle=CLAY_COLORS[i].base;ctx.fill();
    ctx.strokeStyle=colorIdx===i?'#fff':'#555';
    ctx.lineWidth=colorIdx===i?2.5:1;ctx.stroke();
  }
  // Reset/Undo
  const rbX=W-78,rbY=H-88;
  [[rbX,rbY,'リセット','#552211'],[rbX,rbY+32,'もどす','#221133']].forEach(([x,y,txt,c])=>{
    ctx.fillStyle=c;ctx.fillRect(x,y,72,26);
    ctx.strokeStyle='#554433';ctx.lineWidth=1;ctx.strokeRect(x,y,72,26);
    ctx.fillStyle='#aa8866';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText(txt,x+36,y+18);
  });
  // Labels
  ctx.fillStyle='rgba(160,120,70,0.6)';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('ちぜる:',8,H-74);ctx.fillText('いろ:',8,H-44);
}

function update(){
  frame++;
  for(let i=shavings.length-1;i>=0;i--){
    const s=shavings[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.2;s.vx*=0.94;s.rot+=s.rotV;s.life--;
    if(s.life<=0)shavings.splice(i,1);
  }
  if(!isCarving&&noiseGain)noiseGain.gain.setTargetAtTime(0,ac?ac.currentTime:0,0.1);
}

function loop(){update();ctx.clearRect(0,0,W,H);drawBG();drawClay();drawShavings();drawTool();drawHUD();requestAnimationFrame(loop);}

function getPos(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}

function handleDown(e){
  const p=getPos(e);initAudio();
  // Buttons check
  const btnW=58,btnH=28,btnGap=6,tBtnY=H-42;
  const tTotalW=TOOLS.length*(btnW+btnGap)-btnGap,tStartX=(W-tTotalW)/2;
  if(p.y>=tBtnY&&p.y<=tBtnY+btnH){
    for(let i=0;i<TOOLS.length;i++){const bx=tStartX+i*(btnW+btnGap);if(p.x>=bx&&p.x<=bx+btnW){toolIdx=i;return;}}
  }
  const cR=11,cGap=8,cY=H-80;
  const cTotalW=CLAY_COLORS.length*(cR*2+cGap)-cGap,cStartX=(W-cTotalW)/2;
  if(Math.abs(p.y-cY)<cR+6){
    for(let i=0;i<CLAY_COLORS.length;i++){const bx=cStartX+i*(cR*2+cGap)+cR;if(Math.hypot(p.x-bx,p.y-cY)<cR+6){colorIdx=i;return;}}
  }
  const rbX=W-78,rbY=H-88;
  if(p.x>=rbX&&p.x<=rbX+72&&p.y>=rbY&&p.y<=rbY+26){resetClay();return;}
  if(p.x>=rbX&&p.x<=rbX+72&&p.y>=rbY+32&&p.y<=rbY+58){undoClay();return;}
  mouseX=p.x;mouseY=p.y;isCarving=true;
  prevProfile.set(profile);
  carveAt(p.x,p.y);
}
function handleMove(e){
  const p=getPos(e);mouseX=p.x;mouseY=p.y;
  if(isCarving)carveAt(p.x,p.y);
}
function handleUp(){isCarving=false;carveAmt=0;}

canvas.addEventListener('mousedown',e=>handleDown(e));
canvas.addEventListener('mousemove',e=>handleMove(e));
canvas.addEventListener('mouseup',()=>handleUp());
canvas.addEventListener('mouseleave',()=>handleUp());
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleDown(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();handleMove(e);},{passive:false});
canvas.addEventListener('touchend',()=>handleUp());

initClay();
loop();
</script>
</body>
</html>
