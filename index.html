<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 ゲームひろば</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #fafafa;
      color: #333;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #888;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: #e5e5e5;
      border-radius: 12px;
      overflow: hidden;
    }

    .game-item {
      display: block;
      padding: 1.2rem 1.4rem;
      background: #fff;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .game-item:hover {
      background: #f5f5f5;
    }

    .game-item .game-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .game-item .game-desc {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.3rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #aaa;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 ゲームひろば</h1>
      <p>つくったゲームがここにならぶよ</p>
    </header>

    <!-- ゲームが追加されたら .game-list の中に .game-item を追加する -->
    <!--
    <div class="game-list">
      <a href="games/maze-runner/index.html" class="game-item">
        <div class="game-title">めいろランナー</div>
        <div class="game-desc">かべにぶつからないようにゴールをめざそう</div>
      </a>
    </div>
    -->

    <div class="empty-state">
      まだゲームがないよ。<br>
      さいしょのゲームをつくろう！
    </div>

    <footer>
      Powered by Claude Code 🤖
    </footer>
  </div>
</body>
</html>
